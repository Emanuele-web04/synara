[package]
name = "synara-webview"
version = "0.1.0"
edition = "2021"

[build-dependencies]
rn-gpui-module-build = "0.1"

[dependencies]
react-native-gpui = "0.1"
rn-gpui-module = "0.1"
gpui = "0.2"
serde_json = "1"
log = "0.4"
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.57"
webkit2gtk = "2"
x11rb = "0.13"
gtk = "0.18"
glib = "0.18"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_Graphics_DirectComposition",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Globalization",
] }
windows-core = "0.62"

# Its own workspace root, like every module crate.
[workspace]

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false
opt-level = 3

[profile.dev.package.rn-gpui-sys]
opt-level = 0

[patch.crates-io]
# Managed by @react-native-gpui/cli autolink; do not edit between these markers.
# End managed by autolink.
