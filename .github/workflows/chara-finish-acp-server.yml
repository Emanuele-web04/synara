name: Chara finish generic ACP server port

on:
  push:
    branches: [codex/generic-acp-provider]
    paths: [.github/workflows/chara-finish-acp-server.yml]

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/generic-acp-provider
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "false"
      - name: Finish server compatibility port
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected {count}, found {found}: {old!r}")
              p.write_text(text.replace(old, new, count))

          # Generic ACP runtime: current shared runtime uses on-demand auth.
          path = "apps/server/src/provider/acp/GenericAcpSupport.ts"
          patch(path,
              '): Effect.Effect<string | undefined> => {\n  const method = (initializeResult.authMethods ?? []).find((candidate) => candidate.id.trim());\n  return Effect.succeed(method?.id.trim());\n};',
              '): Effect.Effect<string, AcpErrors.AcpError> => {\n  const methodId = (initializeResult.authMethods ?? [])\n    .map((method) => method.id.trim())\n    .find(Boolean);\n  return methodId\n    ? Effect.succeed(methodId)\n    : Effect.fail(\n        new AcpErrors.AcpRequestError({\n          code: -32000,\n          errorMessage: "ACP agent requires authentication but advertised no authentication methods.",\n        }),\n      );\n};')
          patch(path,
              '    "spawn" | "cwd" | "resolveAuthMethodId" | "authentication"\n  >;',
              '    "spawn" | "cwd" | "resolveAuthMethodId" | "authPolicy"\n  >;')
          patch(path,
              '        resolveAuthMethodId: resolveGenericAcpAuthMethodId,\n        authentication: "when-advertised",',
              '        resolveAuthMethodId: resolveGenericAcpAuthMethodId,\n        authPolicy: "on-demand",')

          patch(
              "apps/server/src/provider/acp/GenericAcpSupport.test.ts",
              '  it("allows an ACP agent that does not require client-driven authentication", async () => {\n    await expect(\n      Effect.runPromise(resolveGenericAcpAuthMethodId(initializeResponse([]))),\n    ).resolves.toBeUndefined();\n  });',
              '  it("fails auth-method resolution when authentication is required but none is advertised", async () => {\n    await expect(\n      Effect.runPromise(resolveGenericAcpAuthMethodId(initializeResponse([]))),\n    ).rejects.toThrow("advertised no authentication methods");\n  });',
          )
          patch(
              "apps/server/src/provider/acp/AcpSdkConformance.test.ts",
              '    authentication: "when-advertised",',
              '    authPolicy: "on-demand",',
          )

          # Registry test mirrors live registry's ACP service requirement/order.
          path = "apps/server/src/provider/Layers/ProviderAdapterRegistry.test.ts"
          patch(path,
              'import { AntigravityAdapter, AntigravityAdapterShape } from "../Services/AntigravityAdapter.ts";\n',
              'import { AcpAdapter, AcpAdapterShape } from "../Services/AcpAdapter.ts";\nimport { AntigravityAdapter, AntigravityAdapterShape } from "../Services/AntigravityAdapter.ts";\n')
          fake = '''const fakeAcpAdapter: AcpAdapterShape = {\n  provider: "acp",\n  capabilities: { sessionModelSwitch: "in-session" },\n  startSession: vi.fn(),\n  sendTurn: vi.fn(),\n  interruptTurn: vi.fn(),\n  respondToRequest: vi.fn(),\n  respondToUserInput: vi.fn(),\n  stopSession: vi.fn(),\n  listSessions: vi.fn(),\n  hasSession: vi.fn(),\n  readThread: vi.fn(),\n  rollbackThread: vi.fn(),\n  stopAll: vi.fn(),\n  streamEvents: Stream.empty,\n};\n\n'''
          patch(path, 'const fakeCodexAdapter: CodexAdapterShape = {', fake + 'const fakeCodexAdapter: CodexAdapterShape = {')
          patch(path,
              '        Layer.succeed(PiAdapter, fakePiAdapter),\n      ),',
              '        Layer.succeed(PiAdapter, fakePiAdapter),\n        Layer.succeed(AcpAdapter, fakeAcpAdapter),\n      ),')
          patch(path,
              '      const pi = yield* registry.getByProvider("pi");\n      assert.equal(codex,',
              '      const pi = yield* registry.getByProvider("pi");\n      const acp = yield* registry.getByProvider("acp");\n      assert.equal(codex,')
          patch(path,
              '      assert.equal(pi, fakePiAdapter);\n\n      const providers',
              '      assert.equal(pi, fakePiAdapter);\n      assert.equal(acp, fakeAcpAdapter);\n\n      const providers')
          patch(path,
              '        "opencode",\n        "pi",\n      ]);',
              '        "opencode",\n        "pi",\n        "acp",\n      ]);')

          # Provider health only verifies executable presence/version. ACP auth remains
          # a session-handshake concern.
          path = "apps/server/src/provider/Layers/ProviderHealth.ts"
          patch(path,
              'const PI_PROVIDER = "pi" as const;\ntype ProviderStatuses',
              'const PI_PROVIDER = "pi" as const;\nconst ACP_PROVIDER = "acp" as const;\ntype ProviderStatuses')
          patch(path,
              '  PI_PROVIDER,\n] as const satisfies ReadonlyArray<ProviderKind>;',
              '  PI_PROVIDER,\n  ACP_PROVIDER,\n] as const satisfies ReadonlyArray<ProviderKind>;')
          health = '''\n// ── Generic ACP agent health check ───────────────────────────────\n\nexport const makeCheckAcpProviderStatus = (\n  binaryPath?: string,\n  _args?: ReadonlyArray<string>,\n): Effect.Effect<ServerProviderStatus, never, ChildProcessSpawner.ChildProcessSpawner> =>\n  Effect.gen(function* () {\n    const checkedAt = new Date().toISOString();\n    const executable = nonEmptyTrimmed(binaryPath) ?? "cline";\n    const versionProbe = yield* probeProviderCliVersion(\n      runProviderCommand(executable, ["--version"], providerCommandEnv(ACP_PROVIDER)),\n      DEFAULT_TIMEOUT_MS,\n    );\n\n    if (versionProbe.outcome === "missing") {\n      return {\n        provider: ACP_PROVIDER,\n        status: "error" as const,\n        available: false,\n        authStatus: "unknown" as const,\n        checkedAt,\n        message: `ACP agent executable (${executable}) is not installed or not on PATH.`,\n      } satisfies ServerProviderStatus;\n    }\n    if (versionProbe.outcome === "success") {\n      const version = versionProbe.result;\n      return {\n        provider: ACP_PROVIDER,\n        status: "ready" as const,\n        available: true,\n        authStatus: "unknown" as const,\n        version: parseGenericCliVersion(`${version.stdout}\\n${version.stderr}`),\n        checkedAt,\n        message:\n          "ACP agent executable is installed. Authentication and capabilities are negotiated when a session starts.",\n      } satisfies ServerProviderStatus;\n    }\n    const detail =\n      versionProbe.outcome === "failure"\n        ? versionProbe.cause instanceof Error\n          ? versionProbe.cause.message\n          : String(versionProbe.cause)\n        : versionProbe.outcome === "timeout"\n          ? "The version probe timed out."\n          : detailFromResult(versionProbe.result);\n    return {\n      provider: ACP_PROVIDER,\n      status: "warning" as const,\n      available: true,\n      authStatus: "unknown" as const,\n      checkedAt,\n      message: detail\n        ? `ACP agent is present, but its version probe was inconclusive: ${detail}`\n        : "ACP agent is present, but its version probe was inconclusive.",\n    } satisfies ServerProviderStatus;\n  });\n\nexport const checkAcpProviderStatus = makeCheckAcpProviderStatus();\n\n'''
          patch(path, '// ── Snapshot helpers ────────────────────────────────────────────────\n', health + '// ── Snapshot helpers ────────────────────────────────────────────────\n')
          patch(path,
              '          case "devin":\n            return settings.providers.devin.binaryPath;\n        }',
              '          case "devin":\n            return settings.providers.devin.binaryPath;\n          case "acp":\n            return settings.providers.acp.binaryPath;\n        }')
          patch(path,
              '                checkProviderWhenEnabled(\n                  settings,\n                  PI_PROVIDER,\n                  checkPiProviderStatus(\n                    settings.providers.pi.agentDir,\n                    settings.providers.pi.binaryPath,\n                  ),\n                ),\n              ],',
              '                checkProviderWhenEnabled(\n                  settings,\n                  PI_PROVIDER,\n                  checkPiProviderStatus(\n                    settings.providers.pi.agentDir,\n                    settings.providers.pi.binaryPath,\n                  ),\n                ),\n                checkProviderWhenEnabled(\n                  settings,\n                  ACP_PROVIDER,\n                  makeCheckAcpProviderStatus(\n                    settings.providers.acp.binaryPath,\n                    settings.providers.acp.args,\n                  ),\n                ),\n              ],')

          patch(
              "apps/server/src/provider/skillsCatalog.ts",
              '  devin: ["devin", "claude", "agents"],\n} as const satisfies Partial<Record<ProviderKind, readonly SkillsHomeOrigin[]>>;',
              '  devin: ["devin", "claude", "agents"],\n  acp: [],\n} as const satisfies Partial<Record<ProviderKind, readonly SkillsHomeOrigin[]>>;',
          )
          PY
      - name: Format touched files
        run: >-
          bunx oxfmt
          apps/server/src/provider/acp/GenericAcpSupport.ts
          apps/server/src/provider/acp/GenericAcpSupport.test.ts
          apps/server/src/provider/acp/AcpSdkConformance.test.ts
          apps/server/src/provider/Layers/ProviderAdapterRegistry.test.ts
          apps/server/src/provider/Layers/ProviderHealth.ts
          apps/server/src/provider/skillsCatalog.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Commit progress
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/chara-finish-acp-server.yml
          git config user.name Chara
          git config user.email legend.alkalex07@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix: finish generic ACP server compatibility port"
          git push origin HEAD:codex/generic-acp-provider
      - name: Fail if typecheck still fails
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
