# Only explicitly quarantined Linux geometry tests live here. Every stable
# browser test remains blocking in ci.yml; setup is shared, not test policy.
name: CI Nightly

on:
  schedule:
    # 02:00 UTC daily.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Only the newest scheduled quarantine signal matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-geometry:
    name: Browser Tests (Linux geometry quarantine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup browser runtime
        timeout-minutes: 15
        uses: ./.github/actions/setup-browser

      - name: Browser test (Linux geometry quarantine)
        continue-on-error: true
        timeout-minutes: 10
        run: bun run --cwd apps/web test:browser:geometry
