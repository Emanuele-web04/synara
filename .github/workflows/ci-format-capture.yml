name: CI Format Capture

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  capture:
    if: github.head_ref == 'codex/ci-cross-platform-measurements'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-workspace
        with:
          scope: "static"
      - name: Apply repository formatter
        run: ./node_modules/.bin/oxfmt .github/scripts/ci-contracts.test.mjs
      - name: Show exact formatter diff
        run: git diff -- .github/scripts/ci-contracts.test.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-ci-contract
          path: .github/scripts/ci-contracts.test.mjs
          if-no-files-found: error
