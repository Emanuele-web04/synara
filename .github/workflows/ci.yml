# Independent feedback lanes; the quality job only aggregates results.
# Install scope/cache decisions and measured tradeoffs: .github/CI.md.
# Stable browser coverage blocks PRs; geometry quarantine stays nightly.
name: CI

on:
  pull_request:
  # The merge queue runs every lane before a change reaches main; selection
  # below only narrows pull request feedback.
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

# Stale runs cancelled by a newer push show the gate red, not grey. Main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single heap ceiling for every Node lane (typecheck OOM fix): set once here
# instead of per job so a future bump cannot miss a lane.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Docs-only filter: PRs touching only prose, doc images, or marketing content
  # run static-fast + gate only. outputs.code is 'true' when any code file changed.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.select.outputs.core }}
      web: ${{ steps.select.outputs.web }}
      server: ${{ steps.select.outputs.server }}
      build: ${{ steps.select.outputs.build }}
      windows: ${{ steps.select.outputs.windows }}
    # dorny/paths-filter lists PR files via the API: it needs pull-requests
    # scope on top of the checkout's contents scope (repo default is tighter).
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Reads history: a blobless full clone (commits and trees, blobs on demand).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Filter docs-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Default quantifier is 'some': any matching pattern includes the file,
          # so '!**/*.md' style exclusions never exclude anything and every PR
          # classifies as code. 'every' requires all patterns to match, which is
          # what makes the include-all + exclude-docs combination work.
          predicate-quantifier: "every"
          filters: |
            code:
              # Directory exclusions stay scoped to code-free trees: marketing
              # src ships .tsx under docs/ dirs and web ships a .ts module
              # under assets/, so '**/docs/**' / '**/assets/**' would let real
              # code skip the gate. Every image under .github/ is code-free
              # (PR evidence screenshots, docs assets). Runtime images stay on
              # the code path: browser tests validate app icon transparency
              # and layout.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/*.mdx'
              - '!apps/marketing/content/**'
              - '!.github/**/*.{png,jpg,jpeg,gif,svg,webp,ico}'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Root-only install for turbo; no lifecycle scripts are needed to read the graph.
      - name: Install Turbo
        run: bun install --frozen-lockfile --filter './' --ignore-scripts

      # Pull requests run only the lanes their diff can reach (turbo's package
      # graph plus the global and undeclared edges in scripts/ci-affected.ts).
      # merge_group and push events select every lane.
      - name: Select affected lanes
        id: select
        run: node scripts/ci-affected.ts "$EVENT" "$BASE_SHA" "$HEAD_SHA"
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

  # Root + scripts dependencies suffice for every static check and release smoke.
  # Never wait for the changes job to report formatting or lint failures.
  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: "static"

      - name: Verify CI contracts
        run: node --test .github/scripts/ci-contracts.test.mjs

      # Independent checks share the installed workspace; parallel waits for all
      # of them and fails the lane if any check fails, with separate step logs.
      - parallel:
          - name: Verify Synara identity
            run: bun run brand:check

          - name: Verify Windows runtime boundary
            run: bun run windows-runtime:check

          - name: Verify localization catalogs and report UI coverage
            run: bun run i18n:check && bun run i18n:extract

          - name: Format
            run: bun run fmt:check

          - name: Lint
            run: bun run lint

          - name: Exercise release-only workflow steps
            run: node scripts/release-smoke.ts

  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The single saver for the shared full Linux node_modules key: every other
      # full lane restores only, so a miss is archived once instead of per lane.
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          save-modules: "true"

      - name: Typecheck
        run: bun run typecheck

  # Tests import @synara/contracts from source (its ESM export), so no package
  # build precedes them; every lane starts at the test files. Core, web and
  # server are separate jobs so pull requests can skip a lane their diff
  # cannot reach (scripts/ci-affected.ts); merge_group and main run all three.
  unit_core:
    name: Unit Tests (core)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.core == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Test (core)
        run: bunx turbo run test --filter=@synara/contracts --filter=@synara/shared --filter=@synara/scripts --filter=@synara/desktop --filter=@synara/analytics

  unit_web:
    name: Unit Tests (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.web == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Test (web)
        run: bunx turbo run test --filter=@synara/web

  # Three independent server runners; the measured native 3-way split lowers
  # the slowest shard without changing collected tests.
  unit_server:
    name: Unit Tests (server ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.server == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Linux terminal PTY native dependency
        if: matrix.shard == '1/3'
        run: node scripts/node-pty-smoke.mjs

      # Server lane tests the CLI package (package name @synara/cli).
      - name: Test (server ${{ matrix.shard }})
        run: bunx turbo run test --filter=@synara/cli -- --shard=${{ matrix.shard }}

  # ChatView is one large file, so split it by complementary test-name groups.
  # Other browser files use native 3-way file sharding. Every runner keeps serial
  # execution and the stable geometry quarantine; only distribution changes.
  browser:
    name: Browser Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.web == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        include:
          - project: chat-follow
            shard: 1/1
          - project: chat-projects
            shard: 1/1
          - project: chat-workflows
            shard: 1/1
          - project: components
            shard: 1/3
          - project: components
            shard: 2/3
          - project: components
            shard: 3/3
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # GitHub's pinned Ubuntu image already provides the Chromium shared-library
      # dependencies used by this stable suite. Avoid a redundant apt/font pass on
      # every shard; nightly geometry still uses --with-deps for rendering coverage.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          ./node_modules/.bin/playwright install chromium

      - name: Browser test (${{ matrix.project }} ${{ matrix.shard }})
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"
          # Sole consumer of the electron:true node_modules key.
          save-modules: "true"

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Build analytics dashboard and bundle Worker
        run: |
          bun run --cwd apps/analytics build
          cd apps/analytics
          bunx wrangler deploy --dry-run

      - name: Configure Electron sandbox helper
        run: |
          sandbox_helper="$(node -p "require('node:path').join(require('node:path').dirname(require('./apps/desktop/node_modules/electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox_helper"
          sudo chmod 4755 "$sandbox_helper"

      - name: Verify live Electron browser lifecycle
        run: xvfb-run -a bun run --cwd apps/desktop smoke:browser-lifecycle

      - name: Verify browser navigation preserves composer focus
        run: xvfb-run -a bun run --cwd apps/web test:electron:e2e visibleBrowserMcp.e2e.ts --grep 'preserves composer keyboard ownership'

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  # Aggregate only: no checkout, install, build or test execution.
  # Preserve the branch-protection display name and always() failure handling.
  # Needs every required lane. Matrix jobs report one result covering
  # all shards, so ANY failed shard fails the gate. Docs-only runs pass with
  # heavy lanes skipped (static-fast must still succeed).
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    permissions: {}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - static-fast
      - static-typecheck
      - unit_core
      - unit_web
      - unit_server
      - browser
      - build
      - windows_process
      - migration_lineage
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SELECT_CORE: ${{ needs.changes.outputs.core }}
          SELECT_WEB: ${{ needs.changes.outputs.web }}
          SELECT_SERVER: ${{ needs.changes.outputs.server }}
          SELECT_BUILD: ${{ needs.changes.outputs.build }}
          SELECT_WINDOWS: ${{ needs.changes.outputs.windows }}
          STATIC_FAST: ${{ needs.static-fast.result }}
          TYPECHECK: ${{ needs.static-typecheck.result }}
          UNIT_CORE: ${{ needs.unit_core.result }}
          UNIT_WEB: ${{ needs.unit_web.result }}
          UNIT_SERVER: ${{ needs.unit_server.result }}
          BROWSER: ${{ needs.browser.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS_PROCESS: ${{ needs.windows_process.result }}
          MIGRATION_LINEAGE: ${{ needs.migration_lineage.result }}
        run: |
          fail=0
          # The docs-only filter itself must have run: without it a skip proves nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "changes=$CHANGES (filter must succeed)"
            fail=1
          fi
          if [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "code=$CODE (filter must return true or false)"
            fail=1
          fi
          # Fast static always runs, docs-only or not.
          if [ "$STATIC_FAST" != "success" ]; then
            echo "static-fast=$STATIC_FAST"
            fail=1
          fi
          # name=result=selection; "always" lanes run for every code change.
          for lane in \
            "typecheck=$TYPECHECK=always" \
            "migration-lineage=$MIGRATION_LINEAGE=always" \
            "unit-core=$UNIT_CORE=$SELECT_CORE" \
            "unit-web=$UNIT_WEB=$SELECT_WEB" \
            "unit-server=$UNIT_SERVER=$SELECT_SERVER" \
            "browser=$BROWSER=$SELECT_WEB" \
            "build=$BUILD=$SELECT_BUILD" \
            "windows-process=$WINDOWS_PROCESS=$SELECT_WINDOWS"; do
            name="${lane%%=*}"
            rest="${lane#*=}"
            result="${rest%%=*}"
            selected="${rest#*=}"
            if [ "$CODE" != "true" ]; then
              # Docs-only run: heavy lanes must be skipped, never failed.
              if [ "$result" != "skipped" ]; then
                echo "$name=$result (docs-only run: expected skipped)"
                fail=1
              fi
              continue
            fi
            if [ "$selected" != "always" ] && [ "$selected" != "true" ] && [ "$selected" != "false" ]; then
              echo "$name: selection=$selected (must be true or false)"
              fail=1
            elif [ "$selected" = "false" ] && [ "$EVENT" != "pull_request" ]; then
              # Only pull requests may narrow; the merge queue and main run everything.
              echo "$name: unselected on $EVENT (only pull requests may skip lanes)"
              fail=1
            elif [ "$selected" = "false" ]; then
              if [ "$result" != "skipped" ]; then
                echo "$name=$result (unselected: expected skipped)"
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              echo "$name=$result"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Open the red lane above, not this gate."
            exit 1
          fi

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.windows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: "runtime"

      - name: Test Defender qualification guard contracts
        shell: pwsh
        run: pwsh -NoProfile -NonInteractive -File scripts/verify-windows-defender.test.ps1

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      - name: Test Windows shared runtime and migration recovery
        run: >-
          bun run --cwd packages/shared test
          src/windowsProcess.test.ts
          src/platformProcess.test.ts
          src/processRuntime.test.ts
          src/filesystemPlatform.test.ts
          src/platformEnvironment.test.ts
          src/migrationRecovery.test.ts

      - name: Test Windows server lifecycle and migration recovery
        run: >-
          bun run --cwd apps/server test
          src/platform/processTreeController.test.ts
          src/platform/effectProcessSignals.test.ts
          src/provider/supervisedProcessTeardown.test.ts
          src/provider/providerStartupLifecycle.test.ts
          src/processRunner.test.ts
          src/orchestration/projectImportPaths.test.ts
          src/orchestration/projectImportCatalog.test.ts
          src/windowsProcessEffect.test.ts
          src/persistence/MigrationBackup.test.ts
          src/persistence/Migrations/MigrationReplay.test.ts

      - name: Verify Windows credential reader compilation without credentials
        run: >-
          bun run --cwd apps/server test
          src/providerUsage/providers/droidSecureStorage.test.ts
          -t "compiles the Windows bridge"

      # The 0.6.0 wedge hit Windows hardest, and the repair path is built out of
      # exactly what Windows treats differently: unlinking a marker, reclaiming
      # stranded partials, and renaming a database file that may still be held
      # open. Linux-only coverage cannot speak for any of that.
      - name: Test Windows desktop shutdown and migration recovery
        run: >-
          bun run --cwd apps/desktop test
          src/backendShutdown.windows.integration.test.ts
          src/desktopMigrationRecovery.test.ts

  # Released (id, name) migration pairs are recorded in every user's
  # effect_sql_migrations table, so renumbering or renaming one corrupts existing
  # installs. This job needs the release tags, hence the unshallow checkout; the
  # dependency-free guard needs a real tag history, never a missing-history skip.
  migration_lineage:
    name: Migration Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      # Reads history: a blobless full clone (commits and trees, blobs on demand).
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Verify released migration lineage
        run: |
          test -n "$(git tag --list 'v[0-9]*')" || { echo "::error::Release tags are missing; lineage cannot be verified."; exit 1; }
          node scripts/check-migration-lineage.ts
