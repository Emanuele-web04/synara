# Independent feedback lanes; quality aggregates only. See .github/CI.md.
# Stable browser coverage stays blocking; geometry quarantine stays nightly.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Cancel stale PR runs, never an in-flight main validation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    name: Plan affected validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.plan.outputs.typecheck }}
      unit: ${{ steps.plan.outputs.unit }}
      browser: ${{ steps.plan.outputs.browser }}
      build: ${{ steps.plan.outputs.build }}
      windows: ${{ steps.plan.outputs.windows }}
      migrations: ${{ steps.plan.outputs.migrations }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout tested merge and its parents
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Test CI planning and gate contracts
        run: node --test .github/scripts/ci-plan.test.mjs

      - name: Plan affected lanes
        id: plan
        run: node .github/scripts/ci-plan.mjs

  # Never wait for planning to report formatting/lint failures. Release smoke
  # costs less than a second of work and shares this already-installed workspace.
  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Verify Windows runtime boundary
        run: bun run windows-runtime:check

      - name: Format
        id: format
        run: bun run fmt:check

      - name: Show required formatting changes
        if: failure() && steps.format.outcome == 'failure'
        run: |
          ./node_modules/.bin/oxfmt
          git diff --exit-code

      - name: Lint
        run: bun run lint

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.typecheck == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: bun run typecheck

  # Retain both measured server shards and the shared short-suite runner.
  # Turbo still executes build prerequisites; test results remain uncached.
  unit:
    name: Unit Tests (${{ matrix.pkg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo: "true"

      - name: Verify Linux terminal PTY native dependency
        if: matrix.filters == '--filter=@synara/cli'
        run: node scripts/node-pty-smoke.mjs

      - name: Test (${{ matrix.pkg }})
        run: bunx turbo run test ${{ matrix.filters }} -- ${{ matrix.test-args }}

  # Setup is small relative to testing; reducing these four runners would
  # serialize substantial stable coverage. Do not change their partition here.
  browser:
    name: Browser Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chat-follow
            shard: 1/1
          - project: chat-workflows
            shard: 1/1
          - project: components
            shard: 1/2
          - project: components
            shard: 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # Use the workspace binary: bunx previously stalled after downloading.
      # The OS dependencies must still be installed even on a browser cache hit.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser test (${{ matrix.project }} ${{ matrix.shard }})
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.windows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      # The source-only boundary scanner runs once in static-fast. These are
      # native Windows checks, including real process trees and file recovery.
      - name: Test Windows process runtime
        run: >-
          bun run --cwd packages/shared test
          src/windowsProcess.test.ts
          src/platformProcess.test.ts
          src/processRuntime.test.ts
          src/filesystemPlatform.test.ts
          src/platformEnvironment.test.ts

      - name: Test Windows lifecycle and process trees
        run: >-
          bun run --cwd apps/server test
          src/platform/processTreeController.test.ts
          src/provider/supervisedProcessTeardown.test.ts
          src/provider/providerStartupLifecycle.test.ts
          src/processRunner.test.ts

      - name: Verify Windows credential reader compilation without credentials
        run: >-
          bun run --cwd apps/server test
          src/providerUsage/providers/droidSecureStorage.test.ts
          -t "compiles the Windows bridge"

      - name: Test Effect Windows process spawn
        run: bun run --cwd apps/server test src/windowsProcessEffect.test.ts

      - name: Test Windows desktop backend shutdown
        run: bun run --cwd apps/desktop test src/backendShutdown.windows.integration.test.ts

      - name: Test migration recovery marker
        run: bun run --cwd packages/shared test src/migrationRecovery.test.ts

      - name: Test desktop migration recovery
        run: bun run --cwd apps/desktop test src/desktopMigrationRecovery.test.ts

      - name: Test migration backup and restore
        run: bun run --cwd apps/server test src/persistence/MigrationBackup.test.ts

      - name: Test migration replay
        run: bun run --cwd apps/server test src/persistence/Migrations/MigrationReplay.test.ts

  # Node only: never install the workspace just to read released migration IDs.
  migration_lineage:
    name: Migration Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.migrations == 'true'
    steps:
      - name: Checkout release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Verify released migration lineage
        run: |
          test -n "$(git tag --list 'v[0-9]*')" || { echo "::error::Release tags are missing; lineage cannot be verified."; exit 1; }
          node scripts/check-migration-lineage.ts

  # Branch protection contract. No checkout, install or validation execution.
  # Missing/invalid plans, cancellations and unexpected skips fail closed.
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    needs:
      - changes
      - static-fast
      - static-typecheck
      - unit
      - browser
      - build
      - windows_process
      - migration_lineage
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const needs = JSON.parse(process.env.NEEDS_JSON);
          let failed = false;
          function requireResult(name, expected) {
            const actual = needs[name]?.result;
            if (actual !== expected) {
              console.error(`${name}: expected ${expected}, got ${actual ?? 'missing'}`);
              failed = true;
            }
          }
          requireResult('changes', 'success');
          requireResult('static-fast', 'success');
          const lanes = {
            'static-typecheck': 'typecheck', unit: 'unit', browser: 'browser',
            build: 'build', windows_process: 'windows', migration_lineage: 'migrations',
          };
          for (const [lane, flag] of Object.entries(lanes)) {
            const required = needs.changes?.outputs?.[flag];
            if (required !== 'true' && required !== 'false') {
              console.error(`Invalid or missing plan flag: ${flag}=${required}`);
              failed = true;
            }
            requireResult(lane, required === 'true' ? 'success' : 'skipped');
          }
          if (failed) {
            console.error('Open the failing lane above. Unplanned skips are not successful validation.');
            process.exit(1);
          }
          NODE
