# Fast checks never wait for planning. Typechecking shares a runner with short
# core suites; long unit/browser suites remain parallel. Only build owns Electron.
# Geometry quarantine stays in ci-nightly.yml. See docs/ci-performance.md.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Main runs the full graph and is never cancelled by a newer push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    name: Plan CI and verify migration lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      unit: ${{ steps.plan.outputs.unit }}
      browser: ${{ steps.plan.outputs.browser }}
      build: ${{ steps.plan.outputs.build }}
      windows: ${{ steps.plan.outputs.windows }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout with release history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false

      - name: Test CI selection and gate contracts
        run: node --test .github/scripts/*.test.mjs

      - name: Select affected validation
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node .github/scripts/ci-plan.mjs

      # Share the already-required full checkout, not another runner/install.
      # The local guard may warn on absent history; CI must never accept that.
      - name: Verify released migration lineage
        shell: bash
        run: |
          node scripts/check-migration-lineage.ts | tee "$RUNNER_TEMP/migration-lineage.log"
          grep -q '^Migration lineage check passed:' "$RUNNER_TEMP/migration-lineage.log"

  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Verify Windows runtime boundary
        run: bun run windows-runtime:check

      - name: Format
        id: format
        run: bun run fmt:check

      - name: Show formatting fixes
        if: failure() && steps.format.outcome == 'failure'
        run: |
          bun run fmt
          git diff -- .github docs/ci-performance.md

      - name: Lint
        run: bun run lint

      # The release smoke takes less than a second; reuse this installation.
      # brand:check above is the sole required identity scan.
      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts

  static-typecheck:
    name: Static Checks (typecheck and core tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo: "true"

      - name: Typecheck
        run: bun run typecheck

      # 26s typecheck + 35s core work stays off the critical path while removing
      # one checkout/install. Keep all core packages: scripts have cross-app tests.
      - name: Test core packages
        run: bun run test --filter=@synara/contracts --filter=@synara/shared --filter=@synara/scripts --filter=@synara/desktop

  # Keep the server's serial worker flags and both shards. Turbo still runs
  # package build prerequisites; tests and typechecks remain non-cacheable.
  unit:
    name: Unit Tests (${{ matrix.pkg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo: "true"

      - name: Verify Linux terminal PTY native dependency
        if: matrix.pkg == 'server 1/2'
        run: node scripts/node-pty-smoke.mjs

      - name: Test (${{ matrix.pkg }})
        run: bun run test ${{ matrix.filters }} -- ${{ matrix.test-args }}

  # Retain every stable case and the complementary ChatView project patterns.
  # Measured test work (149-264s) dwarfs Playwright installation (11-13s).
  browser:
    name: Browser Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chat-follow
            shard: 1/1
          - project: chat-workflows
            shard: 1/1
          - project: components
            shard: 1/2
          - project: components
            shard: 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # Use the local binary: bunx previously stalled after the download.
      # The install still verifies the pinned browser and OS dependencies on hits.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser test (${{ matrix.project }} ${{ matrix.shard }})
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.windows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      # The platform-independent boundary scan is owned by static-fast.
      # Keep actual Windows execution separate, including recovery and shutdown.
      - name: Test Windows process runtime
        run: >-
          bun run --cwd packages/shared test
          src/windowsProcess.test.ts
          src/platformProcess.test.ts
          src/processRuntime.test.ts
          src/filesystemPlatform.test.ts
          src/platformEnvironment.test.ts

      - name: Test Windows lifecycle and process trees
        run: >-
          bun run --cwd apps/server test
          src/platform/processTreeController.test.ts
          src/provider/supervisedProcessTeardown.test.ts
          src/provider/providerStartupLifecycle.test.ts
          src/processRunner.test.ts

      - name: Verify Windows credential reader compilation without credentials
        run: >-
          bun run --cwd apps/server test
          src/providerUsage/providers/droidSecureStorage.test.ts
          -t "compiles the Windows bridge"

      - name: Test Effect Windows process spawn
        run: bun run --cwd apps/server test src/windowsProcessEffect.test.ts

      - name: Test Windows desktop backend shutdown
        run: bun run --cwd apps/desktop test src/backendShutdown.windows.integration.test.ts

      # Windows-specific file locking, marker unlink and database rename behavior
      # are first-class requirements, not replaceable by Linux-only coverage.
      - name: Test migration recovery marker
        run: bun run --cwd packages/shared test src/migrationRecovery.test.ts

      - name: Test desktop migration recovery
        run: bun run --cwd apps/desktop test src/desktopMigrationRecovery.test.ts

      - name: Test migration backup and restore
        run: bun run --cwd apps/server test src/persistence/MigrationBackup.test.ts

      - name: Test migration replay
        run: bun run --cwd apps/server test src/persistence/Migrations/MigrationReplay.test.ts

  # Aggregation only: no checkout, dependency setup or validation commands here.
  # Preserve the externally required display name and always evaluate failures.
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, static-fast, static-typecheck, unit, browser, build, windows_process]
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          node <<'GATE'
          // BEGIN GATE CONTRACT (executed verbatim by ci-plan.test.mjs)
          const needs = JSON.parse(process.env.NEEDS);
          const outputs = needs.changes?.outputs ?? {};
          const expected = {
            "static-typecheck": "code",
            unit: "unit",
            browser: "browser",
            build: "build",
            windows_process: "windows",
          };
          const errors = [];
          for (const job of ["changes", "static-fast"]) {
            if (needs[job]?.result !== "success") errors.push(`${job}: expected success`);
          }
          for (const flag of ["code", "unit", "browser", "build", "windows"]) {
            if (!["true", "false"].includes(outputs[flag])) errors.push(`Invalid plan flag: ${flag}`);
            if (flag !== "code" && outputs[flag] === "true" && outputs.code !== "true") {
              errors.push(`${flag} selected without code validation`);
            }
          }
          for (const [job, flag] of Object.entries(expected)) {
            const wanted = outputs[flag] === "true" ? "success" : "skipped";
            if (needs[job]?.result !== wanted) {
              errors.push(`${job}: expected ${wanted}, received ${needs[job]?.result}`);
            }
          }
          if (errors.length) throw new Error(`CI gate failed. Open the named lane:\n${errors.join("\n")}`);
          // END GATE CONTRACT
          GATE
