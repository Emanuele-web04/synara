# Static checks share one workspace. Long-running unit/browser/build/Windows
# lanes stay parallel. See docs/ci.md for admission rules and measured tradeoffs.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  changes:
    name: Plan affected validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      typecheck: ${{ steps.plan.outputs.typecheck }}
      product: ${{ steps.plan.outputs.product }}
      unit: ${{ steps.plan.outputs.unit }}
      browser: ${{ steps.plan.outputs.browser }}
      build: ${{ steps.plan.outputs.build }}
      windows: ${{ steps.plan.outputs.windows }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      full: ${{ steps.plan.outputs.full }}
    steps:
      - name: Checkout tested merge and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Test CI admission and gate contracts
        run: node --test scripts/ci/*.check.mjs

      - name: Plan validation from workspace dependencies
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci/plan.mjs

  static-fast:
    name: Static Checks and Compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    outputs:
      typecheck: ${{ steps.typecheck.outcome }}
      lineage: ${{ steps.lineage.outcome }}
      release: ${{ steps.release.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The lineage guard needs every release tag, not just the latest one.
          fetch-depth: ${{ needs.changes.outputs.product == 'true' && '0' || '1' }}
          persist-credentials: false

      - name: Setup workspace
        id: setup
        uses: ./.github/actions/setup-workspace

      # Independent checks still report after another check fails. No failure
      # is forgiven: the job remains red and the gate checks merged outcomes.
      - name: Validate GitHub Actions syntax and expressions
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.full == 'true' }}
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color .github/workflows/ci.yml .github/workflows/ci-nightly.yml

      - name: Verify Synara identity
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run brand:check

      - name: Verify Windows runtime boundary
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run windows-runtime:check

      - name: Format
        id: format
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run fmt:check

      - name: Lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: bun run lint

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.typecheck == 'true' }}
        run: bun run typecheck

      - name: Verify released migration lineage
        id: lineage
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.product == 'true' }}
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          test -n "$(git tag --list 'v[0-9]*')"
          bun run migrations:check

      - name: Exercise release-only workflow steps
        id: release
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && needs.changes.outputs.product == 'true' }}
        run: bun run release:smoke

      - name: Prepare formatting repair patch
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        run: |
          bun run fmt
          git diff --binary > "${RUNNER_TEMP}/format.patch"

      - name: Upload formatting repair patch
        if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: formatting-repair
          path: ${{ runner.temp }}/format.patch
          retention-days: 3

  unit:
    name: Unit Tests (${{ matrix.pkg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.unit == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.unit_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          turbo: "true"

      - name: Verify Linux terminal PTY native dependency
        if: matrix.server
        run: node scripts/node-pty-smoke.mjs

      - name: Test (${{ matrix.pkg }})
        env:
          UNIT_FILTERS: ${{ matrix.filters }}
          TEST_ARGS: ${{ matrix.args }}
        run: |
          # Planner emits validated package names and fixed shard arguments.
          read -r -a filters <<< "$UNIT_FILTERS"
          read -r -a args <<< "$TEST_ARGS"
          bunx turbo run test "${filters[@]}" -- "${args[@]}"

  browser:
    name: Browser Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.browser == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chat-follow
            shard: 1/1
          - project: chat-workflows
            shard: 1/1
          - project: components
            shard: 1/2
          - project: components
            shard: 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Setup browser runtime
        timeout-minutes: 15
        uses: ./.github/actions/setup-browser

      - name: Browser test (${{ matrix.project }} ${{ matrix.shard }})
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"
          turbo: "true"

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.windows == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      - name: Test Windows shared process and recovery runtime
        run: >-
          bun run --cwd packages/shared test
          src/windowsProcess.test.ts
          src/platformProcess.test.ts
          src/processRuntime.test.ts
          src/filesystemPlatform.test.ts
          src/platformEnvironment.test.ts
          src/migrationRecovery.test.ts

      - name: Test Windows server lifecycle, migration backup and replay
        run: >-
          bun run --cwd apps/server test
          src/platform/processTreeController.test.ts
          src/provider/supervisedProcessTeardown.test.ts
          src/provider/providerStartupLifecycle.test.ts
          src/processRunner.test.ts
          src/windowsProcessEffect.test.ts
          src/persistence/MigrationBackup.test.ts
          src/persistence/Migrations/MigrationReplay.test.ts

      - name: Verify Windows credential reader compilation without credentials
        run: >-
          bun run --cwd apps/server test
          src/providerUsage/providers/droidSecureStorage.test.ts
          -t "compiles the Windows bridge"

      - name: Test Windows desktop shutdown and migration recovery
        run: >-
          bun run --cwd apps/desktop test
          src/backendShutdown.windows.integration.test.ts
          src/desktopMigrationRecovery.test.ts

  # Required check contract: aggregator only, no checkout/setup/validation here.
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, static-fast, unit, browser, build, windows_process]
    if: always()
    steps:
      - name: Aggregate lane and merged-check results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          // BEGIN GATE CONTRACT (executed verbatim by gate.check.mjs)
          const needs = JSON.parse(process.env.NEEDS_JSON);
          const errors = [];
          const expect = (name, actual, expected) => {
            if (actual !== expected) errors.push(`${name}: expected ${expected}, got ${actual}`);
          };
          expect("changes", needs.changes?.result, "success");
          const plan = needs.changes?.outputs ?? {};
          for (const flag of ["typecheck", "product", "unit", "browser", "build", "windows"]) {
            if (plan[flag] !== "true" && plan[flag] !== "false") {
              errors.push(`Invalid admission output ${flag}: ${plan[flag]}`);
            }
          }
          expect("static-fast", needs["static-fast"]?.result, "success");
          for (const [lane, flag] of Object.entries({
            unit: "unit", browser: "browser", build: "build", windows_process: "windows",
          })) {
            expect(lane, needs[lane]?.result, plan[flag] === "true" ? "success" : "skipped");
          }
          for (const [step, flag] of Object.entries({
            typecheck: "typecheck", lineage: "product", release: "product",
          })) {
            expect(`static/${step}`, needs["static-fast"]?.outputs?.[step],
              plan[flag] === "true" ? "success" : "skipped");
          }
          if (errors.length) {
            for (const error of errors) console.error(error);
            console.error("Open the failing lane above; missing or unexpected skips are failures.");
            process.exitCode = 1;
          }
          // END GATE CONTRACT
          NODE
