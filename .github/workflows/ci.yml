# Lane rule: static-fast is fast checks with no special runtime, static-typecheck is tsc,
# unit runs Vitest through Turbo, browser owns Playwright (stable only, sharded),
# build owns Electron and desktop output. Geometry quarantine lives in ci-nightly.yml.
# Gate (quality) aggregates only: add no run steps there. A new fast check with no runtime goes to static-fast.
# Setup-workspace runs once per lane, not once for all: never put checks in the shared action.
name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Stale runs cancelled by a newer push show the gate red, not grey. Main never cancels.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Single heap ceiling for every Node lane (typecheck OOM fix): set once here
# instead of per job so a future bump cannot miss a lane.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  # Docs-only filter: PRs touching only prose, doc images, or marketing content
  # run static-fast + gate only. outputs.code is 'true' when any code file changed.
  changes:
    name: Detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    # dorny/paths-filter lists PR files via the API: it needs pull-requests
    # scope on top of the checkout's contents scope (repo default is tighter).
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Filter docs-only changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # Default quantifier is 'some': any matching pattern includes the file,
          # so '!**/*.md' style exclusions never exclude anything and every PR
          # classifies as code. 'every' requires all patterns to match, which is
          # what makes the include-all + exclude-docs combination work.
          predicate-quantifier: "every"
          filters: |
            code:
              # Directory exclusions stay scoped to code-free trees: marketing
              # src ships .tsx under docs/ dirs and web ships a .ts module
              # under assets/, so '**/docs/**' / '**/assets/**' would let real
              # code skip the gate. Every image under .github/ is code-free
              # (PR evidence screenshots, docs assets). Runtime images stay on
              # the code path: browser tests validate app icon transparency
              # and layout.
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!**/*.mdx'
              - '!apps/marketing/content/**'
              - '!.github/**/*.{png,jpg,jpeg,gif,svg,webp,ico}'

  # Phase 1b: the old static lane split. Fast checks (no special runtime) stay
  # unblocked so docs-only PRs get a signal in ~1min.
  static-fast:
    name: Static Checks (fast)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Verify Windows runtime boundary
        run: bun run windows-runtime:check

      - name: Format
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

  static-typecheck:
    name: Static Checks (typecheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Typecheck
        run: bun run typecheck

  # Group short suites to share setup and leave runner capacity for other PRs.
  # Server files are split across two runners, retaining their serial worker
  # flags within each shard. Turbo still runs each package's build prerequisites.
  unit:
    name: Unit Tests (${{ matrix.pkg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        include:
          - pkg: core
            filters: "--filter=@synara/contracts --filter=@synara/shared --filter=@synara/scripts --filter=@synara/desktop"
            test-args: ""
          - pkg: web
            filters: "--filter=@synara/web"
            test-args: ""
          # Server lane tests the CLI package (package name @synara/cli).
          - pkg: server 1/2
            filters: "--filter=@synara/cli"
            test-args: "--shard=1/2"
          - pkg: server 2/2
            filters: "--filter=@synara/cli"
            test-args: "--shard=2/2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Linux terminal PTY native dependency
        if: matrix.filters == '--filter=@synara/cli'
        run: node scripts/node-pty-smoke.mjs

      - name: Test (${{ matrix.pkg }})
        run: bunx turbo run test ${{ matrix.filters }} -- ${{ matrix.test-args }}

  # File sharding cannot split the large ChatView suite. Run its follow matrix
  # and remaining cases separately, plus two shards of all other browser files.
  # Every runner retains the stable suite's serial execution and quarantine.
  browser:
    name: Browser Tests (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    strategy:
      # Deliberate non-default: one shard's failure must not cancel the other
      # shards, so every lane reports complete signal for the gate.
      fail-fast: false
      matrix:
        include:
          - project: chat-follow
            shard: 1/1
          - project: chat-workflows
            shard: 1/1
          - project: components
            shard: 1/2
          - project: components
            shard: 2/2
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}

      # Run the workspace-local playwright binary directly: bunx stalled after
      # the chromium download on hosted runners. The step timeout stops any
      # remaining apt/download stalls from eating the whole job budget.
      - name: Install browser test runtime
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          cd apps/web
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Browser test (${{ matrix.project }} ${{ matrix.shard }})
        timeout-minutes: 20
        run: bun run --cwd apps/web test:browser:ci -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}

  build:
    name: Desktop Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          electron: "true"

      - name: Build desktop pipeline
        run: bun run build:desktop

      - name: Verify preload bundle output
        run: |
          test -f apps/desktop/dist-electron/preload.js
          grep -nE "desktopBridge|getWsUrl|PICK_FOLDER_CHANNEL|wsUrl" apps/desktop/dist-electron/preload.js

  # Aggregate only: no checkout, no run steps. Keep the old display name for branch protection. if: always() is intended, do not remove.
  # Phase 2g: needs every required lane. Matrix jobs report one result covering
  # all shards, so ANY failed shard fails the gate. Docs-only runs pass with
  # heavy lanes skipped (static-fast must still succeed).
  quality:
    name: Format, Lint, Typecheck, Test, Browser Test, Build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs:
      - changes
      - static-fast
      - static-typecheck
      - unit
      - browser
      - build
      - windows_process
      - migration_lineage
      - release_smoke
    if: always()
    steps:
      - name: Aggregate lane results
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          STATIC_FAST: ${{ needs.static-fast.result }}
          TYPECHECK: ${{ needs.static-typecheck.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          BUILD: ${{ needs.build.result }}
          WINDOWS_PROCESS: ${{ needs.windows_process.result }}
          MIGRATION_LINEAGE: ${{ needs.migration_lineage.result }}
          RELEASE_SMOKE: ${{ needs.release_smoke.result }}
        run: |
          fail=0
          # The docs-only filter itself must have run: without it a skip proves nothing.
          if [ "$CHANGES" != "success" ]; then
            echo "changes=$CHANGES (filter must succeed)"
            fail=1
          fi
          if [ "$CODE" != "true" ] && [ "$CODE" != "false" ]; then
            echo "code=$CODE (filter must return true or false)"
            fail=1
          fi
          # Fast static always runs, docs-only or not.
          if [ "$STATIC_FAST" != "success" ]; then
            echo "static-fast=$STATIC_FAST"
            fail=1
          fi
          for lane in "typecheck=$TYPECHECK" "unit=$UNIT" "browser=$BROWSER" "build=$BUILD" "windows-process=$WINDOWS_PROCESS" "migration-lineage=$MIGRATION_LINEAGE" "release-smoke=$RELEASE_SMOKE"; do
            name="${lane%%=*}"
            result="${lane#*=}"
            if [ "$CODE" != "true" ]; then
              # Docs-only run: heavy lanes must be skipped, never failed.
              if [ "$result" != "skipped" ]; then
                echo "$name=$result (docs-only run: expected skipped)"
                fail=1
              fi
            elif [ "$result" != "success" ]; then
              echo "$name=$result"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Open the red lane above, not this gate."
            exit 1
          fi

  windows_process:
    name: Windows Process Regression
    runs-on: windows-2022
    timeout-minutes: 15
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace

      - name: Verify Windows terminal PTY native dependency under Bun
        run: bun scripts/node-pty-smoke.mjs

      - name: Verify Windows runtime boundary
        run: bun run windows-runtime:check

      - name: Test Windows process runtime
        run: >-
          bun run --cwd packages/shared test
          src/windowsProcess.test.ts
          src/platformProcess.test.ts
          src/processRuntime.test.ts
          src/filesystemPlatform.test.ts
          src/platformEnvironment.test.ts

      - name: Test Windows lifecycle and process trees
        run: >-
          bun run --cwd apps/server test
          src/platform/processTreeController.test.ts
          src/provider/supervisedProcessTeardown.test.ts
          src/provider/providerStartupLifecycle.test.ts
          src/processRunner.test.ts

      - name: Verify Windows credential reader compilation without credentials
        run: >-
          bun run --cwd apps/server test
          src/providerUsage/providers/droidSecureStorage.test.ts
          -t "compiles the Windows bridge"

      - name: Test Effect Windows process spawn
        run: bun run --cwd apps/server test src/windowsProcessEffect.test.ts

      - name: Test Windows desktop backend shutdown
        run: bun run --cwd apps/desktop test src/backendShutdown.windows.integration.test.ts

      # The 0.6.0 wedge hit Windows hardest, and the repair path is built out of
      # exactly what Windows treats differently: unlinking a marker, reclaiming
      # stranded partials, and renaming a database file that may still be held
      # open. Linux-only coverage cannot speak for any of that.
      - name: Test migration recovery marker
        run: bun run --cwd packages/shared test src/migrationRecovery.test.ts

      - name: Test desktop migration recovery
        run: bun run --cwd apps/desktop test src/desktopMigrationRecovery.test.ts

      - name: Test migration backup and restore
        run: bun run --cwd apps/server test src/persistence/MigrationBackup.test.ts

      - name: Test migration replay
        run: bun run --cwd apps/server test src/persistence/Migrations/MigrationReplay.test.ts

  # Released (id, name) migration pairs are recorded in every user's
  # effect_sql_migrations table, so renumbering or renaming one corrupts existing
  # installs. This job needs the release tags, hence the unshallow checkout; the
  # guard itself is dependency-free and skips with a warning if tags are missing.
  migration_lineage:
    name: Migration Lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Verify released migration lineage
        run: node scripts/check-migration-lineage.ts

  release_smoke:
    name: Release Smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
