name: Project relocation verification

on:
  push:
    branches: [fix/project-relocation-recovery]
    paths: [.github/workflows/project-relocation-development.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/fix/project-relocation-recovery' && github.repository == 'Emanuele-web04/synara'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Check out exact source without initializing submodules
        run: |
          git init
          git remote add origin https://github.com/Emanuele-web04/synara.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
      - name: Format check
        run: bun run fmt:check
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Windows runtime boundary
        run: bun run windows-runtime:check
      - name: Shared process regression tests
        run: bun run --cwd packages/shared test -- src/processSpawnOutcome.test.ts src/processRuntime.test.ts
      - name: Server relocation and teardown tests
        run: bun run --cwd apps/server test -- src/orchestration/decider.projectRelocation.test.ts src/orchestration/projectRelocationPaths.test.ts src/platform/supervisedProcessSpawnFailure.test.ts src/platform/supervisedProcessTeardown.test.ts src/orchestration/dispatchCommandNormalization.test.ts
      - name: Provider lifecycle regression tests
        run: bun run --cwd apps/server test -- src/orchestration/Layers/ProviderCommandReactor.test.ts
      - name: Web relocation tests
        run: bun run test:web:focused src/lib/projectRelocation.test.ts
