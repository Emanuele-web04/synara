name: CI alternatives evaluation

on:
  push:
    branches: [codex/ci-cross-platform-evidence]
    paths: [.github/workflows/ci-evaluate.yml, .github/scripts/ci-timing-reporter.mjs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-evaluate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux workload (${{ matrix.runner }}, ${{ matrix.suite }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        suite: [server, browser]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install identical runtime dependencies
        run: bun install --frozen-lockfile --filter '!@synara/marketing'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install browser runtime
        if: matrix.suite == 'browser'
        run: apps/web/node_modules/.bin/playwright install --with-deps chromium
      - name: Profile unchanged test workload twice
        env:
          SUITE: ${{ matrix.suite }}
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          mkdir -p "$RUNNER_TEMP/timings"
          for sample in 1 2; do
            export CI_TIMINGS_FILE="$RUNNER_TEMP/timings/$sample.json"
            if [ "$SUITE" = server ]; then
              node scripts/node-pty-smoke.mjs
              /usr/bin/time -p bun run --cwd apps/server test --reporter=default --reporter="$GITHUB_WORKSPACE/.github/scripts/ci-timing-reporter.mjs"
            else
              /usr/bin/time -p bun run --cwd apps/web test:browser:ci -- --project=chat-workflows --reporter=default --reporter="$GITHUB_WORKSPACE/.github/scripts/ci-timing-reporter.mjs"
            fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timings-${{ matrix.runner }}-${{ matrix.suite }}
          path: ${{ runner.temp }}/timings
          retention-days: 7
          if-no-files-found: error
