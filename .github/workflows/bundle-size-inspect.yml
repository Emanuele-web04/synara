name: Inspect bundle dependencies
on:
  push:
    branches: [perf/production-bundle-size-audit]
    paths: [.github/workflows/bundle-size-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dd88d9272f97e4dda5735281e73ce14de388ad25
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Collect frozen build and runtime package inputs
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { cpSync, mkdirSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';
          const dest = join(process.env.RUNNER_TEMP, 'dependency-inputs');
          mkdirSync(dest, { recursive: true });
          const packages = ['@anthropic-ai/claude-agent-sdk', 'effect', '@effect/platform-node', '@effect/platform-node-shared', '@google/genai', '@earendil-works/pi-coding-agent', 'web-streams-polyfill', 'node-pty', '@pierre/diffs', 'oxfmt', 'oxlint', 'tsdown', 'rolldown'];
          for (const scope of ['@oxfmt', '@oxlint', '@rolldown']) {
            for (const name of readdirSync(join('node_modules', scope))) packages.push(`${scope}/${name}`);
          }
          for (const name of packages) cpSync(join('node_modules', name), join(dest, 'node_modules', name), { recursive: true, dereference: true });
          NODE
          tar -czf "$RUNNER_TEMP/dependency-inputs.tar.gz" -C "$RUNNER_TEMP/dependency-inputs" .
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-dependency-inputs
          path: ${{ runner.temp }}/dependency-inputs.tar.gz
          retention-days: 7
