# Temporary review runner; final publication removes this file.
name: Native editor tools review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-tools-review.yml]
permissions:
  contents: read
concurrency:
  group: editor-tools-review-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: 8213a9ef84393b827c3f03dd0dcbb04986a691d2
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Preserve the real modal accessibility boundary
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const file='apps/web/e2e/editorToolsRail.e2e.ts';
          const before='  await expect(outline).toHaveAttribute("aria-pressed", "true");';
          const source=await readFile(file,'utf8');
          if(source.split(before).length!==2)throw new Error('Expected one selected-state assertion');
          await writeFile(file,source.replace(before,`  // Modal isolation correctly removes the underlying rail from the accessibility tree.
          await expect(page.locator('nav[aria-label="Editor activity bar"] button[aria-label="Outline"]')).toHaveAttribute("aria-pressed", "true");`));
          NODE
          ./node_modules/.bin/oxfmt apps/web/e2e/editorToolsRail.e2e.ts
      - name: Preserve exact normalized test candidate without updating refs
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile,appendFile} from 'node:fs/promises';
          import {execFileSync} from 'node:child_process';
          const file='apps/web/e2e/editorToolsRail.e2e.ts';
          async function api(endpoint,body){
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const changes=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          if(changes.some(path=>path!==file))throw new Error('Unexpected candidate modification');
          const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
          const base=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const tree=await api('git/trees',{base_tree:base.tree.sha,tree:[{path:file,mode:'100644',type:'blob',sha:blob.sha}]});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'test(editor): respect native modal isolation in the rail journey',tree:tree.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',tree.sha);console.log('TEST_BLOB',blob.sha);
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  journey:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Real native rail, keyboard, diagnostics, debugger and Settings journey
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.editor-tools.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-tools-after
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: error
  evidence:
    needs: [prepare, journey]
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: editor-tools-before
          run-id: 38867116068
          github-token: ${{ github.token }}
          path: evidence/before
      - uses: actions/download-artifact@v4
        with:
          name: editor-tools-after
          path: evidence/after
      - name: Store only authentic PNG evidence as Git objects for connector publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          node --input-type=module <<'NODE'
          import {readdir,readFile,lstat} from 'node:fs/promises';
          import path from 'node:path';
          async function files(root){
            const found=[];
            for(const entry of await readdir(root,{withFileTypes:true})){
              if(entry.isSymbolicLink())throw new Error('Unexpected evidence symlink');
              const name=path.join(root,entry.name);
              if(entry.isDirectory()&&entry.name!=='attachments')found.push(...await files(name));
              else if(entry.isFile())found.push(name);
            }
            return found;
          }
          const all=await files('evidence');
          const selections=[
            ['before-native-editor-three-button-rail.png','docs/editor/evidence/editor-tools-before.png'],
            ['after-native-editor-tools-rail.png','docs/editor/evidence/editor-tools-after.png'],
            ['after-extensions-native-actions.png','docs/editor/evidence/editor-tools-extensions.png'],
          ];
          for(const [name,destination] of selections){
            const matches=all.filter(file=>path.basename(file)===name);
            if(matches.length!==1)throw new Error(`Ambiguous screenshot ${name}`);
            const stat=await lstat(matches[0]);
            if(!stat.isFile()||stat.size>2000000)throw new Error('Invalid screenshot size');
            const content=await readFile(matches[0]);
            if(content.subarray(0,8).toString('hex')!=='89504e470d0a1a0a')throw new Error('Not PNG evidence');
            const response=await fetch('https://api.github.com/repos/Emanuele-web04/synara/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:content.toString('base64'),encoding:'base64'}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${response.status}: ${await response.text()}`);
            const blob=await response.json();
            console.log('EVIDENCE_BLOB',JSON.stringify({path:destination,sha:blob.sha,bytes:content.length,candidate:process.env.VERIFIED_CANDIDATE}));
          }
          NODE
