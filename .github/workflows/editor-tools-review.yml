# Temporary review runner. Final publication removes this execution bridge.
name: Native editor tools review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-tools-review.yml]
permissions:
  contents: read
concurrency:
  group: editor-tools-review-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: 8f4d09815a9bc3cce69003fa5fc0422da54264e6
  BASELINE: 7cfd39f9fd7790f24abe7a061ab31fe6fb5d54a9
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply reviewed integration points
        run: |
          node scripts/assemble-editor-tools-rail.mjs
          node scripts/assemble-editor-tools-routing.mjs
      - name: Format only changed files
        run: |
          ./node_modules/.bin/oxfmt apps/web/src/components/codeEditor/editorToolScope.tsx \
            apps/web/src/components/codeEditor/editorToolScope.test.ts \
            apps/web/src/components/codeEditor/EditorToolsActivityBar.tsx \
            apps/web/src/components/codeEditor/MonacoEditorSurface.tsx \
            apps/web/src/components/EditorWorkspaceView.tsx \
            apps/web/src/components/chat/SingleChatSurface.tsx \
            apps/web/src/components/chat/workspaceExplorer.tsx \
            apps/web/e2e/editorToolsRail.e2e.ts apps/web/playwright.editor-tools.config.ts \
            docs/editor/extensions.md
      - name: Preserve normalized application objects without moving any ref
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body){
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const allowed=new Set(['apps/web/src/components/codeEditor/editorToolScope.tsx','apps/web/src/components/codeEditor/editorToolScope.test.ts','apps/web/src/components/codeEditor/EditorToolsActivityBar.tsx','apps/web/src/components/codeEditor/MonacoEditorSurface.tsx','apps/web/src/components/EditorWorkspaceView.tsx','apps/web/src/components/chat/SingleChatSurface.tsx','apps/web/src/components/chat/workspaceExplorer.tsx','apps/web/e2e/editorToolsRail.e2e.ts','apps/web/playwright.editor-tools.config.ts','docs/editor/extensions.md']);
          const files=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree=[];
          for(const file of files){
            if(!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          for(const file of ['scripts/assemble-editor-tools-rail.mjs','scripts/assemble-editor-tools-routing.mjs'])tree.push({path:file,mode:'100644',type:'blob',sha:null});
          console.log('NORMALIZED_FILES',JSON.stringify(tree));
          const base=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:base.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'feat(editor): add native tools to the existing inner rail',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Format and lint
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -80 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Integrated typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/types.log"; exit 1; }
      - name: Scope ownership and existing shell regressions
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test src/components/codeEditor/editorToolScope.test.ts src/components/EditorWorkspaceView.test.tsx src/uiFontSize.test.ts src/hasSelectorVariants.test.ts
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Existing editor and shared surface regressions
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/EditorWorkspaceView.browser.tsx src/components/codeEditor/editorExtensionBridge.browser.tsx
  screenshots:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        mode: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.mode == 'before' && env.BASELINE || needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/checkout@v6
        if: matrix.mode == 'before'
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
          path: rail-harness
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            apps/web/e2e/editorToolsRail.e2e.ts
            apps/web/playwright.editor-tools.config.ts
      - name: Use the identical scenario against the original application
        if: matrix.mode == 'before'
        run: |
          cp rail-harness/apps/web/e2e/editorToolsRail.e2e.ts apps/web/e2e/
          cp rail-harness/apps/web/playwright.editor-tools.config.ts apps/web/
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Actual native rail journey and screenshots
        env:
          SYNARA_EDITOR_RAIL_BASELINE: ${{ matrix.mode == 'before' && '1' || '0' }}
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.editor-tools.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-tools-${{ matrix.mode }}
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
