name: Chara port generic ACP server integration

on:
  push:
    branches: [codex/generic-acp-provider]
    paths: [.github/workflows/chara-port-acp-server.yml]

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/generic-acp-provider
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "false"
      - name: Port current generic ACP server seams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {found}: {old!r}")
              p.write_text(text.replace(old, new, count))

          # Carry explicit ACP argv through current model-discovery query keys and requests.
          path = "apps/web/src/lib/providerDiscoveryReactQuery.ts"
          patch(path,
              '    agentDir: string | null,\n    cwd: string | null,\n  ) => ["provider-discovery", "models", provider, binaryPath, apiEndpoint, agentDir, cwd] as const,',
              '    agentDir: string | null,\n    cwd: string | null,\n    args: readonly string[] | null = null,\n  ) =>\n    [\n      "provider-discovery",\n      "models",\n      provider,\n      binaryPath,\n      apiEndpoint,\n      agentDir,\n      cwd,\n      args,\n    ] as const,')
          patch(path,
              '  agentDir?: string | null;\n  cwd?: string | null;',
              '  agentDir?: string | null;\n  args?: readonly string[] | null;\n  cwd?: string | null;')
          patch(path,
              '    input.agentDir ?? null,\n    input.cwd ?? null,\n  );',
              '    input.agentDir ?? null,\n    input.cwd ?? null,\n    input.args ?? null,\n  );')
          patch(path,
              '            ...(input.agentDir ? { agentDir: input.agentDir } : {}),\n            ...(input.cwd ? { cwd: input.cwd } : {}),',
              '            ...(input.agentDir ? { agentDir: input.agentDir } : {}),\n            ...(input.args !== undefined && input.args !== null ? { args: [...input.args] } : {}),\n            ...(input.cwd ? { cwd: input.cwd } : {}),')

          # Agent Gateway: generic ACP has only the runtime-discovered model seam.
          patch(
              "apps/server/src/agentGateway/targetResolver.ts",
              '  devin: defineProviderOptionConfig<"devin">({',
              '  acp: defineProviderOptionConfig<"acp">({\n    primaryOptionKey: "model",\n    options: {},\n  }),\n  devin: defineProviderOptionConfig<"devin">({',
          )

          # Adapter: current interaction modes include debug, and ACP request failures
          # must be mapped into the provider-adapter error domain.
          path = "apps/server/src/provider/Layers/AcpAdapter.ts"
          patch(path,
              '  type ProviderComposerCapabilities,\n  type ProviderListModelsResult,',
              '  type ProviderComposerCapabilities,\n  type ProviderInteractionMode,\n  type ProviderListModelsResult,')
          patch(path,
              '  activeInteractionMode: "default" | "plan" | undefined;',
              '  activeInteractionMode: ProviderInteractionMode | undefined;')
          patch(path,
              '            modeState: yield* acp.getModeState,',
              '            modeState: yield* acp.getModeState.pipe(\n              Effect.mapError((error) =>\n                mapAcpToAdapterError(\n                  PROVIDER,\n                  input.threadId,\n                  "session/get_mode_state",\n                  error,\n                ),\n              ),\n            ),')

          # Generic ACP auth moved to the current on-demand policy. No-auth agents
          # never invoke the resolver; if auth is actually required, a concrete method is mandatory.
          path = "apps/server/src/provider/acp/GenericAcpSupport.ts"
          patch(path,
              '  "authMethodId" | "resolveAuthMethodId" | "authentication" | "spawn"\n>',
              '  "authMethodId" | "resolveAuthMethodId" | "authPolicy" | "spawn"\n>')
          patch(path,
              'export const resolveGenericAcpAuthMethodId = (\n  initializeResult: Acp.InitializeResponse,\n): Effect.Effect<string | undefined> => {\n  const method = (initializeResult.authMethods ?? []).find((candidate) => candidate.id.trim());\n  return Effect.succeed(method?.id.trim());\n};',
              'export const resolveGenericAcpAuthMethodId = (\n  initializeResult: Acp.InitializeResponse,\n): Effect.Effect<string, AcpErrors.AcpError> => {\n  const methodId = (initializeResult.authMethods ?? [])\n    .map((method) => method.id.trim())\n    .find(Boolean);\n  return methodId\n    ? Effect.succeed(methodId)\n    : Effect.fail(\n        new AcpErrors.AcpRequestError({\n          code: -32000,\n          errorMessage: "ACP agent requires authentication but advertised no authentication methods.",\n        }),\n      );\n};')
          patch(path,
              '        resolveAuthMethodId: resolveGenericAcpAuthMethodId,\n        authentication: "when-advertised",',
              '        resolveAuthMethodId: resolveGenericAcpAuthMethodId,\n        authPolicy: "on-demand",')
          patch(
              "apps/server/src/provider/acp/GenericAcpSupport.test.ts",
              '  it("allows an ACP agent that does not require client-driven authentication", async () => {\n    await expect(\n      Effect.runPromise(resolveGenericAcpAuthMethodId(initializeResponse([]))),\n    ).resolves.toBeUndefined();\n  });',
              '  it("fails auth-method resolution when authentication is required but none is advertised", async () => {\n    await expect(\n      Effect.runPromise(resolveGenericAcpAuthMethodId(initializeResponse([]))),\n    ).rejects.toThrow("advertised no authentication methods");\n  });',
          )
          patch(
              "apps/server/src/provider/acp/AcpSdkConformance.test.ts",
              '    authentication: "when-advertised",',
              '    authPolicy: "on-demand",',
          )

          # Registry test layer must provide/assert the ACP adapter service.
          path = "apps/server/src/provider/Layers/ProviderAdapterRegistry.test.ts"
          patch(path,
              'import { AntigravityAdapter, AntigravityAdapterShape } from "../Services/AntigravityAdapter.ts";\n',
              'import { AcpAdapter, AcpAdapterShape } from "../Services/AcpAdapter.ts";\nimport { AntigravityAdapter, AntigravityAdapterShape } from "../Services/AntigravityAdapter.ts";\n')
          fake = '''\nconst fakeAcpAdapter: AcpAdapterShape = {\n  provider: "acp",\n  capabilities: { sessionModelSwitch: "in-session" },\n  startSession: vi.fn(),\n  sendTurn: vi.fn(),\n  interruptTurn: vi.fn(),\n  respondToRequest: vi.fn(),\n  respondToUserInput: vi.fn(),\n  stopSession: vi.fn(),\n  listSessions: vi.fn(),\n  hasSession: vi.fn(),\n  readThread: vi.fn(),\n  rollbackThread: vi.fn(),\n  stopAll: vi.fn(),\n  streamEvents: Stream.empty,\n};\n'''
          patch(path, 'const fakeCodexAdapter: CodexAdapterShape = {', fake + '\nconst fakeCodexAdapter: CodexAdapterShape = {')
          patch(path,
              '        Layer.succeed(CodexAdapter, codexAdapter),\n        Layer.succeed(ClaudeAdapter, fakeClaudeAdapter),',
              '        Layer.succeed(CodexAdapter, codexAdapter),\n        Layer.succeed(AcpAdapter, fakeAcpAdapter),\n        Layer.succeed(ClaudeAdapter, fakeClaudeAdapter),')
          patch(path,
              '      const codex = yield* registry.getByProvider("codex");\n      const claude =',
              '      const codex = yield* registry.getByProvider("codex");\n      const acp = yield* registry.getByProvider("acp");\n      const claude =')
          patch(path,
              '      assert.equal(codex, fakeCodexAdapter);\n      assert.equal(claude,',
              '      assert.equal(codex, fakeCodexAdapter);\n      assert.equal(acp, fakeAcpAdapter);\n      assert.equal(claude,')
          patch(path,
              '        "opencode",\n        "pi",\n      ]);',
              '        "opencode",\n        "pi",\n        "acp",\n      ]);')

          # Provider health: generic ACP only needs executable presence/version;
          # authentication/capabilities remain owned by the ACP initialize/session handshake.
          path = "apps/server/src/provider/Layers/ProviderHealth.ts"
          patch(path,
              'const PI_PROVIDER = "pi" as const;\ntype ProviderStatuses',
              'const PI_PROVIDER = "pi" as const;\nconst ACP_PROVIDER = "acp" as const;\ntype ProviderStatuses')
          patch(path,
              '  PI_PROVIDER,\n] as const satisfies ReadonlyArray<ProviderKind>;',
              '  PI_PROVIDER,\n  ACP_PROVIDER,\n] as const satisfies ReadonlyArray<ProviderKind>;')
          health = '''\n\n// ── Generic ACP agent health check ───────────────────────────────\n\nexport const makeCheckAcpProviderStatus = (\n  binaryPath?: string,\n  _args?: ReadonlyArray<string>,\n): Effect.Effect<ServerProviderStatus, never, ChildProcessSpawner.ChildProcessSpawner> =>\n  Effect.gen(function* () {\n    const checkedAt = new Date().toISOString();\n    const executable = nonEmptyTrimmed(binaryPath) ?? "cline";\n    const versionProbe = yield* probeProviderCliVersion(\n      runProviderCommand(executable, ["--version"], providerCommandEnv(ACP_PROVIDER)),\n      DEFAULT_TIMEOUT_MS,\n    );\n\n    if (versionProbe.outcome === "missing") {\n      return {\n        provider: ACP_PROVIDER,\n        status: "error" as const,\n        available: false,\n        authStatus: "unknown" as const,\n        checkedAt,\n        message: `ACP agent executable (${executable}) is not installed or not on PATH.`,\n      } satisfies ServerProviderStatus;\n    }\n    if (versionProbe.outcome === "success") {\n      const version = versionProbe.result;\n      return {\n        provider: ACP_PROVIDER,\n        status: "ready" as const,\n        available: true,\n        authStatus: "unknown" as const,\n        version: parseGenericCliVersion(`${version.stdout}\\n${version.stderr}`),\n        checkedAt,\n        message:\n          "ACP agent executable is installed. Authentication and capabilities are negotiated when a session starts.",\n      } satisfies ServerProviderStatus;\n    }\n    const detail =\n      versionProbe.outcome === "failure"\n        ? versionProbe.cause instanceof Error\n          ? versionProbe.cause.message\n          : String(versionProbe.cause)\n        : versionProbe.outcome === "timeout"\n          ? "The version probe timed out."\n          : detailFromResult(versionProbe.result);\n    return {\n      provider: ACP_PROVIDER,\n      status: "warning" as const,\n      available: true,\n      authStatus: "unknown" as const,\n      checkedAt,\n      message: detail\n        ? `ACP agent is present, but its version probe was inconclusive: ${detail}`\n        : "ACP agent is present, but its version probe was inconclusive.",\n    } satisfies ServerProviderStatus;\n  });\n\nexport const checkAcpProviderStatus = makeCheckAcpProviderStatus();\n'''
          patch(path, '\n// ── Snapshot helpers ────────────────────────────────────────────────\n', health + '\n// ── Snapshot helpers ────────────────────────────────────────────────\n')
          patch(path,
              '          case "devin":\n            return settings.providers.devin.binaryPath;\n        }',
              '          case "devin":\n            return settings.providers.devin.binaryPath;\n          case "acp":\n            return settings.providers.acp.binaryPath;\n        }')
          patch(path,
              '                checkProviderWhenEnabled(\n                  settings,\n                  PI_PROVIDER,\n                  checkPiProviderStatus(\n                    settings.providers.pi.agentDir,\n                    settings.providers.pi.binaryPath,\n                  ),\n                ),\n              ],',
              '                checkProviderWhenEnabled(\n                  settings,\n                  PI_PROVIDER,\n                  checkPiProviderStatus(\n                    settings.providers.pi.agentDir,\n                    settings.providers.pi.binaryPath,\n                  ),\n                ),\n                checkProviderWhenEnabled(\n                  settings,\n                  ACP_PROVIDER,\n                  makeCheckAcpProviderStatus(\n                    settings.providers.acp.binaryPath,\n                    settings.providers.acp.args,\n                  ),\n                ),\n              ],')

          # Generic ACP has no provider-specific skill roots of its own.
          patch(
              "apps/server/src/provider/skillsCatalog.ts",
              '  devin: ["devin", "claude", "agents"],\n} as const satisfies Partial<Record<ProviderKind, readonly SkillsHomeOrigin[]>>;',
              '  devin: ["devin", "claude", "agents"],\n  acp: [],\n} as const satisfies Partial<Record<ProviderKind, readonly SkillsHomeOrigin[]>>;',
          )
          PY
      - name: Format changed source
        run: >-
          bunx oxfmt
          apps/web/src/lib/providerDiscoveryReactQuery.ts
          apps/server/src/agentGateway/targetResolver.ts
          apps/server/src/provider/Layers/AcpAdapter.ts
          apps/server/src/provider/Layers/ProviderAdapterRegistry.test.ts
          apps/server/src/provider/Layers/ProviderHealth.ts
          apps/server/src/provider/acp/AcpSdkConformance.test.ts
          apps/server/src/provider/acp/GenericAcpSupport.ts
          apps/server/src/provider/acp/GenericAcpSupport.test.ts
          apps/server/src/provider/skillsCatalog.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Clean temporary workflows
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/chara-diagnose.yml
          rm -f .github/workflows/chara-wire-acp-discovery-args.yml
          rm -f .github/workflows/chara-port-acp-server.yml
      - name: Commit port
        if: always()
        shell: bash
        run: |
          git config user.name Chara
          git config user.email legend.alkalex07@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix: integrate generic ACP into current server provider architecture"
          git push origin HEAD:codex/generic-acp-provider
      - name: Fail if typecheck still fails
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
