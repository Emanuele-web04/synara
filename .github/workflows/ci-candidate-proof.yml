name: CI candidate proof

on:
  push:
    branches: [codex/ci-cross-platform]
    paths: [.github/workflows/ci-candidate-proof.yml]

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fe6d8c4d6510a2d5f7b7e46f1ce1a84f82aa04d1
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve source and benchmark metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/ci-final-evidence"
          cd "$GITHUB_WORKSPACE"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/ci-final-evidence/source.tar.gz"
          git archive --format=tar.gz 99d7dd11739ad2ad34aca29f82f6ae8d5cf7dc05 > "$RUNNER_TEMP/ci-final-evidence/base.tar.gz"
          git log -12 --format='%H %s' > "$RUNNER_TEMP/ci-final-evidence/commits.txt"
          gh api 'repos/Emanuele-web04/synara/actions/runs?branch=codex%2Fci-cross-platform&per_page=100' > "$RUNNER_TEMP/ci-final-evidence/runs.json"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          dest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'ci-final-evidence'
          runs = json.loads((dest / 'runs.json').read_text())['workflow_runs']
          for run in runs:
              print(run['id'], run['name'], run['status'], run['conclusion'], run['head_sha'])
              if run['name'] in ['PR Size', 'PR Vouch']:
                  continue
              run_dir = dest / str(run['id'])
              run_dir.mkdir()
              result = subprocess.run(['gh', 'api', f"repos/Emanuele-web04/synara/actions/runs/{run['id']}/jobs?per_page=100"], capture_output=True, check=True)
              (run_dir / 'jobs.json').write_bytes(result.stdout)
              result = subprocess.run(['gh', 'api', f"repos/Emanuele-web04/synara/actions/runs/{run['id']}/artifacts?per_page=100"], capture_output=True, check=True)
              (run_dir / 'artifacts.json').write_bytes(result.stdout)
              for job in json.loads((run_dir / 'jobs.json').read_text())['jobs']:
                  if job['status'] != 'completed':
                      continue
                  if run['name'] == 'CI' and job['conclusion'] == 'success':
                      continue
                  log = subprocess.run(['gh', 'api', f"repos/Emanuele-web04/synara/actions/jobs/{job['id']}/logs"], capture_output=True)
                  if log.returncode == 0:
                      (run_dir / f"{job['id']}.log").write_bytes(log.stdout)
          PY
      - name: Record optional service availability without exposing credentials
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
        run: |
          node -e 'const fs=require("node:fs"); fs.writeFileSync(process.env.RUNNER_TEMP+"/ci-final-evidence/services.json",JSON.stringify({turboToken:!!process.env.TURBO_TOKEN,turboTeam:!!process.env.TURBO_TEAM,browserbase:!!process.env.BROWSERBASE_API_KEY}));'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-final-evidence
          path: ${{ runner.temp }}/ci-final-evidence
          retention-days: 14
