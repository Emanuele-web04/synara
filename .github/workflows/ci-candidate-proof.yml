name: CI candidate proof

on:
  push:
    branches: [codex/ci-cross-platform]
    paths: [.github/workflows/ci-candidate-proof.yml]

permissions:
  contents: read

jobs:
  mac-device:
    name: Native device readiness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install device dependency closure
        run: node .github/scripts/install-workspace.mjs device
      - name: Probe native capabilities
        run: bun run test:device:probe
      - name: Exercise sandboxed simulator with bounded accessibility readiness
        timeout-minutes: 15
        run: |
          set -o pipefail
          bun run test:device 2>&1 | tee "$RUNNER_TEMP/device-smoke.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readiness-${{ matrix.os }}
          path: ${{ runner.temp }}/device-smoke.log
          retention-days: 14

  server-pair:
    name: Matched serial server shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          profile: product
          turbo: "true"
      - name: Native PTY smoke
        run: node scripts/node-pty-smoke.mjs
      - name: Compare baseline and balanced scheduling with identical dependencies
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, readFileSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'server-pair');
          mkdirSync(dir);
          writeFileSync('apps/server/vitest.ci-baseline.config.ts', 'import config from "./vitest.config"; import { BaseSequencer } from "vitest/node"; export default { ...config, test: { ...config.test, sequence: { sequencer: BaseSequencer } } };\n');
          const results = [];
          const shard = Number(process.env.SHARD);
          const order = shard === 1 ? ['baseline', 'balanced', 'balanced', 'baseline'] : ['balanced', 'baseline', 'baseline', 'balanced'];
          for (const [index, variant] of order.entries()) {
            const name = `${index}-${variant}`;
            const report = join(dir, `${name}.json`);
            const config = variant === 'baseline' ? 'vitest.ci-baseline.config.ts' : 'vitest.config.ts';
            const start = performance.now();
            const run = spawnSync('bun', ['run', '--cwd', 'apps/server', 'test', `--shard=${shard}/2`, `--config=${config}`, '--reporter=json', `--outputFile=${report}`], { encoding: 'utf8', timeout: 360_000, maxBuffer: 32 * 1024 * 1024 });
            const seconds = (performance.now() - start) / 1000;
            writeFileSync(join(dir, `${name}.log`), `${run.stdout ?? ''}\n${run.stderr ?? ''}`);
            const data = JSON.parse(readFileSync(report, 'utf8'));
            results.push({ index, variant, shard, seconds, status: run.status, passed: data.numPassedTests, skipped: data.numPendingTests, files: data.testResults.map(t => t.name.split('/apps/server/').pop()) });
            writeFileSync(join(dir, 'results.json'), JSON.stringify(results, null, 2));
            console.log(JSON.stringify({ index, variant, shard, seconds, status: run.status, passed: data.numPassedTests }));
            if (run.status !== 0) throw new Error(run.error?.message ?? `Failed ${name}`);
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-pair-${{ matrix.shard }}
          path: ${{ runner.temp }}/server-pair
          retention-days: 14

  stagehand-feasibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          profile: product
      - name: Probe deterministic Stagehand without service credentials
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, realpathSync } from 'node:fs';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'stagehand-probe');
          mkdirSync(dir);
          const pkg = { private: true, type: 'module', dependencies: { '@browserbasehq/stagehand': '4.1.0' } };
          writeFileSync(join(dir, 'package.json'), JSON.stringify(pkg));
          const install = spawnSync('bun', ['install'], { cwd: dir, encoding: 'utf8', timeout: 180_000 });
          writeFileSync(join(dir, 'install.log'), `${install.stdout ?? ''}\n${install.stderr ?? ''}`);
          if (install.status !== 0) throw new Error('Stagehand installation failed');
          const playwright = realpathSync('apps/web/node_modules/playwright');
          writeFileSync(join(dir, 'probe.mjs'), `
          import { localBrowser, Stagehand } from '@browserbasehq/stagehand';
          import { chromium } from ${JSON.stringify(playwright + '/index.mjs')};
          import { createServer } from 'node:http';
          import { writeFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const html = '<input id="entry"><button id="send">Send</button><output id="result"></output><script>let n=0; document.querySelector("#send").onclick=()=>document.querySelector("#result").textContent=(++n)+":"+document.querySelector("#entry").value;</script>';
          const server = createServer((req,res)=>{res.setHeader('content-type','text/html');res.end(html)});
          await new Promise(r=>server.listen(0,'127.0.0.1',r));
          const url = 'http://127.0.0.1:'+server.address().port;
          const results = [];
          try {
            for (const variant of ['playwright','stagehand','stagehand','playwright']) {
              const start = performance.now();
              let browser, runtime;
              try {
                browser = variant === 'playwright' ? await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']}) : await localBrowser.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
                if (variant === 'stagehand') runtime = await Stagehand.create({browser});
                const page = variant === 'playwright' ? await browser.newPage() : await browser.context.newPage();
                await page.goto(url);
                const setupSeconds = (performance.now()-start)/1000;
                const interactions = performance.now();
                for (let n=1;n<=20;n++) {
                  await page.locator('#entry').fill('message-'+n);
                  await page.locator('#send').click();
                  assert.equal(await page.locator('#result').textContent(), n+':message-'+n);
                }
                results.push({variant,setupSeconds,interactionSeconds:(performance.now()-interactions)/1000,status:'passed'});
              } catch(error) {
                results.push({variant,status:'failed',error:String(error)});
                throw error;
              } finally {
                await runtime?.close();
                await browser?.close();
                writeFileSync('result.json',JSON.stringify(results,null,2));
              }
            }
          } finally { server.close(); }
          `);
          const run = spawnSync('node', ['probe.mjs'], { cwd: dir, encoding: 'utf8', timeout: 180_000 });
          writeFileSync(join(dir, 'probe.log'), `${run.stdout ?? ''}\n${run.stderr ?? ''}`);
          console.log(run.stdout, run.stderr);
          if (run.status !== 0) throw new Error(run.error?.message ?? 'Local Stagehand feasibility failed');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stagehand-feasibility
          path: |
            ${{ runner.temp }}/stagehand-probe/*.json
            ${{ runner.temp }}/stagehand-probe/*.log
            ${{ runner.temp }}/stagehand-probe/bun.lock
            ${{ runner.temp }}/stagehand-probe/probe.mjs
          retention-days: 14
