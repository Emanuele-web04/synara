name: Desktop bundle size audit

on:
  push:
    branches:
      - perf/production-bundle-size-audit
    paths:
      - .github/workflows/bundle-size-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect pinned runtime dependency files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install pinned packages without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts --linker hoisted
      - name: Archive runtime inspection inputs and local checking tools
        shell: bash
        run: |
          tar -czf "$RUNNER_TEMP/dependency-inspection.tar.gz" --exclude='*.map' --exclude='*.node' --exclude='*.wasm' --exclude='*.png' --exclude='*.jpg' --exclude='*.jpeg' --exclude='*.woff*' --exclude='*.ttf' --exclude='*.exe' --exclude='claude' node_modules/effect node_modules/@effect/platform-node node_modules/@effect/platform-node-shared node_modules/@earendil-works node_modules/@pierre/diffs node_modules/node-pty node_modules/@mariozechner/clipboard node_modules/@anthropic-ai/sdk node_modules/openai node_modules/zod node_modules/playwright-core node_modules/patchright-core node_modules/web-streams-polyfill node_modules/betterwright node_modules/oxfmt node_modules/@oxfmt node_modules/oxlint node_modules/@oxlint
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-inspection
          path: ${{ runner.temp }}/dependency-inspection.tar.gz
          retention-days: 7
