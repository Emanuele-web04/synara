name: PR 1878 exact-head acceptance

on:
  push:
    branches: [qa/pr1878-exact-head-20261017]

permissions:
  contents: read

env:
  TARGET_SHA: 2608353b8258995192e0d4aa6cd4ad5c3f979a9e
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  source:
    name: Preserve exact source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cmdr-chara/synara
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Archive immutable source
        run: |
          mkdir -p qa-evidence
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD HEAD^{tree} > qa-evidence/source.txt
          git archive --format=tar.gz -o qa-evidence/source.tar.gz HEAD
          sha256sum qa-evidence/source.tar.gz > qa-evidence/source.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: pr1878-exact-source
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 14

  checks:
    name: Acceptance (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: static
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: |
              status=0
              for task in fmt:check lint brand:check windows-runtime:check; do
                bun run "$task" || status=1
              done
              node --test .github/scripts/ci-contracts.test.mjs || status=1
              node scripts/release-smoke.ts || status=1
              exit "$status"
          - name: typecheck
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: bun run typecheck
          - name: core
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: bunx turbo run test --filter=@synara/contracts --filter=@synara/shared --filter=@synara/scripts --filter=@synara/desktop
          - name: web-unit
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: bunx turbo run test --filter=@synara/web
          - name: server-1
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: bunx turbo run test --filter=@synara/cli -- --shard=1/3
          - name: server-2
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: bunx turbo run test --filter=@synara/cli -- --shard=2/3
          - name: server-3
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: false
            command: bunx turbo run test --filter=@synara/cli -- --shard=3/3
          - name: chat-follow
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: true
            command: bun run --cwd apps/web test:browser:ci -- --project=chat-follow --shard=1/1
          - name: chat-projects
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: true
            command: bun run --cwd apps/web test:browser:ci -- --project=chat-projects --shard=1/1
          - name: chat-workflows
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: true
            command: bun run --cwd apps/web test:browser:ci -- --project=chat-workflows --shard=1/1
          - name: components-1
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: true
            command: bun run --cwd apps/web test:browser:ci -- --project=components --shard=1/3
          - name: components-2
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: true
            command: bun run --cwd apps/web test:browser:ci -- --project=components --shard=2/3
          - name: components-3
            os: ubuntu-24.04
            scope: full
            electron: 'false'
            browser: true
            command: bun run --cwd apps/web test:browser:ci -- --project=components --shard=3/3
          - name: linux-electron
            os: ubuntu-24.04
            scope: full
            electron: 'true'
            browser: true
            command: |
              bun run build:desktop
              sandbox_helper="$(node -p "require('node:path').join(require('node:path').dirname(require('./apps/desktop/node_modules/electron')), 'chrome-sandbox')")"
              sudo chown root:root "$sandbox_helper"
              sudo chmod 4755 "$sandbox_helper"
              status=0
              xvfb-run -a bun run --cwd apps/desktop smoke:browser-lifecycle || status=1
              xvfb-run -a bun run --cwd apps/web test:electron:e2e visibleBrowserMcp.e2e.ts || status=1
              test -f apps/desktop/dist-electron/preload.js || status=1
              exit "$status"
          - name: windows-runtime
            os: windows-2022
            scope: runtime
            electron: 'false'
            browser: false
            command: |
              status=0
              bun scripts/node-pty-smoke.mjs || status=1
              bun run --cwd packages/shared test src/windowsProcess.test.ts src/platformProcess.test.ts src/processRuntime.test.ts src/filesystemPlatform.test.ts src/platformEnvironment.test.ts src/migrationRecovery.test.ts || status=1
              bun run --cwd apps/server test src/platform/processTreeController.test.ts src/platform/effectProcessSignals.test.ts src/provider/supervisedProcessTeardown.test.ts src/provider/providerStartupLifecycle.test.ts src/provider/Layers/AntigravityAdapter.test.ts src/processRunner.test.ts src/orchestration/projectImportPaths.test.ts src/orchestration/projectImportCatalog.test.ts src/windowsProcessEffect.test.ts src/persistence/MigrationBackup.test.ts src/persistence/Migrations/MigrationReplay.test.ts || status=1
              bun run --cwd apps/server test src/providerUsage/providers/droidSecureStorage.test.ts -t 'compiles the Windows bridge' || status=1
              bun run --cwd apps/desktop test src/backendShutdown.windows.integration.test.ts src/desktopMigrationRecovery.test.ts || status=1
              exit "$status"
          - name: macos-runtime
            os: macos-15
            scope: runtime
            electron: 'false'
            browser: false
            command: |
              status=0
              bun run --cwd packages/shared test src/platformProcess.test.ts src/processRuntime.test.ts src/filesystemPlatform.test.ts src/platformEnvironment.test.ts src/migrationRecovery.test.ts || status=1
              bun run --cwd apps/server test src/platform/processTreeController.test.ts src/platform/effectProcessSignals.test.ts src/provider/supervisedProcessTeardown.test.ts src/provider/providerStartupLifecycle.test.ts src/persistence/MigrationBackup.test.ts src/persistence/Migrations/MigrationReplay.test.ts || status=1
              bun run --cwd apps/desktop test src/desktopMigrationRecovery.test.ts || status=1
              exit "$status"
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cmdr-chara/synara
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Record source and environment
        shell: bash
        run: |
          mkdir -p qa-evidence
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD HEAD^{tree} > qa-evidence/source.txt
          git status --porcelain --untracked-files=no > qa-evidence/source-before.txt
          test ! -s qa-evidence/source-before.txt
          printf '%s\n' "$RUNNER_OS/$RUNNER_ARCH" > qa-evidence/platform.txt
      - name: Install pinned workspace
        uses: ./.github/actions/setup-workspace
        with:
          scope: ${{ matrix.scope }}
          electron: ${{ matrix.electron }}
      - name: Install real Chromium
        if: matrix.browser
        shell: bash
        run: cd apps/web && ./node_modules/.bin/playwright install --with-deps chromium
      - name: Execute unchanged application checks
        shell: bash
        env:
          CHECK_COMMAND: ${{ matrix.command }}
        run: |
          printf '%s\n' "$CHECK_COMMAND" > qa-evidence/command.sh
          node --version > qa-evidence/node-version.txt
          bun --version > qa-evidence/bun-version.txt
          set +e
          bash -e -o pipefail qa-evidence/command.sh 2>&1 | tee qa-evidence/check.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > qa-evidence/exit-code.txt
          exit "$result"
      - name: Verify production source unchanged
        if: always()
        shell: bash
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          git rev-parse HEAD HEAD^{tree} > qa-evidence/source-after.txt
          cmp qa-evidence/source.txt qa-evidence/source-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1878-${{ matrix.name }}
          path: |
            qa-evidence/
            apps/web/test-results/
            apps/web/playwright-report/
            apps/web/.test-results/
            apps/web/src/**/__screenshots__/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  migrations:
    name: Canonical released migration lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Emanuele-web04/synara
          ref: refs/pull/1878/head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Check exact candidate against upstream release tags
        run: |
          mkdir -p qa-evidence
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git rev-parse HEAD HEAD^{tree} > qa-evidence/source.txt
          git tag --list 'v[0-9]*' > qa-evidence/release-tags.txt
          test -s qa-evidence/release-tags.txt
          set +e
          node scripts/check-migration-lineage.ts 2>&1 | tee qa-evidence/migrations.log
          result=${PIPESTATUS[0]}
          printf '%s\n' "$result" > qa-evidence/exit-code.txt
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr1878-migration-lineage
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 14
