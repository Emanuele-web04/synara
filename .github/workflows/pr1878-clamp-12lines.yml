name: PR 1878 true twelve-line clamp measurement
on:
  push:
    branches: [qa/pr1878-chat-clamp-12-lines-proof-20261017]
permissions:
  contents: read
env:
  QA_SOURCE: ff082ce78405bc017b63f2ae48ee70577a2013d7
  NODE_OPTIONS: --max-old-space-size=4096
jobs:
  clamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          repository: cmdr-chara/synara
          ref: ${{ env.QA_SOURCE }}
          persist-credentials: false
      - name: Preserve exact tester source
        run: |
          test "$(git rev-parse HEAD)" = "$QA_SOURCE"
          mkdir -p "$RUNNER_TEMP/pr1878-clamp"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pr1878-clamp/source.txt"
      - uses: ./.github/actions/setup-workspace
      - name: Formatter matches repository
        run: ./node_modules/.bin/oxfmt --check apps/web/src/components/ChatView.browser.tsx
      - name: Install real Chromium
        run: cd apps/web && ./node_modules/.bin/playwright install --with-deps chromium ffmpeg
      - name: Check original strict clamp and resize parity without changing acceptance thresholds
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/pr1878-clamp"
          bun run --cwd apps/web test:browser src/components/ChatView.browser.tsx \
            --testNamePattern="clamps long user messages to twelve rendered lines|tracks wrapping parity while resizing" \
            --reporter=default --reporter=json --outputFile.json="$out/tests.json" \
            2>&1 | tee "$out/tests.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pr1878-user-message-clamp-validation
          path: |
            ${{ runner.temp }}/pr1878-clamp/
            apps/web/src/**/__screenshots__/
          if-no-files-found: warn
          retention-days: 14
