name: Verify production size candidate

on:
  push:
    branches: [perf/production-bundle-size-audit]
    paths: [.github/workflows/bundle-size-candidate.yml]

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  SYNARA_DESKTOP_SIGNED: "false"

jobs:
  prepare:
    if: github.repository == 'Emanuele-web04/synara' && github.ref == 'refs/heads/perf/production-bundle-size-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/production-bundle-size-audit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Apply reviewed patch with integrity and path checks
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, re, subprocess
          data = gzip.decompress(base64.b64decode(pathlib.Path('.github/scripts/production-size.patch.b64').read_bytes()))
          assert hashlib.sha256(data).hexdigest() == '4b565983a50b0c0df43920b51d0455a99cd3552ffcec6e9eff4280bea9e22c62'
          expected = {'apps/web/build-tools/central-icon-prune.test.ts', 'apps/web/build-tools/central-icon-prune.ts', 'apps/web/tsconfig.json', 'apps/web/vite.config.ts', 'scripts/build-desktop-artifact-mac-config.test.ts', 'scripts/build-desktop-artifact.ts', 'scripts/lib/desktop-package-files.test.ts', 'scripts/lib/desktop-package-files.ts', 'scripts/lib/desktop-platform-build-config.ts'}
          assert set(re.findall(rb'^diff --git a/(\S+) b/\S+$', data, re.M)) == {p.encode() for p in expected}
          patch = pathlib.Path('/tmp/production-size.patch'); patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          PY
      - name: Install isolated lossless asset tools
        run: |
          python3 -m venv "$RUNNER_TEMP/png-tools"
          "$RUNNER_TEMP/png-tools/bin/pip" install Pillow==12.3.0 zopfli==0.4.2
      - name: Losslessly recompress shipped PNGs and verify pixels and metadata
        shell: bash
        run: |
          "$RUNNER_TEMP/png-tools/bin/python" - <<'PY'
          from pathlib import Path
          import io, struct, json, hashlib, os
          from PIL import Image
          from zopfli.png import optimize
          def chunks(data):
              assert data[:8] == b'\x89PNG\r\n\x1a\n'
              p = 8; result = []
              while p < len(data):
                  n = struct.unpack('>I', data[p:p+4])[0]
                  result.append((data[p+4:p+8].decode('ascii'), data[p+8:p+8+n])); p += n + 12
              assert p == len(data)
              return result
          roots = ['apps/desktop/resources', 'apps/web/public', 'apps/web/public/app-icons']
          files = [p for root in roots for p in sorted(Path(root).glob('*.png'))]
          files += [Path('assets/prod') / name for name in ['black-universal-1024.png', 'synara-black-web-favicon-16x16.png', 'synara-black-web-favicon-32x32.png', 'synara-black-web-apple-touch-180.png']]
          report = []
          for file in files:
              before = file.read_bytes(); parts = chunks(before)
              assert parts[0][0] == 'IHDR' and parts[0][1][8] <= 8, f'Unsupported bit depth: {file}'
              metadata = [(k, b) for k, b in parts if k not in {'IHDR', 'PLTE', 'IDAT', 'tRNS', 'IEND'}]
              after = optimize(before, use_zopfli=False, keepchunks=[k for k, b in metadata], num_iterations=2, num_iterations_large=2, lossy_transparent=False, lossy_8bit=False)
              a = Image.open(io.BytesIO(before)); b = Image.open(io.BytesIO(after))
              assert a.size == b.size and a.convert('RGBA').tobytes() == b.convert('RGBA').tobytes(), file
              assert sorted(metadata) == sorted((k, b) for k, b in chunks(after) if k not in {'IHDR', 'PLTE', 'IDAT', 'tRNS', 'IEND'}), file
              if len(after) < len(before): file.write_bytes(after)
              else: after = before
              report.append({'path':str(file),'before':len(before),'after':len(after),'sha256Before':hashlib.sha256(before).hexdigest(),'sha256After':hashlib.sha256(after).hexdigest(),'pixelsSha256':hashlib.sha256(a.convert('RGBA').tobytes()).hexdigest(),'metadataUnchanged':True})
          Path(os.environ['RUNNER_TEMP'], 'png-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Install frozen workspace dependencies
        run: bun install --frozen-lockfile
      - name: Format changed TypeScript and measurement helper
        shell: bash
        run: |
          git diff --name-only -z -- '*.ts' '*.json' | xargs -0 -r node node_modules/oxfmt/bin/oxfmt
          node node_modules/oxfmt/bin/oxfmt apps/web/build-tools scripts/lib/desktop-package-files.ts scripts/lib/desktop-package-files.test.ts .github/scripts/measure-bundle-size.mjs
      - name: Commit only audited application changes to isolated branch
        id: commit
        shell: bash
        run: |
          git add apps/web/build-tools apps/web/tsconfig.json apps/web/vite.config.ts scripts/build-desktop-artifact-mac-config.test.ts scripts/build-desktop-artifact.ts scripts/lib/desktop-package-files.ts scripts/lib/desktop-package-files.test.ts scripts/lib/desktop-platform-build-config.ts .github/scripts/measure-bundle-size.mjs
          git add -- 'apps/desktop/resources/*.png' 'apps/web/public/*.png' 'apps/web/public/app-icons/*.png' assets/prod/black-universal-1024.png assets/prod/synara-black-web-favicon-16x16.png assets/prod/synara-black-web-favicon-32x32.png assets/prod/synara-black-web-apple-touch-180.png
          git diff --cached --check
          git config user.name 'Emanuele Di Pietro'
          git config user.email '127427797+Emanuele-web04@users.noreply.github.com'
          git commit -m 'perf: remove unused production payloads and losslessly recompress assets'
          git push origin HEAD:refs/heads/perf/production-bundle-size-audit
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pixel-verification
          path: ${{ runner.temp }}/png-verification.json
          retention-days: 14

  measure:
    needs: prepare
    name: Verify ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - runner: macos-15-intel
            platform: mac
            target: dmg
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - runner: windows-2022
            platform: win
            target: nsis
            arch: x64
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install frozen release build dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'
      - name: Build unsigned production candidate
        shell: bash
        run: |
          set -o pipefail
          bun run dist:desktop:artifact -- --platform '${{ matrix.platform }}' --target '${{ matrix.target }}' --arch '${{ matrix.arch }}' --build-version 0.8.4 --keep-stage --verbose --output-dir "$RUNNER_TEMP/size-audit/artifacts" 2>&1 | tee "$RUNNER_TEMP/build.log"
      - name: Measure candidate using baseline method
        shell: bash
        run: node .github/scripts/measure-bundle-size.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/size-audit/after" '${{ matrix.platform }}'
      - name: Verify packaged application startup and runtime imports
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-packaged-desktop-startup.ts --assets-dir "$RUNNER_TEMP/size-audit/artifacts" --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --version 0.8.4 2>&1 | tee "$RUNNER_TEMP/startup.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-size-after-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/size-audit/after
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/startup.log
          retention-days: 14

  validate:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Lint
        run: bun run lint
      - name: Typecheck
        if: '!cancelled()'
        run: bun run typecheck
      - name: Unit and integration tests
        if: '!cancelled()'
        run: bun run test
      - name: Brand and platform contracts
        if: '!cancelled()'
        run: |
          bun run brand:check
          bun run windows-runtime:check
          bun run release:smoke
