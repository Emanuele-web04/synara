name: Inspect packaged dependency inputs
on:
  push:
    branches: [perf/production-bundle-size-audit]
    paths: [.github/workflows/bundle-inspect.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - shell: bash
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'
      - name: Export public dependency sources for offline inspection
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createRequire } from 'node:module';
          import { cpSync, existsSync, mkdirSync, readFileSync, realpathSync } from 'node:fs';
          import { join, dirname, basename } from 'node:path';
          const root = process.cwd();
          const out = join(process.env.RUNNER_TEMP, 'dependency-inspection');
          mkdirSync(out, {recursive:true});
          const resolvers = ['apps/server', 'apps/desktop', 'scripts', '.'].map(p=>createRequire(join(root,p,'package.json')));
          const packages = ['effect','@effect/platform-node','@effect/platform-node-shared','@anthropic-ai/claude-agent-sdk','@anthropic-ai/sdk','@earendil-works/pi-ai','@earendil-works/pi-coding-agent','betterwright','grok-mermaid','zod','openai','node-pty','electron-builder','app-builder-lib','@electron/asar'];
          for (const name of packages) {
            let found;
            for (const req of resolvers) {
              try {
                let directory=dirname(realpathSync(req.resolve(name)));
                while (directory!==dirname(directory)) {
                  const manifest=join(directory,'package.json');
                  if (existsSync(manifest) && JSON.parse(readFileSync(manifest,'utf8')).name===name) {found=directory;break;}
                  directory=dirname(directory);
                }
              } catch {}
              if (found) break;
            }
            if (!found) {console.log('Not directly resolved:',name);continue;}
            cpSync(found,join(out,name),{recursive:true,dereference:true,filter:p=>basename(p)!=='node_modules'});
            console.log('Exported',name);
          }
          NODE
          tar -czf "$RUNNER_TEMP/dependency-inspection.tar.gz" -C "$RUNNER_TEMP/dependency-inspection" .
      - uses: actions/upload-artifact@v4
        with:
          name: locked-dependency-sources
          path: ${{ runner.temp }}/dependency-inspection.tar.gz
          retention-days: 7
