name: Chara format refreshed Copilot branch

on:
  push:
    branches: [agent/copilot-cli-acp]
    paths: [.github/workflows/chara-format-copilot.yml]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/copilot-cli-acp
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "false"
      - name: Format CI-reported files
        run: bunx oxfmt apps/web/src/appSettings.ts packages/shared/src/serverSettings.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          rm -f .github/workflows/chara-format-copilot.yml
          git config user.name Chara
          git config user.email legend.alkalex07@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "style: format Copilot integration"
          git push origin HEAD:agent/copilot-cli-acp
