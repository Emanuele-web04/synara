name: Stagehand deterministic comparison
on:
  push:
    branches: [codex/ci-cross-platform-evidence]
    paths: [.github/workflows/ci-stagehand-evaluate.yml, .github/scripts/stagehand-probe.mjs]
permissions:
  contents: read
concurrency:
  group: stagehand-evaluate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Isolate pinned alternative and Synara's actual Chromium version
        run: |
          mkdir -p "$RUNNER_TEMP/stagehand"
          cp .github/scripts/stagehand-probe.mjs "$RUNNER_TEMP/stagehand/probe.mjs"
          cd "$RUNNER_TEMP/stagehand"
          npm init -y
          npm install --save-exact --ignore-scripts @browserbasehq/stagehand@4.0.0 playwright@1.62.1 zod@4.3.6
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Compare sequential and batched deterministic actions
        run: cd "$RUNNER_TEMP/stagehand" && node probe.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stagehand-initialized-comparison
          path: |
            ${{ runner.temp }}/stagehand/stagehand-results.json
            ${{ runner.temp }}/stagehand/package-lock.json
          retention-days: 7
          if-no-files-found: error
