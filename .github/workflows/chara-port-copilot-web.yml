name: Chara port Copilot web integration

on:
  push:
    branches: [agent/copilot-cli-acp]
    paths: [.github/workflows/chara-port-copilot-web.yml]

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/copilot-cli-acp
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "false"
      - name: Port current web provider seams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {found}: {old!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # Plugin/library capabilities.
          patch(
              "apps/web/src/components/PluginLibrary.tsx",
              '  const devinCapabilitiesQuery = useQuery(providerComposerCapabilitiesQueryOptions("devin"));\n',
              '  const devinCapabilitiesQuery = useQuery(providerComposerCapabilitiesQueryOptions("devin"));\n  const copilotCapabilitiesQuery = useQuery(providerComposerCapabilitiesQueryOptions("copilot"));\n',
          )
          patch(
              "apps/web/src/components/PluginLibrary.tsx",
              '    devin: {\n      plugins: supportsPluginDiscovery(devinCapabilitiesQuery.data),\n      skills: supportsSkillDiscovery(devinCapabilitiesQuery.data),\n    },\n    antigravity:',
              '    devin: {\n      plugins: supportsPluginDiscovery(devinCapabilitiesQuery.data),\n      skills: supportsSkillDiscovery(devinCapabilitiesQuery.data),\n    },\n    copilot: {\n      plugins: supportsPluginDiscovery(copilotCapabilitiesQuery.data),\n      skills: supportsSkillDiscovery(copilotCapabilitiesQuery.data),\n    },\n    antigravity:',
          )

          # Test-only exhaustive provider maps.
          p = Path("apps/web/src/components/chat/ComposerModelEffortPicker.browser.tsx")
          text = p.read_text()
          needle = '  pi: [],\n};'
          if text.count(needle) < 2:
              raise SystemExit("ComposerModelEffortPicker: expected two provider maps")
          p.write_text(text.replace(needle, '  pi: [],\n  copilot: [],\n};', 2))

          patch(
              "apps/web/src/components/chat/useChatProviderModels.ts",
              '      devin: resolveHint("devin"),\n    };',
              '      devin: resolveHint("devin"),\n      copilot: resolveHint("copilot"),\n    };',
          )
          patch(
              "apps/web/src/components/chat/useChatProviderStatus.ts",
              '    case "pi":\n      return normalizeCustomBinaryPath(providerOptions?.pi?.binaryPath);\n  }',
              '    case "pi":\n      return normalizeCustomBinaryPath(providerOptions?.pi?.binaryPath);\n    case "copilot":\n      return normalizeCustomBinaryPath(providerOptions?.copilot?.binaryPath);\n  }',
          )

          # Model-selection typing/exhaustiveness.
          patch(
              "apps/web/src/providerModelOptions.ts",
              '  type CodexModelSelection,\n  type CursorModelOptions,',
              '  type CodexModelSelection,\n  type CopilotModelOptions,\n  type CopilotModelSelection,\n  type CursorModelOptions,',
          )
          patch(
              "apps/web/src/providerModelOptions.ts",
              'export function buildModelSelection(\n  provider: "devin",\n  model: string,\n  options?: DevinModelOptions | null | undefined,\n): DevinModelSelection;\nexport function buildModelSelection(\n  provider: ProviderKind,',
              'export function buildModelSelection(\n  provider: "devin",\n  model: string,\n  options?: DevinModelOptions | null | undefined,\n): DevinModelSelection;\nexport function buildModelSelection(\n  provider: "copilot",\n  model: string,\n  options?: CopilotModelOptions | null | undefined,\n): CopilotModelSelection;\nexport function buildModelSelection(\n  provider: ProviderKind,',
          )
          patch(
              "apps/web/src/providerModelOptions.ts",
              '    case "pi":\n      return options\n        ? {\n            provider,\n            model,\n            options: options as PiModelOptions,\n          }\n        : { provider, model };\n  }',
              '    case "pi":\n      return options\n        ? {\n            provider,\n            model,\n            options: options as PiModelOptions,\n          }\n        : { provider, model };\n    case "copilot":\n      return options\n        ? {\n            provider,\n            model,\n            options: options as CopilotModelOptions,\n          }\n        : { provider, model };\n  }',
          )

          # Runtime model catalog on current-main query-options architecture.
          path = "apps/web/src/hooks/useProviderModelCatalog.ts"
          patch(path,
              '  const devinModelDiscoveryEnabled = shouldDiscoverProvider("devin");\n\n  const modelQueryOptionsByProvider = {',
              '  const devinModelDiscoveryEnabled = shouldDiscoverProvider("devin");\n  const copilotModelDiscoveryEnabled = shouldDiscoverProvider("copilot");\n\n  const modelQueryOptionsByProvider = {')
          patch(path,
              '    devin: providerModelsQueryOptions({\n      provider: "devin",\n      binaryPath: settings.devinBinaryPath || null,\n      cwd: discoveryCwd,\n      enabled: devinModelDiscoveryEnabled,\n    }),\n  } as const;',
              '    devin: providerModelsQueryOptions({\n      provider: "devin",\n      binaryPath: settings.devinBinaryPath || null,\n      cwd: discoveryCwd,\n      enabled: devinModelDiscoveryEnabled,\n    }),\n    copilot: providerModelsQueryOptions({\n      provider: "copilot",\n      binaryPath: settings.copilotBinaryPath || null,\n      cwd: discoveryCwd,\n      enabled: copilotModelDiscoveryEnabled,\n    }),\n  } as const;')
          patch(path,
              '  const devinDynamicModelsQuery = useQuery(modelQueryOptionsByProvider.devin);\n',
              '  const devinDynamicModelsQuery = useQuery(modelQueryOptionsByProvider.devin);\n  const copilotDynamicModelsQuery = useQuery(modelQueryOptionsByProvider.copilot);\n')
          patch(path,
              '  const devinModelDiscoveryPending =\n    devinModelDiscoveryEnabled &&\n    !hasResolvedDevinModelDiscovery &&\n    isInitialModelDiscoveryPending(devinDynamicModelsQuery);\n  const antigravityModelDiscoveryPending =',
              '  const devinModelDiscoveryPending =\n    devinModelDiscoveryEnabled &&\n    !hasResolvedDevinModelDiscovery &&\n    isInitialModelDiscoveryPending(devinDynamicModelsQuery);\n  const hasResolvedCopilotModelDiscovery =\n    copilotDynamicModelsQuery.data?.source === "copilot-acp" &&\n    (copilotDynamicModelsQuery.data.models.length ?? 0) > 0;\n  const copilotModelDiscoveryPending =\n    copilotModelDiscoveryEnabled &&\n    !hasResolvedCopilotModelDiscovery &&\n    isInitialModelDiscoveryPending(copilotDynamicModelsQuery);\n  const antigravityModelDiscoveryPending =')
          patch(path,
              '      devin: getAppModelOptions("devin", customModelsByProvider.devin, modelHintByProvider?.devin),\n    };',
              '      devin: getAppModelOptions("devin", customModelsByProvider.devin, modelHintByProvider?.devin),\n      copilot: getAppModelOptions(\n        "copilot",\n        customModelsByProvider.copilot,\n        modelHintByProvider?.copilot,\n      ),\n    };')
          patch(path,
              '      devin: devinDynamicModelsQuery.data,\n    };',
              '      devin: devinDynamicModelsQuery.data,\n      copilot: copilotDynamicModelsQuery.data,\n    };')
          patch(path,
              '      "devin",\n    ] as const)',
              '      "devin",\n      "copilot",\n    ] as const)')
          patch(path,
              '    devinDynamicModelsQuery.data,\n  ]);',
              '    devinDynamicModelsQuery.data,\n    copilotDynamicModelsQuery.data,\n  ]);')
          patch(path,
              '      devin: devinModelDiscoveryPending,\n    }),',
              '      devin: devinModelDiscoveryPending,\n      copilot: copilotModelDiscoveryPending,\n    }),')
          patch(path,
              '      devinModelDiscoveryPending,\n    ],',
              '      devinModelDiscoveryPending,\n      copilotModelDiscoveryPending,\n    ],')
          patch(path,
              '      devin: devinDynamicModelsQuery.data?.models ?? [],\n    }),',
              '      devin: devinDynamicModelsQuery.data?.models ?? [],\n      copilot: copilotDynamicModelsQuery.data?.models ?? [],\n    }),')
          patch(path,
              '      devinDynamicModelsQuery.data?.models,\n    ],',
              '      devinDynamicModelsQuery.data?.models,\n      copilotDynamicModelsQuery.data?.models,\n    ],')

          # New-thread prefetch: keep current priority/retry scheduling, just add Copilot.
          path = "apps/web/src/lib/providerModelPrefetch.ts"
          patch(path,
              '  | "piAgentDir"\n>;',
              '  | "piAgentDir"\n  | "copilotBinaryPath"\n>;')
          patch(path,
              '  "devin",\n];',
              '  "devin",\n  "copilot",\n];')
          patch(path,
              '    case "pi":\n      return providerModelsQueryOptions({\n        provider: "pi",\n        binaryPath: settings.piBinaryPath || null,\n        agentDir: settings.piAgentDir || null,\n        cwd,\n        priority,\n      });\n  }',
              '    case "pi":\n      return providerModelsQueryOptions({\n        provider: "pi",\n        binaryPath: settings.piBinaryPath || null,\n        agentDir: settings.piAgentDir || null,\n        cwd,\n        priority,\n      });\n    case "copilot":\n      return providerModelsQueryOptions({\n        provider: "copilot",\n        binaryPath: settings.copilotBinaryPath || null,\n        cwd,\n        priority,\n      });\n  }')

          # App-settings fixtures and coverage.
          p = Path("apps/web/src/appSettings.test.ts")
          text = p.read_text()
          provider_record = '          pi: [],\n        },'
          if text.count(provider_record) < 5:
              raise SystemExit("appSettings.test: expected five resolveAppModelSelection provider records")
          text = text.replace(provider_record, '          pi: [],\n          copilot: [],\n        },', 5)
          p.write_text(text)
          path = "apps/web/src/appSettings.test.ts"
          patch(path,
              '        piBinaryPath: "pi",\n      }),\n    );\n    const normalized =',
              '        piBinaryPath: "pi",\n        copilotBinaryPath: "copilot",\n      }),\n    );\n    const normalized =')
          patch(path,
              '      piBinaryPath: "",\n    });\n    expect(getCustomBinaryPathForProvider',
              '      piBinaryPath: "",\n      copilotBinaryPath: "",\n    });\n    expect(getCustomBinaryPathForProvider')
          p = Path(path)
          text = p.read_text()
          old = '        piBinaryPath: "",\n        devinBinaryPath:'
          if text.count(old) < 2:
              raise SystemExit("appSettings.test: expected two blank Copilot launch fixtures")
          p.write_text(text.replace(old, '        piBinaryPath: "",\n        copilotBinaryPath: "",\n        devinBinaryPath:', 2))
          patch(path,
              '        piBinaryPath: "pi",\n      }),\n    ).toBeUndefined();',
              '        piBinaryPath: "pi",\n        copilotBinaryPath: "copilot",\n      }),\n    ).toBeUndefined();')
          patch(path,
              '    customPiModels: ["anthropic/custom-pi"],\n  } as const;',
              '    customPiModels: ["anthropic/custom-pi"],\n    customCopilotModels: ["copilot/custom-model"],\n  } as const;')
          patch(path,
              '      "pi",\n    ]);',
              '      "pi",\n      "copilot",\n    ]);')
          patch(path,
              '    expect(getCustomModelsForProvider(settings, "pi")).toEqual(["anthropic/custom-pi"]);\n  });',
              '    expect(getCustomModelsForProvider(settings, "pi")).toEqual(["anthropic/custom-pi"]);\n    expect(getCustomModelsForProvider(settings, "copilot")).toEqual(["copilot/custom-model"]);\n  });')
          patch(path,
              '      customPiModels: ["anthropic/default-pi"],\n    } as const;',
              '      customPiModels: ["anthropic/default-pi"],\n      customCopilotModels: ["copilot/default-model"],\n    } as const;')
          patch(path,
              '    expect(getDefaultCustomModelsForProvider(defaults, "pi")).toEqual(["anthropic/default-pi"]);\n  });',
              '    expect(getDefaultCustomModelsForProvider(defaults, "pi")).toEqual(["anthropic/default-pi"]);\n    expect(getDefaultCustomModelsForProvider(defaults, "copilot")).toEqual([\n      "copilot/default-model",\n    ]);\n  });')
          patch(path,
              '  it("builds a complete provider-indexed custom model record", () => {',
              '  it("patches custom models for copilot", () => {\n    expect(patchCustomModels("copilot", ["copilot/custom-model"])).toEqual({\n      customCopilotModels: ["copilot/custom-model"],\n    });\n  });\n\n  it("builds a complete provider-indexed custom model record", () => {')
          patch(path,
              '      pi: ["anthropic/custom-pi"],\n    });',
              '      pi: ["anthropic/custom-pi"],\n      copilot: ["copilot/custom-model"],\n    });')
          patch(path,
              '      customPiModels: [\n        " anthropic/claude-sonnet-4-5 ",\n        "anthropic/custom-pi",\n        "anthropic/custom-pi",\n      ],\n    });',
              '      customPiModels: [\n        " anthropic/claude-sonnet-4-5 ",\n        "anthropic/custom-pi",\n        "anthropic/custom-pi",\n      ],\n      customCopilotModels: [\n        " default ",\n        "copilot/custom-model",\n        "copilot/custom-model",\n      ],\n    });')

          # Composer draft fixtures.
          p = Path("apps/web/src/composerDraftStore.models.test.ts")
          text = p.read_text()
          old = '        devin: [],\n      },'
          if text.count(old) < 4:
              raise SystemExit("composerDraftStore.models.test: expected four provider records")
          p.write_text(text.replace(old, '        devin: [],\n        copilot: [],\n      },', 4))
          PY
      - name: Format touched files
        run: >-
          bunx oxfmt
          apps/web/src/appSettings.test.ts
          apps/web/src/components/PluginLibrary.tsx
          apps/web/src/components/chat/ComposerModelEffortPicker.browser.tsx
          apps/web/src/components/chat/useChatProviderModels.ts
          apps/web/src/components/chat/useChatProviderStatus.ts
          apps/web/src/composerDraftStore.models.test.ts
          apps/web/src/hooks/useProviderModelCatalog.ts
          apps/web/src/lib/providerModelPrefetch.ts
          apps/web/src/providerModelOptions.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Remove one-shot workflow
        if: always()
        run: rm -f .github/workflows/chara-port-copilot-web.yml
      - name: Commit port
        if: always()
        shell: bash
        run: |
          git config user.name Chara
          git config user.email legend.alkalex07@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix: integrate Copilot into current web provider maps"
          git push origin HEAD:agent/copilot-cli-acp
      - name: Fail if typecheck still fails
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
