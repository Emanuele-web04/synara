name: Chara finish Copilot prefetch fixture restore

on:
  push:
    branches: [agent/copilot-cli-acp]
    paths: [.github/workflows/chara-finish-copilot-prefetch-restore.yml]

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/copilot-cli-acp
          fetch-depth: 0
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "false"
      - name: Restore exact fixture and validate
        shell: bash
        run: |
          git show 5b92bf3:apps/web/src/lib/providerModelPrefetch.test.ts > apps/web/src/lib/providerModelPrefetch.test.ts
          python - <<'PY'
          from pathlib import Path
          p = Path("apps/web/src/lib/providerModelPrefetch.test.ts")
          text = p.read_text()
          old = '    piAgentDir: "",\n    ...overrides,'
          new = '    piAgentDir: "",\n    copilotBinaryPath: "",\n    ...overrides,'
          if old not in text:
              raise SystemExit("expected makeSettings fixture not found")
          p.write_text(text.replace(old, new, 1))
          PY
          bunx oxfmt apps/web/src/lib/providerModelPrefetch.test.ts
          bun run typecheck
          rm -f .github/workflows/chara-restore-copilot-prefetch-test.yml
          rm -f .github/workflows/chara-finish-copilot-prefetch-restore.yml
          git config user.name Chara
          git config user.email legend.alkalex07@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "test: restore Copilot prefetch coverage"
          git push origin HEAD:agent/copilot-cli-acp
