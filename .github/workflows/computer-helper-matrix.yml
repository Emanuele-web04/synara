# The macOS computer-use helper `dlsym`s private SkyLight SPI —
# `CGSSetWindowLocation`, `SLPSPostEventRecordTo`, `SLPSGetFrontProcess` and
# friends — whose symbols move between macOS and Xcode releases. Nothing in the
# normal CI path would notice: the helper is macOS-only, and users receive a
# prebuilt one signed at release time, so a toolchain or OS that renamed a
# symbol reaches them as a desktop that cannot be driven rather than a failed
# build.
#
# Run for helper changes as well as on a schedule, so pull requests verify the
# Swift build before merging. Scheduled runs also catch SDK and OS drift.
#
# The blocking assertion is the `--probe` report: every `skylight` capability
# must be present and boolean. A symbol that moved reports `false` there, which
# is the whole reason the helper reports them at all.
name: Computer Helper Matrix

on:
  pull_request:
    paths:
      - "apps/server/native/computer-use-macos/**"
      - "apps/server/src/computer/mac*.ts"
      - "apps/server/src/computer/MacComputerBackend*.ts"
      - "apps/desktop/scripts/build-computer-helper.mjs"
      - "packages/shared/src/computerHelper*"
      - "scripts/assert-computer-helper-probe*"
      - "scripts/mac-after-sign.test.ts"
      - "scripts/lib/mac-after-sign.cjs"
      - "scripts/lib/desktop-platform-build-config.ts"
      - "scripts/build-desktop-artifact-mac-config.test.ts"
      - ".github/workflows/computer-helper-matrix.yml"
  schedule:
    # Mondays 05:30 UTC, half an hour after the device helper so the two do not
    # contend for the macOS runner pool.
    - cron: "30 5 * * 1"
  workflow_dispatch:
    inputs:
      perception_test:
        description: "Run the perception-only helper integration test (never sends input)"
        type: boolean
        default: true

jobs:
  # Inventory only: prints what each image ships so the matrix below can be
  # refreshed when an image drops or adds a version. Kept separate from the
  # probe jobs so it still reports when a probe fails.
  discover:
    name: Discover toolchains (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15, macos-26]
    steps:
      - name: List the toolchain and OS
        run: |
          echo "Runner image: ${{ matrix.runner }}"
          sw_vers
          echo "Selected developer dir: $(xcode-select -p)"
          xcrun swiftc -version

  probe:
    name: Probe ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # The same image set device-helper-matrix.yml discovers against: the
        # oldest hosted runner in this matrix, the current release, and
        # the newest image. Unlike the device helper this needs no Xcode pinning
        # — `build.sh` compiles with the Command Line Tools and each image's
        # default toolchain is exactly the one worth testing.
        runner: [macos-14, macos-15, macos-26]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Record the toolchain
        run: |
          set -euo pipefail
          sw_vers
          xcrun swiftc -version

      - name: Test helper packaging and signing
        run: bun run --cwd scripts test mac-after-sign.test.ts build-desktop-artifact-mac-config.test.ts assert-computer-helper-probe.test.ts

      # The blocking check. A compile failure here is a Swift or SDK change; a
      # probe failure is a moved symbol. Both are what this workflow exists for.
      - name: Compile the helper
        env:
          SYNARA_COMPUTER_HELPER_OUT: ${{ runner.temp }}/computer-helper
        run: bash apps/server/native/computer-use-macos/build.sh "$SYNARA_COMPUTER_HELPER_OUT"

      - name: Test native geometry, identity, keys and shutdown without desktop input
        run: |
          set -euo pipefail
          helper_test_dir=$(mktemp -d "${RUNNER_TEMP}/synara-computer-tests.XXXXXX")
          trap 'rm -rf "$helper_test_dir"' EXIT
          swiftc apps/server/native/computer-use-macos/Sources/CaptureCanvas.swift \
            apps/server/native/computer-use-macos/Tests/CaptureCanvasTests.swift \
            -o "$helper_test_dir/capture-canvas-tests" -framework AppKit
          "$helper_test_dir/capture-canvas-tests"
          swiftc apps/server/native/computer-use-macos/Sources/InputDeliveryHistory.swift \
            apps/server/native/computer-use-macos/Tests/InputDeliveryHistoryTests.swift \
            -o "$helper_test_dir/input-delivery-history-tests"
          "$helper_test_dir/input-delivery-history-tests"
          swiftc apps/server/native/computer-use-macos/Sources/JSONRPC.swift \
            apps/server/native/computer-use-macos/Sources/Cancellation.swift \
            apps/server/native/computer-use-macos/Tests/InputCancellationTests.swift \
            -o "$helper_test_dir/cancellation-tests"
          "$helper_test_dir/cancellation-tests"
          swiftc -swift-version 5 apps/server/native/computer-use-macos/Sources/JSONRPC.swift \
            apps/server/native/computer-use-macos/Sources/Cancellation.swift \
            apps/server/native/computer-use-macos/Sources/KeyMap.swift \
            apps/server/native/computer-use-macos/Sources/InputReleaseEvent.swift \
            apps/server/native/computer-use-macos/Sources/InputDeliveryState.swift \
            apps/server/native/computer-use-macos/Tests/InputDeliveryStateTests.swift \
            -o "$helper_test_dir/input-delivery-state-tests" -framework CoreGraphics
          "$helper_test_dir/input-delivery-state-tests"
          swiftc -swift-version 5 apps/server/native/computer-use-macos/Sources/JSONRPC.swift \
            apps/server/native/computer-use-macos/Sources/KeyMap.swift \
            apps/server/native/computer-use-macos/Sources/InputReleaseEvent.swift \
            apps/server/native/computer-use-macos/Tests/KeyMapTests.swift \
            -o "$helper_test_dir/key-map-tests" -framework CoreGraphics
          "$helper_test_dir/key-map-tests"
          swiftc -swift-version 5 apps/server/native/computer-use-macos/Sources/WindowIdentityMatcher.swift \
            apps/server/native/computer-use-macos/Tests/WindowIdentityMatcherTests.swift \
            -o "$helper_test_dir/window-identity-tests"
          "$helper_test_dir/window-identity-tests"
          swiftc -swift-version 5 apps/server/native/computer-use-macos/Sources/GeometrySnapshotCache.swift \
            apps/server/native/computer-use-macos/Tests/GeometrySnapshotCacheTests.swift \
            -o "$helper_test_dir/geometry-cache-tests"
          "$helper_test_dir/geometry-cache-tests"

      - name: Probe capabilities and assert the SkyLight report
        env:
          COMPUTER_HELPER_PROBE_JSON: ${{ runner.temp }}/computer-helper-probe.json
        run: |
          set -euo pipefail
          "${{ runner.temp }}/computer-helper/synara-computer-helper" --probe \
            > "$COMPUTER_HELPER_PROBE_JSON"
          cat "$COMPUTER_HELPER_PROBE_JSON"
          node scripts/assert-computer-helper-probe.mjs "$COMPUTER_HELPER_PROBE_JSON"

      # Perception only: ping, capabilities, screen-size, list-windows,
      # describe-ui and one small region capture. It never sends input — no
      # move, click, drag, scroll, keystroke, focus change or clipboard write —
      # so it is safe on a real desktop as well as on a runner. Grants the
      # runner does not have degrade individual assertions to a skip; the
      # symbol tripwire above is the part that must pass.
      - name: Perception-only helper integration test
        if: github.event_name == 'schedule' || inputs.perception_test
        env:
          SYNARA_MAC_HELPER_TEST: "1"
          SYNARA_MAC_HELPER_BINARY: ${{ runner.temp }}/computer-helper/synara-computer-helper
        run: bun run --cwd apps/server test src/computer/macComputerHelper.integration.test.ts

      # Uploaded even when the assertion failed: the JSON names which capability
      # went false, which is the entire diagnostic for a moved symbol.
      - name: Upload probe JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: computer-helper-probe-${{ matrix.runner }}
          path: ${{ runner.temp }}/computer-helper-probe.json
          if-no-files-found: warn
