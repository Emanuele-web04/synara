name: Defender-only diagnosis for Synara 1.6.0
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  scan:
    name: Scan existing 1.6.0 Windows installer
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          ref: f0dc29b5db8567d2fba730e8f436b5905fc4c3c6
      - name: Download original Windows candidate
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "14175446214"
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "43746836975"
          path: release-publish
          digest-mismatch: error
      - name: Scan actual installer with Defender
        id: defender
        shell: pwsh
        run: ./scripts/verify-windows-defender.ps1 -AssetsDirectory release-publish -EvidenceDirectory "${{ runner.temp }}/defender-evidence"
      - name: Preserve Defender evidence
        if: always() && steps.defender.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: defender-only-1.6.0
          path: ${{ runner.temp }}/defender-evidence/
          retention-days: 30
          if-no-files-found: error
