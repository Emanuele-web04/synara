name: Verify published Synara 1.6.0 on Windows 11 ARM64
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  startup:
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Install and launch the published x64 installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $arch = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Host "OS: $($os.Caption), version $($os.Version), build $($os.BuildNumber), architecture $arch"
          if ($os.ProductType -ne 1 -or [int]$os.BuildNumber -lt 22000 -or $arch -ne 'Arm64') {
              throw 'Expected Windows 11 ARM64 client.'
          }
          $root = Join-Path $env:RUNNER_TEMP 'synara-install-verification'
          $null = New-Item -ItemType Directory -Path $root
          $installer = Join-Path $root 'Synara-1.6.0-x64.exe'
          $installPath = Join-Path $root 'App'
          $env:SYNARA_HOME = Join-Path $root 'State'
          $env:SYNARA_DISABLE_AUTO_UPDATE = '1'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          $log = Join-Path $env:SYNARA_HOME 'userdata/logs/desktop-main.log'
          $stderr = Join-Path $root 'electron-stderr.txt'
          $app = $null
          try {
              curl.exe --fail --silent --show-error --location --max-time 120 --output $installer 'https://github.com/Emanuele-web04/synara/releases/download/v1.6.0/Synara-1.6.0-x64.exe'
              if ($LASTEXITCODE -ne 0) { throw "Download failed: $LASTEXITCODE" }
              $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
              if ($hash -ne '358fbdaf2853134de20c52098b545e561894943b0f2825c9b20f20fa02941661') { throw "Unexpected installer SHA-256: $hash" }
              Write-Host "Verified published installer SHA-256: $hash"
              $setup = Start-Process -FilePath $installer -ArgumentList "/S /D=$installPath" -PassThru
              if (-not $setup.WaitForExit(120000)) { throw 'NSIS installation timed out.' }
              if ($setup.ExitCode -ne 0) { throw "NSIS failed: $($setup.ExitCode)" }
              $exe = Join-Path $installPath 'Synara.exe'
              if (-not (Test-Path -LiteralPath $exe)) { throw "Installer did not create $exe" }
              Write-Host "NSIS installation completed: $exe"
              $app = Start-Process -FilePath $exe -WorkingDirectory $installPath -RedirectStandardError $stderr -PassThru
              $deadline = [DateTime]::UtcNow.AddSeconds(120)
              $readySince = $null
              while ([DateTime]::UtcNow -lt $deadline) {
                  $app.Refresh()
                  if ($app.HasExited) { throw "App exited: $($app.ExitCode)" }
                  $logText = if (Test-Path -LiteralPath $log) { Get-Content -LiteralPath $log -Raw }
                  if ($app.MainWindowHandle -ne 0 -and $app.MainWindowTitle -eq 'Synara' -and
                      $logText -match 'app ready' -and
                      $logText -match 'bootstrap main window created' -and
                      $logText -match 'bootstrap backend ready source=' -and
                      $logText -notmatch 'renderer process gone') {
                      if ($null -eq $readySince) { $readySince = [DateTime]::UtcNow }
                      if (([DateTime]::UtcNow - $readySince).TotalSeconds -ge 5) {
                          Write-Host 'PASS: published installer installed, Synara window opened and backend became ready.'
                          return
                      }
                  } else { $readySince = $null }
                  Start-Sleep -Seconds 1
              }
              throw 'The installed app did not reach visible-window and backend readiness.'
          } finally {
              Get-ChildItem -LiteralPath (Join-Path $env:SYNARA_HOME 'userdata/logs') -Filter '*.log' -ErrorAction SilentlyContinue |
                  Where-Object Name -in @('desktop-main.log', 'server-child.log') |
                  ForEach-Object { Write-Host $_.Name; Get-Content -LiteralPath $_.FullName -Tail 50 }
              if (Test-Path -LiteralPath $stderr) { Get-Content -LiteralPath $stderr -Tail 30 }
              if ($app -and -not $app.HasExited) { Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue }
          }
