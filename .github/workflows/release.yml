name: Release Desktop

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example 1.2.3 or v1.2.3)"
        required: true
        type: string
      publish_release:
        description: "Publish the GitHub/npm release after successful builds"
        required: true
        default: false
        type: boolean
      platform:
        description: "Build-only platform scope (publication requires all)"
        type: choice
        default: all
        options: [all, mac-arm64, mac-x64, linux-x64, win-x64]
      stage:
        description: "Build-only stage (publication requires artifact; preflight runs only the quality gates)"
        type: choice
        default: artifact
        options: [artifact, native, icon, js, preflight]
      cua_benchmark_baseline:
        description: "Optional full baseline commit for paired cold Cua builds (native, one Mac only)"
        type: string
        default: ""

permissions: {}

env:
  # The same build setting is fingerprinted on every portable-output consumer.
  AZURE_TRUSTED_SIGNING_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}

concurrency:
  group: synara-desktop-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_meta.outputs.version }}
      tag: ${{ steps.release_meta.outputs.tag }}
      is_prerelease: ${{ steps.release_meta.outputs.is_prerelease }}
      make_latest: ${{ steps.release_meta.outputs.make_latest }}
      mirror_to_stable_channel: ${{ steps.release_meta.outputs.mirror_to_stable_channel }}
      publish_release: ${{ steps.release_mode.outputs.publish_release }}
      release_lane: ${{ steps.release_meta.outputs.release_lane }}
      bridge_tag: ${{ steps.release_meta.outputs.bridge_tag }}
      update_channel: ${{ steps.release_meta.outputs.update_channel }}
      source_commit: ${{ steps.source_provenance.outputs.source_commit }}
      source_tag: ${{ steps.source_provenance.outputs.source_tag }}
      lockfile_sha256: ${{ steps.source_provenance.outputs.lockfile_sha256 }}
      ref: ${{ steps.source_provenance.outputs.source_commit }}
      matrix: ${{ steps.scope.outputs.matrix }}
      build_icon: ${{ steps.scope.outputs.build_icon }}
      build_js: ${{ steps.scope.outputs.build_js }}
      build_native: ${{ steps.scope.outputs.build_native }}
      benchmark_native: ${{ steps.scope.outputs.benchmark_native }}
      quality_gates: ${{ steps.scope.outputs.quality_gates }}
      package_artifacts: ${{ steps.scope.outputs.package_artifacts }}
      build_server: ${{ steps.scope.outputs.build_server }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - id: release_mode
        name: Resolve publication mode
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish_release }}
        run: |
          echo "publish_release=$PUBLISH_RELEASE" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            echo "Publication enabled."
          else
            echo "Build-only validation enabled; no release or package will be published."
          fi

      - id: scope
        name: Validate build scope
        env:
          BUILD_PLATFORM: ${{ inputs.platform || 'all' }}
          BUILD_STAGE: ${{ inputs.stage || 'artifact' }}
          PUBLISH_RELEASE: ${{ steps.release_mode.outputs.publish_release }}
          CUA_BENCHMARK_BASELINE: ${{ inputs.cua_benchmark_baseline }}
        run: node scripts/resolve-release-build-scope.ts

      - id: release_meta
        name: Resolve release policy
        env:
          RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
        run: node scripts/resolve-release-update-policy.ts "$RELEASE_VERSION"

      - id: source_provenance
        name: Verify exact release source
        env:
          RELEASE_VERSION: ${{ steps.release_meta.outputs.version }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
          PUBLISH_RELEASE: ${{ steps.release_mode.outputs.publish_release }}
          EXPECTED_COMMIT: ${{ github.sha }}
          SOURCE_REF_TYPE: ${{ github.ref_type }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: |
          node scripts/verify-release-source-provenance.ts \
            "$RELEASE_VERSION" \
            "$RELEASE_TAG" \
            "$PUBLISH_RELEASE" \
            "$EXPECTED_COMMIT" \
            "$SOURCE_REF_TYPE" \
            "$SOURCE_REF_NAME"

      - name: Verify public updater repository
        if: steps.release_mode.outputs.publish_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "The dedicated updater channel requires the public GitHub provider; repository visibility is $visibility." >&2
            exit 1
          fi

      - name: Verify pinned compatibility feed
        if: ${{ steps.release_meta.outputs.release_lane == 'clean' && steps.release_mode.outputs.publish_release == 'true' && steps.release_meta.outputs.mirror_to_stable_channel == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: ${{ steps.release_meta.outputs.bridge_tag }}
          UPDATE_CHANNEL: ${{ steps.release_meta.outputs.update_channel }}
        run: |
          actual_latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$actual_latest" != "$BRIDGE_TAG" ]]; then
            echo "Expected GitHub Latest to remain pinned to $BRIDGE_TAG, got $actual_latest." >&2
            exit 1
          fi

          bridge_release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${BRIDGE_TAG}" --jq .id)"
          bridge_assets="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${bridge_release_id}/assets?per_page=100" \
              --jq '.[].name'
          )"
          required_assets=(
            latest-mac.yml
            latest.yml
            latest-linux.yml
            "${UPDATE_CHANNEL}-mac.yml"
            "${UPDATE_CHANNEL}.yml"
            "${UPDATE_CHANNEL}-linux.yml"
          )
          for required_asset in "${required_assets[@]}"; do
            if ! grep -Fxq "$required_asset" <<< "$bridge_assets"; then
              echo "Pinned compatibility feed is missing $required_asset." >&2
              exit 1
            fi
          done

  # Preflight resolves policy only, so the quality gates fan out immediately.
  # The serial server suite is the longest gate; it runs in its own shards below.
  quality:
    name: Quality gates
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Five workspace packages patch the one shared TypeScript install in their
      # prepare scripts; concurrent patching of that file is a race, so lifecycle
      # scripts run one at a time here.
      - name: Install dependencies
        run: bun install --frozen-lockfile --concurrent-scripts=1

      - name: Verify Synara identity
        run: bun run brand:check

      - name: Lint
        if: needs.preflight.outputs.quality_gates == 'true'
        run: bun run lint

      - name: Typecheck
        if: needs.preflight.outputs.quality_gates == 'true'
        run: bun run typecheck

      - name: Test every package except the server
        if: needs.preflight.outputs.quality_gates == 'true'
        run: bunx turbo run test --filter='!@synara/cli'

  # The server package runs its files serially (see apps/server/package.json).
  # Vitest's native shards keep every file and assertion; only the distribution
  # across runners changes, matching the measured three-way split in ci.yml.
  server_tests:
    name: Server tests (${{ matrix.shard }})
    needs: preflight
    if: needs.preflight.outputs.quality_gates == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      # One shard's failure must not cancel the others, so every lane reports
      # complete signal for the release gate.
      fail-fast: false
      matrix:
        shard: ["1/3", "2/3", "3/3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --concurrent-scripts=1

      - name: Test server shard ${{ matrix.shard }}
        run: bunx turbo run test --filter=@synara/cli -- --shard=${{ matrix.shard }}

  build_portable:
    name: Build portable JavaScript
    needs: [preflight, quality, server_tests]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' && (needs.server_tests.result == 'success' || needs.server_tests.result == 'skipped') && needs.preflight.outputs.build_js == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Report runner capacity
        run: node scripts/report-build-runner.ts
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'
      - name: Build portable outputs
        run: bun run build:desktop
      - name: Record portable output provenance
        env:
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
        run: |
          mkdir -p "$RUNNER_TEMP/portable-build"
          node scripts/portable-build.ts create "$RUNNER_TEMP/portable-build/manifest.json" "$SOURCE_COMMIT"
          tar -cf "$RUNNER_TEMP/portable-build/outputs.tar" apps/desktop/dist-electron apps/server/dist
      - uses: actions/upload-artifact@v7
        with:
          name: portable-build
          path: ${{ runner.temp }}/portable-build/*
          compression-level: 1
          if-no-files-found: error

  build_mac_icon:
    name: Compile macOS icon
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' && (needs.server_tests.result == 'success' || needs.server_tests.result == 'skipped') && needs.preflight.outputs.build_icon == 'true' }}
    needs: [preflight, quality, server_tests]
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Compile Icon Composer catalog
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          set -euo pipefail
          xcodebuild -version
          mkdir -p "$RUNNER_TEMP/mac-icon"
          xcrun actool assets/prod/Synara.icon --compile "$RUNNER_TEMP/mac-icon" --platform macosx --minimum-deployment-target 26.0 --app-icon Synara --include-all-app-icons --output-partial-info-plist "$RUNNER_TEMP/icon-partial.plist" --output-format human-readable-text
          test -s "$RUNNER_TEMP/mac-icon/Assets.car"

      - name: Upload icon catalog
        uses: actions/upload-artifact@v7
        with:
          name: mac-icon-catalog
          path: ${{ runner.temp }}/mac-icon/Assets.car
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    needs: [preflight, quality, server_tests, build_mac_icon, build_portable]
    if: ${{ !cancelled() && needs.preflight.result == 'success' && needs.quality.result == 'success' && (needs.server_tests.result == 'success' || needs.server_tests.result == 'skipped') && needs.preflight.outputs.build_native == 'true' && (needs.build_mac_icon.result == 'success' || needs.build_mac_icon.result == 'skipped') && (needs.build_portable.result == 'success' || needs.build_portable.result == 'skipped') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ needs.preflight.outputs.benchmark_native == 'true' && 25 || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        if: needs.preflight.outputs.package_artifacts == 'true'
        # Preflight validates the entire workspace. Native artifacts retain all
        # runtime/build dependencies but do not install the unrelated marketing site.
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'

      - name: Download macOS icon catalog
        if: matrix.platform == 'mac' && needs.preflight.outputs.package_artifacts == 'true'
        uses: actions/download-artifact@v8
        with:
          name: mac-icon-catalog
          path: ${{ runner.temp }}/mac-icon

      - name: Select macOS native toolchain
        if: matrix.platform == 'mac' && needs.preflight.outputs.package_artifacts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The pinned apple-metal bridge requires the macOS 15 SDK.
          # Icon Composer runs separately on macOS 26 to avoid AssetRuntime
          # framework crashes on the older native-build host.
          native_developer_dir=/Applications/Xcode_16.4.app/Contents/Developer
          test -d "$native_developer_dir"
          test -s "$RUNNER_TEMP/mac-icon/Assets.car"
          echo "DEVELOPER_DIR=$native_developer_dir" >> "$GITHUB_ENV"
          echo "SYNARA_MAC_ICON_CATALOG=$RUNNER_TEMP/mac-icon/Assets.car" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$native_developer_dir" xcodebuild -version

      - name: Report runner capacity
        run: node scripts/report-build-runner.ts

      - name: Provision verified Cua
        if: matrix.platform == 'mac' || matrix.platform == 'linux'
        uses: ./.github/actions/provision-cua
        with:
          benchmark-baseline: ${{ inputs.cua_benchmark_baseline || '' }}

      - name: Upload Cua benchmark evidence
        if: ${{ always() && needs.preflight.outputs.benchmark_native == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: cua-benchmark-${{ matrix.arch }}
          path: ${{ runner.temp }}/cua-benchmark/evidence
          if-no-files-found: error

      - name: Restore portable outputs
        if: needs.preflight.outputs.package_artifacts == 'true'
        uses: ./.github/actions/restore-portable-build
        with:
          source-commit: ${{ needs.preflight.outputs.source_commit }}

      - id: build_artifact
        if: needs.preflight.outputs.package_artifacts == 'true'
        name: Build desktop artifact
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}
          SYNARA_PUBLISH_RELEASE: ${{ needs.preflight.outputs.publish_release }}
          ALLOW_UNSIGNED_WINDOWS_PUBLICATION: ${{ vars.SYNARA_ALLOW_UNSIGNED_WINDOWS_RELEASE == needs.preflight.outputs.version }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          SOURCE_TAG: ${{ needs.preflight.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ needs.preflight.outputs.lockfile_sha256 }}
        run: |
          signed=false
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --source-commit "$SOURCE_COMMIT"
            --lockfile-sha256 "$LOCKFILE_SHA256"
            --skip-build
            --keep-stage
            --verbose
          )

          if [[ -n "$SOURCE_TAG" ]]; then
            args+=(--source-tag "$SOURCE_TAG")
          fi

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              echo "macOS signing enabled."
              signed=true
              args+=(--signed)
            elif [[ "$SYNARA_PUBLISH_RELEASE" == "true" ]]; then
              echo "Publishing macOS artifacts requires every signing and notarization secret."
              exit 1
            else
              echo "Build-only macOS artifact will be unsigned because publication is disabled."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME" \
              "$AZURE_TRUSTED_SIGNING_SUBJECT_DN"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              signed=true
              args+=(--signed)
            elif [[ "$SYNARA_PUBLISH_RELEASE" == "true" && "$ALLOW_UNSIGNED_WINDOWS_PUBLICATION" != "true" ]]; then
              echo "Publishing Windows artifacts requires every Azure Trusted Signing secret."
              exit 1
            else
              echo "Windows artifact will be unsigned under the explicit version-scoped release exception."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          # Never retry source, signing or notarization failures as downloads.
          bun run dist:desktop:artifact -- "${args[@]}"

          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        if: needs.preflight.outputs.package_artifacts == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/latest*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ matrix.platform }}" == "mac" && "${{ matrix.arch }}" != "arm64" ]]; then
            if [[ -f release-publish/latest-mac.yml ]]; then
              mv release-publish/latest-mac.yml "release-publish/latest-mac-${{ matrix.arch }}.yml"
            fi
          fi

      - name: Verify and record artifact provenance
        if: needs.preflight.outputs.package_artifacts == 'true'
        shell: bash
        env:
          EXPECTED_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_WINDOWS_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          EXPECTED_WINDOWS_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}
          SOURCE_COMMIT: ${{ needs.preflight.outputs.source_commit }}
          SOURCE_TAG: ${{ needs.preflight.outputs.source_tag }}
          LOCKFILE_SHA256: ${{ needs.preflight.outputs.lockfile_sha256 }}
          PUBLISH_RELEASE: ${{ needs.preflight.outputs.publish_release }}
          SIGNED_ARTIFACT: ${{ steps.build_artifact.outputs.signed }}
          ALLOW_UNSIGNED_WINDOWS_PUBLICATION: ${{ vars.SYNARA_ALLOW_UNSIGNED_WINDOWS_RELEASE == needs.preflight.outputs.version }}
        run: |
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release-publish \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --target "${{ matrix.target }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --publication "$PUBLISH_RELEASE" \
            --signed "$SIGNED_ARTIFACT" \
            --allow-unsigned-windows-publication "$ALLOW_UNSIGNED_WINDOWS_PUBLICATION" \
            --expected-mac-team-id "$EXPECTED_MAC_TEAM_ID" \
            --expected-windows-publisher "$EXPECTED_WINDOWS_PUBLISHER" \
            --expected-windows-subject-dn "$EXPECTED_WINDOWS_SUBJECT_DN"

      - name: Smoke packaged desktop startup
        if: needs.preflight.outputs.package_artifacts == 'true'
        shell: bash
        run: |
          node scripts/verify-packaged-desktop-startup.ts \
            --assets-dir release-publish \
            --platform "${{ matrix.platform }}" \
            --arch "${{ matrix.arch }}" \
            --version "${{ needs.preflight.outputs.version }}"

      - name: Upload build artifacts
        if: needs.preflight.outputs.package_artifacts == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  publish_cli:
    name: Publish CLI to npm
    if: ${{ needs.preflight.outputs.publish_release == 'true' && vars.SYNARA_PUBLISH_CLI == '1' }}
    needs: [preflight, build, build_portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        # Preflight already validates lifecycle scripts; the publish job only
        # needs dependencies available to build the package.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore portable outputs
        uses: ./.github/actions/restore-portable-build
        with:
          source-commit: ${{ needs.preflight.outputs.source_commit }}

      - name: Publish CLI package
        run: node apps/server/scripts/cli.ts publish --tag latest --app-version "${{ needs.preflight.outputs.version }}" --verbose

  build_server_tarball:
    name: Build server tarball
    if: needs.preflight.outputs.build_server == 'true'
    needs: [preflight, build_portable]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Install dependencies
        # Preflight already validates lifecycle scripts; this job only needs
        # dependencies available to build the package.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Restore portable outputs
        uses: ./.github/actions/restore-portable-build
        with:
          source-commit: ${{ needs.preflight.outputs.source_commit }}

      - name: Pack server tarball
        run: node apps/server/scripts/cli.ts pack --out release-server --app-version "${{ needs.preflight.outputs.version }}"

      - name: Upload server tarball
        uses: actions/upload-artifact@v7
        with:
          name: server-tarball
          path: release-server/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: ${{ needs.preflight.outputs.publish_release == 'true' }}
    needs: [preflight, build, build_server_tarball]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download server tarball
        uses: actions/download-artifact@v8
        with:
          name: server-tarball
          path: release-assets

      - name: Merge macOS updater manifests
        run: |
          node scripts/merge-mac-update-manifests.ts \
            release-assets/latest-mac.yml \
            release-assets/latest-mac-x64.yml
          rm -f release-assets/latest-mac-x64.yml

      - name: Prepare updater feed metadata
        run: node scripts/prepare-release-update-feed.ts release-assets

      - name: Prevent compatibility channel rollback
        if: ${{ needs.preflight.outputs.release_lane == 'bridge' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: ${{ needs.preflight.outputs.bridge_tag }}
          BRIDGE_VERSION: ${{ needs.preflight.outputs.version }}
          UPDATE_CHANNEL: ${{ needs.preflight.outputs.update_channel }}
        run: |
          set -euo pipefail

          if ! bridge_release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${BRIDGE_TAG}" 2>&1
          )"; then
            if grep -q "HTTP 404" <<< "$bridge_release_json"; then
              exit 0
            fi
            echo "$bridge_release_json" >&2
            exit 1
          fi
          bridge_release_id="$(jq -r .id <<< "$bridge_release_json")"

          bridge_assets="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/releases/${bridge_release_id}/assets?per_page=100" \
              --jq '.[].name'
          )"
          channel_manifests=(
            "${UPDATE_CHANNEL}-mac.yml"
            "${UPDATE_CHANNEL}.yml"
            "${UPDATE_CHANNEL}-linux.yml"
          )
          existing_manifests=()
          for manifest in "${channel_manifests[@]}"; do
            if grep -Fxq "$manifest" <<< "$bridge_assets"; then
              existing_manifests+=("$manifest")
            fi
          done

          if [[ "${#existing_manifests[@]}" -eq 0 ]]; then
            exit 0
          fi
          if [[ "${#existing_manifests[@]}" -ne "${#channel_manifests[@]}" ]]; then
            echo "Compatibility feed has a partial dedicated-channel manifest set: ${existing_manifests[*]}." >&2
            exit 1
          fi

          manifest_directory="$(mktemp -d)"
          trap 'rm -rf "$manifest_directory"' EXIT
          for manifest in "${channel_manifests[@]}"; do
            gh release download "$BRIDGE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "$manifest" \
              --dir "$manifest_directory"
            manifest_version="$(
              sed -n 's/^version:[[:space:]]*//p' "$manifest_directory/$manifest" \
                | head -n 1 \
                | tr -d "[:space:]'\""
            )"
            if [[ "$manifest_version" != "$BRIDGE_VERSION" ]]; then
              echo "Refusing to replace $manifest version ${manifest_version:-unknown} with compatibility version $BRIDGE_VERSION." >&2
              exit 1
            fi
          done

      - name: Recheck pinned compatibility feed
        if: ${{ needs.preflight.outputs.release_lane == 'clean' && needs.preflight.outputs.mirror_to_stable_channel == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: ${{ needs.preflight.outputs.bridge_tag }}
        run: |
          actual_latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$actual_latest" != "$BRIDGE_TAG" ]]; then
            echo "Expected GitHub Latest to remain pinned to $BRIDGE_TAG, got $actual_latest." >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.ref }}
          name: Synara v${{ needs.preflight.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.is_prerelease }}
          make_latest: ${{ needs.preflight.outputs.make_latest }}
          files: |
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
            release-assets/*.yml
            release-assets/*.provenance.json
            release-assets/*.tar.gz
          fail_on_unmatched_files: true

      - name: Mirror Synara artifacts onto the pinned updater feed
        if: ${{ needs.preflight.outputs.mirror_to_stable_channel == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRIDGE_TAG: ${{ needs.preflight.outputs.bridge_tag }}
          UPDATE_CHANNEL: ${{ needs.preflight.outputs.update_channel }}
        run: |
          set -euo pipefail

          actual_latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$actual_latest" != "$BRIDGE_TAG" ]]; then
            echo "Expected GitHub Latest to remain pinned to $BRIDGE_TAG, got $actual_latest." >&2
            exit 1
          fi

          shopt -s nullglob
          payloads=(
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.exe
            release-assets/*.blockmap
          )
          manifests=(
            "release-assets/${UPDATE_CHANNEL}-mac.yml"
            "release-assets/${UPDATE_CHANNEL}.yml"
            "release-assets/${UPDATE_CHANNEL}-linux.yml"
          )

          if [[ "${#payloads[@]}" -eq 0 ]]; then
            echo "No desktop payloads found for the pinned updater feed." >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            if [[ ! -f "$manifest" ]]; then
              echo "Missing updater manifest: $manifest" >&2
              exit 1
            fi
          done

          # Payloads must exist before a manifest is visible, otherwise an
          # updater can observe a version whose installer is not uploaded yet.
          gh release upload "$BRIDGE_TAG" "${payloads[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$BRIDGE_TAG" "${manifests[@]}" --clobber --repo "$GITHUB_REPOSITORY"

          actual_latest="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)"
          if [[ "$actual_latest" != "$BRIDGE_TAG" ]]; then
            echo "Pinned updater feed moved during publication: $actual_latest." >&2
            exit 1
          fi

  finalize:
    name: Finalize release
    if: ${{ needs.preflight.outputs.publish_release == 'true' && vars.SYNARA_FINALIZE_RELEASE == '1' }}
    needs: [preflight, release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: app_token
        name: Mint release app token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app_token.outputs.token }}
          persist-credentials: true

      - id: app_bot
        name: Resolve GitHub App bot identity
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          echo "name=${APP_SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - id: update_versions
        name: Update version strings
        env:
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --github-output

      - name: Format package.json files
        if: steps.update_versions.outputs.changed == 'true'
        run: bunx oxfmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json

      - name: Refresh lockfile
        if: steps.update_versions.outputs.changed == 'true'
        run: bun install --lockfile-only --ignore-scripts

      - name: Commit and push version bump
        if: steps.update_versions.outputs.changed == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json bun.lock; then
            echo "No version changes to commit."
            exit 0
          fi

          git config user.name "${{ steps.app_bot.outputs.name }}"
          git config user.email "${{ steps.app_bot.outputs.email }}"

          git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json bun.lock
          git commit -m "chore(release): prepare $RELEASE_TAG"
          git push origin HEAD:main
