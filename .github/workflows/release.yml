name: Publish Synara 1.6.0 from existing artifacts
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v6
        with:
          ref: f0dc29b5db8567d2fba730e8f436b5905fc4c3c6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - name: Install release script dependencies
        run: bun install --frozen-lockfile --ignore-scripts --filter @synara/scripts --production
      - name: Download qualified macOS and Linux artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "43746836975"
          path: release-assets
          digest-mismatch: error
      - name: Download original Windows candidate
        uses: actions/download-artifact@v8
        with:
          artifact-ids: "14175446214"
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "43746836975"
          path: windows-candidate
          digest-mismatch: error
      - name: Download successful Defender evidence
        uses: actions/download-artifact@v8
        with:
          name: defender-only-1.6.0
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "43752804401"
          path: defender-evidence
          digest-mismatch: error
      - name: Download server tarball
        uses: actions/download-artifact@v8
        with:
          name: server-tarball
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: "43746836975"
          path: release-assets
          digest-mismatch: error
      - name: Prepare and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view 43752804401 --json conclusion --jq .conclusion)" = success
          python3 - <<'PY'
          import hashlib, json, pathlib, shutil
          source=pathlib.Path('windows-candidate')
          evidence=json.loads(pathlib.Path('defender-evidence/results.json').read_text(encoding='utf-8-sig'))
          records=evidence if isinstance(evidence,list) else [evidence]
          installer=source/'Synara-1.6.0-x64.exe'
          found=[x for x in records if x.get('name')==installer.name and x.get('exitCode')==0]
          if len(found)!=1 or hashlib.sha256(installer.read_bytes()).hexdigest().lower()!=found[0]['sha256'].lower():
              raise SystemExit('Windows installer does not match successful Defender evidence')
          for name in ['Synara-1.6.0-x64.exe','Synara-1.6.0-x64.exe.blockmap','latest.yml','artifact-win-x64.provenance.json']:
              p=source/name
              if not p.is_file(): raise SystemExit('Missing '+name)
              shutil.copy2(p,pathlib.Path('release-assets')/name)
          text=pathlib.Path('CHANGELOG.md').read_text()
          section=text.split('## 1.6.0 — 2026-11-15',1)[1].split('\n## ',1)[0]
          section=section.split('### Verification',1)[0]
          pathlib.Path('release-notes.md').write_text(section+'\n### Qualification\n\nWindows x64 is unsigned. The final installer passed Microsoft Defender on Windows Server 2025; the packaged Windows startup smoke did not pass and was not repeated for this publication. macOS and Linux packaging and startup checks passed.\n')
          PY
          node scripts/merge-mac-update-manifests.ts release-assets/latest-mac.yml release-assets/latest-mac-x64.yml
          rm release-assets/latest-mac-x64.yml
          node scripts/prepare-release-update-feed.ts release-assets --channel synara
          if gh release view v1.6.0 >/dev/null 2>&1; then echo 'Release already exists; refusing overwrite'; exit 1; fi
          gh release create v1.6.0 --draft --title 'Synara v1.6.0' --notes-file release-notes.md
          gh release upload v1.6.0 release-assets/*.dmg release-assets/*.zip release-assets/*.AppImage release-assets/*.exe release-assets/*.blockmap release-assets/*.yml release-assets/*.provenance.json release-assets/*.tar.gz
          gh release edit v1.6.0 --draft=false --latest
