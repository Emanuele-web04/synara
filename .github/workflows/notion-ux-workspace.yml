name: Format Notion PR Gallery

on:
  push:
    branches: [feat/notion-enterprise-oauth-integration]
    paths: [.github/workflows/notion-ux-workspace.yml]

permissions:
  contents: write

jobs:
  format-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
        with:
          scope: static
      - name: Format exactly the new evidence gallery
        run: |
          bun run fmt -- docs/assets/notion-pr-1937/README.md
          git diff --check
          git diff -- docs/assets/notion-pr-1937/README.md
      - name: Stage formatted README without publishing a branch change
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          const filename="docs/assets/notion-pr-1937/README.md";
          const changed=execFileSync("git",["diff","--name-only"],{encoding:"utf8"}).trim().split("\n").filter(Boolean);
          if(changed.length!==1||changed[0]!==filename)throw Error("Unexpected formatter changes: "+changed.join(", "));
          const bytes=readFileSync(filename);
          const response=await fetch("https://api.github.com/repos/"+process.env.GH_REPO+"/git/blobs",{
            method:"POST",
            headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+process.env.GH_TOKEN,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},
            body:JSON.stringify({content:bytes.toString("base64"),encoding:"base64"}),
          });
          const data=await response.json();
          if(!response.ok||!data.sha)throw Error("Blob staging failed: "+response.status+" "+String(data.message||""));
          console.log("FORMATTED_README_SHA="+data.sha);
          console.log("Published no refs; formatting-only bytes="+bytes.length);
          NODE
