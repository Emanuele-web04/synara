name: Notion UX workspace

on:
  push:
    branches: [feat/notion-enterprise-oauth-integration]
    paths: [.github/workflows/notion-ux-workspace.yml]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 75c55fa5250b8bf0646c53e350d73d95c38d0cb5
          persist-credentials: false
      - name: Archive pinned source without credentials or local state
        run: |
          mkdir -p "$RUNNER_TEMP/notion-ux-source"
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/notion-ux-source/source.tar.gz"
          git rev-parse HEAD > "$RUNNER_TEMP/notion-ux-source/source-commit.txt"
          sha256sum "$RUNNER_TEMP/notion-ux-source/source.tar.gz" > "$RUNNER_TEMP/notion-ux-source/source.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: notion-ux-source
          path: ${{ runner.temp }}/notion-ux-source
          retention-days: 2
          compression-level: 0
          if-no-files-found: error
