name: Static CI scope experiment
on:
  push:
    branches: [codex/ci-cross-platform-measurements]
    paths: [.github/workflows/ci-static-benchmark.yml]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Measure correct static scope, including release smoke
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, tempfile, time
          records=[]
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'static-results';out.mkdir()
          for sample in range(3):
              with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as td:
                  repo=pathlib.Path(td)/'repo'
                  subprocess.run(['git','worktree','add','--detach',str(repo),'HEAD'],check=True)
                  try:
                      env={**os.environ,'BUN_INSTALL_CACHE_DIR':str(pathlib.Path(td)/'cache')}
                      args=['bun','install','--frozen-lockfile','--filter','./','--filter','@synara/scripts']
                      start=time.monotonic();r=subprocess.run(args,cwd=repo,env=env,capture_output=True,text=True)
                      records.append({'sample':sample,'seconds':time.monotonic()-start,'status':r.returncode})
                      (out/f'install-{sample}.log').write_text(r.stdout+r.stderr)
                      (out/'results.json').write_text(json.dumps(records,indent=2))
                      r.check_returncode()
                      if sample==0:
                          for script in ['brand:check','windows-runtime:check','lint','release:smoke']:
                              result=subprocess.run(['bun','run',script],cwd=repo,env=env,capture_output=True,text=True)
                              (out/(script.replace(':','-')+'.log')).write_text(result.stdout+result.stderr)
                              result.check_returncode()
                          subprocess.run(['bun','run','fmt'],cwd=repo,env=env,check=True)
                          subprocess.run(['bun','run','fmt:check'],cwd=repo,env=env,check=True)
                          diff=subprocess.check_output(['git','diff','--binary'],cwd=repo)
                          (out/'format.patch').write_bytes(diff)
                  finally:
                      subprocess.run(['git','worktree','remove','--force',str(repo)],check=True)
          print(json.dumps(records,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: static-scripts-measurements
          path: ${{ runner.temp }}/static-results
          retention-days: 14
          if-no-files-found: error
