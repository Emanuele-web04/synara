name: CI candidate validation
on:
  pull_request:
    paths:
      - .github/workflows/ci-native-validation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'codex/ci-cross-platform' && github.run_number == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c4456e7c9f1df1223a439b1bd5d71534b308eff9
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Prepare offline verification tools and source
        run: |
          mkdir -p "$RUNNER_TEMP/source-evidence"
          git archive --format=tar.gz HEAD > "$RUNNER_TEMP/source-evidence/source.tar.gz"
          ELECTRON_SKIP_BINARY_DOWNLOAD=1 bun install --frozen-lockfile --filter './'
          tar -czf "$RUNNER_TEMP/source-evidence/root-tools.tar.gz" node_modules
          cp "$(which bun)" "$RUNNER_TEMP/source-evidence/bun"
          git rev-parse HEAD > "$RUNNER_TEMP/source-evidence/source-sha.txt"
          npm view @browserbasehq/stagehand version --json > "$RUNNER_TEMP/source-evidence/stagehand-version.json"
      - name: Collect baseline diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Emanuele-web04/synara/actions/jobs/103799175918/logs > "$RUNNER_TEMP/source-evidence/baseline-server.log"
          tail -100 "$RUNNER_TEMP/source-evidence/baseline-server.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: offline-source-evidence
          path: ${{ runner.temp }}/source-evidence
          retention-days: 3
  native:
    if: github.event_name == 'workflow_dispatch' || (github.head_ref == 'codex/ci-cross-platform' && github.run_number == 1)
    name: Native (${{ matrix.os }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
            target: dmg
            variant: full
          - os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            variant: full
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
            variant: full
          - os: windows-2022
            platform: win
            arch: x64
            target: nsis
            variant: full
          - os: macos-14
            platform: mac
            arch: arm64
            target: dmg
            variant: filtered
          - os: macos-15-intel
            platform: mac
            arch: x64
            target: dmg
            variant: filtered
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            target: AppImage
            variant: filtered
          - os: windows-2022
            platform: win
            arch: x64
            target: nsis
            variant: filtered
    steps:
      - uses: actions/checkout@v6
        with:
          ref: c4456e7c9f1df1223a439b1bd5d71534b308eff9
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Frozen install, native package, provenance and startup
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          BUILD_TARGET: ${{ matrix.target }}
          SYNARA_PUBLISH_RELEASE: 'false'
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, writeFileSync, readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const dir = join(process.env.RUNNER_TEMP, 'native-evidence');
          mkdirSync(dir, { recursive: true });
          const version = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8')).version;
          const sha = spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).stdout.trim();
          const lock = createHash('sha256').update(readFileSync('bun.lock')).digest('hex');
          const { BUILD_PLATFORM: platform, BUILD_ARCH: arch, BUILD_TARGET: target, VARIANT: variant } = process.env;
          const results = { sha, platform, arch, variant, steps: [] };
          const filters = variant === 'filtered' ? ['--filter', './', '--filter', '@synara/cli...', '--filter', '@synara/desktop...', '--filter', '@synara/scripts...'] : [];
          const tasks = [
            ['install', 'bun', ['install', '--frozen-lockfile', '--ignore-scripts', ...filters]],
            ['package', 'bun', ['run', 'dist:desktop:artifact', '--', '--platform', platform, '--target', target, '--arch', arch, '--build-version', version, '--source-commit', sha, '--lockfile-sha256', lock, '--verbose']],
            ['provenance', 'node', ['scripts/write-release-artifact-provenance.ts', '--assets-dir', 'release', '--platform', platform, '--arch', arch, '--target', target, '--version', version, '--source-commit', sha, '--source-tag', '', '--lockfile-sha256', lock, '--publication', 'false', '--signed', 'false', '--allow-unsigned-windows-publication', 'false', '--expected-mac-team-id', '', '--expected-windows-publisher', '', '--expected-windows-subject-dn', '']],
            ['startup', 'node', ['scripts/verify-packaged-desktop-startup.ts', '--assets-dir', 'release', '--platform', platform, '--arch', arch, '--version', version]],
          ];
          for (const [name, command, args] of tasks) {
            const start = performance.now();
            const run = spawnSync(command, args, { encoding: 'utf8', timeout: 1_200_000, maxBuffer: 64 * 1024 * 1024 });
            const log = `${run.stdout ?? ''}\n${run.stderr ?? ''}`;
            writeFileSync(join(dir, `${name}.log`), log);
            const result = { name, seconds: (performance.now() - start) / 1000, status: run.status };
            results.steps.push(result);
            writeFileSync(join(dir, 'native.json'), JSON.stringify(results, null, 2));
            console.log(JSON.stringify(result));
            if (run.status !== 0) throw new Error(`${name}: ${run.error ?? log.slice(-10000)}`);
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/native-evidence
          retention-days: 14
