name: CI bounded setup validation

on:
  push:
    branches: [codex/ci-cross-platform]
    paths:
      - .github/workflows/ci-inspect.yml

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Collect exact prior CI and pinned workflow validator
        run: |
          mkdir -p "$RUNNER_TEMP/validation/bin" "$RUNNER_TEMP/validation/prior"
          cp "$(command -v node)" "$RUNNER_TEMP/validation/bin/node"
          GOBIN="$RUNNER_TEMP/validation/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          git fetch --depth=1 origin 45ecb1be74cdfb6ad9f76e04e0cad07967a9cb46
          git archive FETCH_HEAD .github/CI.md .github/scripts .github/workflows/ci.yml .github/actions/setup-workspace | tar -x -C "$RUNNER_TEMP/validation/prior"
          tar -czf "$RUNNER_TEMP/validation-tools.tar.gz" -C "$RUNNER_TEMP/validation" .
      - uses: actions/upload-artifact@v7
        with:
          name: validation-tools
          path: ${{ runner.temp }}/validation-tools.tar.gz
          compression-level: 0
          retention-days: 1
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Matched full and filtered lifecycle installations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdirSync, readFileSync, writeFileSync, rmSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { join } from 'node:path';
          const root = process.cwd();
          const evidence = join(process.env.RUNNER_TEMP, 'windows-installs');
          mkdirSync(evidence, { recursive: true });
          const sha = spawnSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).stdout.trim();
          const lock = createHash('sha256').update(readFileSync('bun.lock')).digest('hex');
          const samples = [];
          for (const [i, variant] of ['full', 'filtered', 'filtered', 'full'].entries()) {
            const cwd = join(process.env.RUNNER_TEMP, `wi-${i}`);
            const cache = join(process.env.RUNNER_TEMP, `wc-${i}`);
            const checkout = spawnSync('git', ['worktree', 'add', '--detach', cwd, 'HEAD'], { encoding: 'utf8' });
            if (checkout.status !== 0) throw new Error(checkout.stderr);
            const args = ['install', '--frozen-lockfile'];
            if (variant === 'filtered') args.push('--filter', './', '--filter', '@synara/cli...', '--filter', '@synara/desktop...', '--filter', '@synara/scripts...');
            const start = performance.now();
            const run = spawnSync('bun', args, { cwd, encoding: 'utf8', timeout: 300_000, maxBuffer: 32 * 1024 * 1024,
              env: { ...process.env, BUN_INSTALL_CACHE_DIR: cache, ELECTRON_SKIP_BINARY_DOWNLOAD: '1' } });
            const log = `${run.stdout ?? ''}\n${run.stderr ?? ''}`;
            const sample = { i, variant, seconds: (performance.now() - start) / 1000, status: run.status,
              packages: log.match(/(\d+) packages? installed/)?.[1] };
            samples.push(sample);
            writeFileSync(join(evidence, `${i}-${variant}.log`), log);
            writeFileSync(join(evidence, 'installs.json'), JSON.stringify({ sha, lock, samples }, null, 2));
            console.log(JSON.stringify(sample));
            if (run.status !== 0) throw new Error(`${run.error ?? log}`);
            // Node, not Git, removes only our temporary worktrees with long paths.
            rmSync(cwd, { recursive: true, force: true, maxRetries: 3 });
            rmSync(cache, { recursive: true, force: true, maxRetries: 3 });
            const prune = spawnSync('git', ['worktree', 'prune'], { cwd: root, encoding: 'utf8' });
            if (prune.status !== 0) throw new Error(prune.stderr);
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-installs
          path: ${{ runner.temp }}/windows-installs
          retention-days: 14
