name: Inspect CI candidate
on:
  push:
    branches: [codex/ci-cross-platform-measurements]
    paths: [.github/workflows/ci-inspect-candidate.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile --filter './' --filter '@synara/scripts'
      - name: Export actual formatter output
        run: |
          bun run fmt
          python3 - <<'PY'
          import json, pathlib, subprocess, os, shutil
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'inspection';out.mkdir()
          files=subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          (out/'formatted-files.json').write_text(json.dumps({f:pathlib.Path(f).read_text() for f in files if f}))
          binary=pathlib.Path('node_modules/.bin/oxfmt').resolve()
          shutil.copy2(binary,out/'oxfmt')
          PY
      - run: bun run fmt:check
      - run: node --test .github/scripts/ci-contracts.test.mjs .github/scripts/ci-shards.test.mjs
      - name: Validate Actions syntax and expressions with pinned actionlint
        run: |
          curl --fail --silent --show-error --location 'https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz' -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/inspection" actionlint
          "$RUNNER_TEMP/inspection/actionlint" -shellcheck='' .github/workflows/ci.yml .github/workflows/release.yml .github/workflows/device-helper-matrix.yml
      - name: Record external-service configuration availability without exposing values
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
          TURBO_TEAM: ${{ vars.TURBO_TEAM || secrets.TURBO_TEAM }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          BROWSERBASE_PROJECT_ID: ${{ vars.BROWSERBASE_PROJECT_ID || secrets.BROWSERBASE_PROJECT_ID }}
        run: |
          node -e "const fs=require('node:fs'); const keys=['TURBO_TOKEN','TURBO_TEAM','BROWSERBASE_API_KEY','BROWSERBASE_PROJECT_ID']; fs.writeFileSync(process.env.RUNNER_TEMP+'/inspection/service-availability.json',JSON.stringify(Object.fromEntries(keys.map(k=>[k,Boolean(process.env[k])])),null,2));"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-inspection
          path: ${{ runner.temp }}/inspection
          retention-days: 14
          if-no-files-found: error
