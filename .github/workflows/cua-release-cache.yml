name: Prepare release Cua cache
on:
  push:
    branches: [main]
    paths:
      - packages/shared/src/cuaDriverRelease.json
      - apps/desktop/patches/cua-driver/**
      - apps/desktop/scripts/provision-cua-driver.mjs
      - apps/desktop/scripts/cua-artifact-provenance.mjs
      - apps/desktop/scripts/cua-cache-key.mjs
      - apps/desktop/scripts/find-cua-artifact.mjs
      - scripts/lib/build-timing.ts
      - .github/actions/provision-cua/action.yml
      - .github/workflows/cua-release-cache.yml
  workflow_dispatch:
  schedule:
    # Refresh before retention expires and detect hosted SDK/library drift.
    - cron: "23 4 * * *"
permissions:
  contents: read
  actions: read
concurrency:
  group: cua-release-cache-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: ./.github/actions/provision-cua
        id: cua
        with:
          save-cache: "true"
      - name: Retain verified unsigned Cua outside the cache quota
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.cua.outputs.cache-key }}
          path: ${{ runner.temp }}/cua-artifact
          retention-days: 30
          if-no-files-found: error
