# Temporary diagnostic bridge. No branch refs are updated by this workflow.
name: Native marketplace review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/marketplace-review.yml]
permissions:
  contents: read
concurrency:
  group: marketplace-review-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: fe7c7eac683d46ac91ebb42825c1d168d8223edb
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38874222937
          name: marketplace-after
          path: evidence
      - name: Read captured failure and preserve actual PNGs as detached objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib, json, urllib.request, os
          root=pathlib.Path('evidence')
          for file in root.rglob('error-context.md'):
              print('ERROR_CONTEXT',file.read_text()[-18000:])
          def api(endpoint,body):
              data=json.dumps(body).encode()
              req=urllib.request.Request('https://api.github.com/repos/Emanuele-web04/synara/'+endpoint,data=data,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          import base64
          tree=[]
          for file in root.rglob('*.png'):
              if 'attachments' in file.parts or file.name not in ['marketplace-after-discover.png','test-failed-1.png']:continue
              data=file.read_bytes()
              if len(data)>2000000 or not data.startswith(b'\x89PNG\r\n\x1a\n'):raise RuntimeError('Unexpected screenshot format or size')
              blob=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              tree.append({'path':'docs/editor/evidence/review-'+file.name,'mode':'100644','type':'blob','sha':blob['sha']})
          result=api('git/trees',{'base_tree':'435a21153c4f7d7c36c0b510f18f844a23898482','tree':tree})
          identity={'name':'Commander Chara','email':'249489759+cmdr-chara@users.noreply.github.com'}
          commit=api('git/commits',{'message':'test(marketplace): preserve authentic diagnostic captures','tree':result['sha'],'parents':[os.environ['CANDIDATE_BASE']],'author':identity,'committer':identity})
          print('EVIDENCE_COMMIT',commit['sha'])
          print('EVIDENCE_BLOBS',json.dumps(tree))
          PY
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Normalize the failing test using its package-root configuration
        run: |
          cd apps/server
          ../../node_modules/.bin/oxfmt src/extensions/registryCatalog.test.ts
          cd ../..
          git diff -- apps/server/src/extensions/registryCatalog.test.ts
      - name: Preserve only the formatted test blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          const response=await fetch('https://api.github.com/repos/Emanuele-web04/synara/git/blobs',{
            method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
            body:JSON.stringify({content:await readFile('apps/server/src/extensions/registryCatalog.test.ts','utf8'),encoding:'utf-8'}),signal:AbortSignal.timeout(30000),
          });
          if(!response.ok)throw new Error(await response.text());
          console.log('FORMATTED_TEST_BLOB',(await response.json()).sha);
          NODE
      - name: Format
        run: bun run fmt:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -80 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Install browser regardless of unrelated check outcome
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Native marketplace and permission boundaries
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/settings/ExtensionMarketplace.browser.tsx
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: marketplace-component-evidence
          path: apps/web/src/components/settings/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
