# Temporary review bridge; publishes candidate objects but never changes branch refs.
name: Native marketplace review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/marketplace-review.yml]
permissions:
  contents: read
concurrency:
  group: marketplace-review-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: be5b4e669bc4f676be29c2c4ed5219f1ebb0aa4d
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply bounded marketplace repairs
        run: node scripts/repair-native-marketplace.mjs
      - name: Format affected files
        run: |
          ./node_modules/.bin/oxfmt apps/server/src/extensions/openVsx.ts apps/server/src/extensions/registryCatalog.test.ts \
            apps/web/src/components/settings/ExtensionMarketplace.tsx apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx \
            apps/web/e2e/editorMarketplace.e2e.ts .github/workflows/extension-marketplace-acceptance.yml
          cd apps/server && ../../node_modules/.bin/oxfmt src/extensions/registryCatalog.test.ts
      - name: Store normalized candidate without publishing a ref
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body){
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const allowed=new Set(['apps/server/src/extensions/openVsx.ts','apps/server/src/extensions/registryCatalog.test.ts','apps/web/src/components/settings/ExtensionMarketplace.tsx','apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx','apps/web/e2e/editorMarketplace.e2e.ts','.github/workflows/extension-marketplace-acceptance.yml']);
          const files=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree=[];
          for(const file of files){
            if(!allowed.has(file))throw new Error(`Unexpected change ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'scripts/repair-native-marketplace.mjs',mode:'100644',type:'blob',sha:null});
          const base=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:base.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'fix(marketplace): support upstream paging and native detail focus',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);console.log('NORMALIZED_FILES',JSON.stringify(tree));
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Required formatting and lint
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -60 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Integrated typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/types.log"; exit 1; }
      - name: Catalog and package safety
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/server test src/extensions/registryCatalog.test.ts src/extensions/openVsx.test.ts src/extensions/vsix.test.ts src/extensions/manifest.test.ts
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Native marketplace and explicit approval
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/settings/ExtensionMarketplace.browser.tsx
  application:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Actual catalog, details, install, removal and themes
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.marketplace.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: marketplace-after
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
  evidence:
    needs: [prepare, application]
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: marketplace-after
          path: evidence/after
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38874222937
          name: marketplace-before
          path: evidence/before
      - name: Preserve real images and surface bounded failure context
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
        run: |
          python3 - <<'PY'
          import pathlib, json, urllib.request, os, base64
          root=pathlib.Path('evidence')
          for file in root.rglob('error-context.md'):
              print('ERROR_CONTEXT',file.read_text()[:16000])
          def api(endpoint,body=None):
              req=urllib.request.Request('https://api.github.com/repos/Emanuele-web04/synara/'+endpoint,data=json.dumps(body).encode() if body else None,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          names={'marketplace-before.png','marketplace-after-discover.png','marketplace-after-details.png','marketplace-after-installed.png','marketplace-after-dark.png','marketplace-after-compact.png'}
          tree=[]
          for file in root.rglob('*.png'):
              if 'attachments' in file.parts or file.name not in names:continue
              data=file.read_bytes()
              if len(data)>2500000 or not data.startswith(b'\x89PNG\r\n\x1a\n'):raise RuntimeError('Unexpected image')
              blob=api('git/blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})
              tree.append({'path':'docs/editor/evidence/'+file.name,'mode':'100644','type':'blob','sha':blob['sha']})
          base=api('git/commits/'+os.environ['CANDIDATE'])
          result=api('git/trees',{'base_tree':base['tree']['sha'],'tree':tree})
          identity={'name':'Commander Chara','email':'249489759+cmdr-chara@users.noreply.github.com'}
          commit=api('git/commits',{'message':'test(marketplace): preserve authentic native application screenshots','tree':result['sha'],'parents':[os.environ['CANDIDATE']],'author':identity,'committer':identity})
          print('EVIDENCE_COMMIT',commit['sha']);print('EVIDENCE_TREE',result['sha']);print('EVIDENCE_BLOBS',json.dumps(tree))
          PY
