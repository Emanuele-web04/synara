# Temporary execution bridge. Removed from the reviewed application tree before publication.
name: Native marketplace review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/marketplace-review.yml]
permissions:
  contents: read
concurrency:
  group: marketplace-review-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: a21f87c7a2e9579f0a668c16c2be77e928ed4319
  BASELINE: 159d279515e775e94fe21e493ba31202b98a8955
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Integrate marketplace with existing authorization and settings
        run: node scripts/finish-extension-marketplace.mjs
      - name: Format only the requested change set
        run: |
          ./node_modules/.bin/oxfmt apps/web/src/components/settings/ExtensionMarketplace.tsx \
            apps/web/src/components/settings/ExtensionMarketplace.browser.tsx \
            apps/web/src/components/settings/editorExtensionsApi.ts \
            apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx \
            apps/server/src/extensions/openVsx.ts apps/server/src/extensions/extensionManager.ts \
            apps/server/src/extensions/registryCatalog.test.ts packages/contracts/src/editorExtensions.ts \
            apps/web/e2e/editorMarketplace.e2e.ts apps/web/playwright.marketplace.config.ts \
            apps/web/e2e/editorExtensions.e2e.ts apps/web/e2e/editorExtensionDebug.e2e.ts \
            apps/web/e2e/editorExtensionVsix.e2e.ts docs/editor/marketplace.md
      - name: Preserve normalized candidate objects without moving any branch
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFile, appendFile } from 'node:fs/promises';
          async function api(endpoint, body) {
            const response = await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`, {
              method: body ? 'POST' : 'GET', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const allowed = new Set([
            'apps/web/src/components/settings/ExtensionMarketplace.tsx','apps/web/src/components/settings/ExtensionMarketplace.browser.tsx',
            'apps/web/src/components/settings/editorExtensionsApi.ts','apps/web/src/components/settings/EditorExtensionsSettingsPanel.tsx',
            'apps/server/src/extensions/openVsx.ts','apps/server/src/extensions/extensionManager.ts','apps/server/src/extensions/registryCatalog.test.ts',
            'packages/contracts/src/editorExtensions.ts','apps/web/e2e/editorMarketplace.e2e.ts','apps/web/playwright.marketplace.config.ts',
            'apps/web/e2e/editorExtensions.e2e.ts','apps/web/e2e/editorExtensionDebug.e2e.ts','apps/web/e2e/editorExtensionVsix.e2e.ts','docs/editor/marketplace.md',
          ]);
          const files = execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree = [];
          for (const file of files) {
            if (!allowed.has(file)) throw new Error(`Unexpected edit: ${file}`);
            const blob = await api('git/blobs',{content: await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          for (const file of ['scripts/assemble-extension-marketplace.mjs','scripts/finish-extension-marketplace.mjs']) tree.push({path:file,mode:'100644',type:'blob',sha:null});
          const base = await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result = await api('git/trees',{base_tree:base.tree.sha,tree});
          const identity = {name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit = await api('git/commits',{message:'feat(marketplace): integrate native Open VSX catalog and package details',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha); console.log('CANDIDATE_TREE',result.sha); console.log('NORMALIZED_FILES',JSON.stringify(tree));
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Required format and lint
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -80 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Integrated typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/types.log"; exit 1; }
      - name: Catalog and existing package boundaries
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/server test src/extensions/registryCatalog.test.ts src/extensions/openVsx.test.ts src/extensions/vsix.test.ts src/extensions/manifest.test.ts
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Native marketplace, theme and authorization regressions
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/settings/ExtensionMarketplace.browser.tsx
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: marketplace-component-evidence
          path: apps/web/src/components/settings/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
  screenshots:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        state: [before, after]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.state == 'before' && env.BASELINE || needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/checkout@v6
        if: matrix.state == 'before'
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          path: marketplace-scenario
          persist-credentials: false
          sparse-checkout: |
            apps/web/e2e/editorMarketplace.e2e.ts
            apps/web/playwright.marketplace.config.ts
          sparse-checkout-cone-mode: false
      - name: Use the same capture harness on the original settings
        if: matrix.state == 'before'
        run: |
          cp marketplace-scenario/apps/web/e2e/editorMarketplace.e2e.ts apps/web/e2e/
          cp marketplace-scenario/apps/web/playwright.marketplace.config.ts apps/web/
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Real Synara and Open VSX marketplace journey
        env:
          SYNARA_MARKETPLACE_BASELINE: ${{ matrix.state == 'before' && '1' || '0' }}
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.marketplace.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: marketplace-${{ matrix.state }}
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
