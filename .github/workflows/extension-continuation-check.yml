# Temporary execution bridge. Final publication uses the GitHub connector and omits this file.
name: Extension continuation verification
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/extension-continuation-check.yml]
permissions:
  contents: read
concurrency:
  group: extension-continuation-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: e24322a130cca4e2b539832a6c9d5a92626d3e1f
  IMPLEMENTATION_BASE: 4268fc833b4ed00cec74ec328e0170144af337cf
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply final integration points
        run: node scripts/finish-extension-acceptance.mjs
      - name: Format the changed files only
        run: |
          ./node_modules/.bin/oxfmt apps/server/src/extensions/host/entry.mjs \
            apps/server/src/extensions/realLanguageFeatures.test.ts \
            apps/web/e2e/editorAcceptanceFixture.ts apps/web/e2e/editorExtensionVsix.e2e.ts \
            apps/web/playwright.extensions.config.ts docs/editor/extensions.md
      - name: Store normalized code objects without publishing a ref
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body) {
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000),
            });
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const concurrent=await api(`compare/${process.env.IMPLEMENTATION_BASE}...${process.env.PARENT_SHA}`);
          if(concurrent.files.some(file=>file.filename!=='.github/workflows/extension-continuation-check.yml'))throw new Error('Branch changed outside the execution bridge; reconcile before publishing.');
          const allowed=new Set(['apps/server/src/extensions/host/entry.mjs','apps/server/src/extensions/realLanguageFeatures.test.ts','apps/web/e2e/editorAcceptanceFixture.ts','apps/web/e2e/editorExtensionVsix.e2e.ts','apps/web/playwright.extensions.config.ts','docs/editor/extensions.md']);
          const files=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree=[];
          for(const file of files){
            if(!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'scripts/finish-extension-acceptance.mjs',mode:'100644',type:'blob',sha:null});
          console.log('NORMALIZED_FILES',JSON.stringify(tree));
          const base=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:base.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'fix(extensions): complete native VSIX lifecycle and reliable application acceptance',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Required formatting and lint
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -70 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Changed package typechecks
        if: ${{ !cancelled() }}
        run: |
          bun run --cwd apps/server typecheck > "$RUNNER_TEMP/server-types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/server-types.log"; exit 1; }
          bun run --cwd apps/web typecheck > "$RUNNER_TEMP/web-types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/web-types.log"; exit 1; }
  native:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build Synara server
        run: bun run --cwd apps/server build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -70 "$RUNNER_TEMP/build.log"; exit 1; }
      - uses: ./.github/actions/build-code-oss
      - name: Install sandbox and debugger
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap gdb
      - name: Verify rejected watchers do not crash the actual Code-OSS host
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ github.workspace }}/apps/server/dist/code-oss/extension-host.mjs
          SYNARA_TEST_EXTENSION_SANDBOX: "1"
        run: bun run --cwd apps/server test src/extensions/realLanguageFeatures.test.ts
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Actual Settings, local VSIX, formatting and debugger journeys
        if: ${{ !cancelled() }}
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ github.workspace }}/apps/server/dist/code-oss/extension-host.mjs
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.extensions.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: native-extension-application-evidence
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
