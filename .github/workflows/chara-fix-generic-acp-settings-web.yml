name: Chara fix generic ACP settings integration

on:
  push:
    branches:
      - codex/generic-acp-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Port ACP settings and discovery integration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"{label} insertion point changed")
              return text.replace(old, new, 1)

          # Shared settings contract.
          path = Path("packages/contracts/src/settings.ts")
          text = path.read_text()
          text = replace_once(
              text,
              '''export const DevinServerProviderSettings = Schema.Struct({\n  ...ProviderSettingsBase,\n  binaryPath: StringSetting.pipe(Schema.withDecodingDefault(() => "devin")),\n});\nexport type DevinServerProviderSettings = typeof DevinServerProviderSettings.Type;\n''',
              '''export const DevinServerProviderSettings = Schema.Struct({\n  ...ProviderSettingsBase,\n  binaryPath: StringSetting.pipe(Schema.withDecodingDefault(() => "devin")),\n});\nexport type DevinServerProviderSettings = typeof DevinServerProviderSettings.Type;\n\nexport const AcpServerProviderSettings = Schema.Struct({\n  ...ProviderSettingsBase,\n  binaryPath: StringSetting.pipe(Schema.withDecodingDefault(() => "cline")),\n  args: Schema.Array(StringSetting).pipe(Schema.withDecodingDefault(() => ["--acp"])),\n});\nexport type AcpServerProviderSettings = typeof AcpServerProviderSettings.Type;\n''',
              "ACP server settings",
          )
          text = replace_once(
              text,
              '    pi: PiServerProviderSettings.pipe(Schema.withDecodingDefault(() => ({}))),\n',
              '    pi: PiServerProviderSettings.pipe(Schema.withDecodingDefault(() => ({}))),\n    acp: AcpServerProviderSettings.pipe(Schema.withDecodingDefault(() => ({}))),\n',
              "ACP provider settings",
          )
          text = replace_once(
              text,
              '      devin: Schema.optionalKey(Schema.Struct(ProviderSettingsBasePatch)),\n',
              '''      devin: Schema.optionalKey(Schema.Struct(ProviderSettingsBasePatch)),\n      acp: Schema.optionalKey(\n        Schema.Struct({\n          ...ProviderSettingsBasePatch,\n          args: Schema.optionalKey(Schema.Array(StringSetting)),\n        }),\n      ),\n''',
              "ACP settings patch",
          )
          path.write_text(text)

          # Provider discovery contract accepts generic ACP launch args.
          path = Path("packages/contracts/src/providerDiscovery.ts")
          text = path.read_text()
          text = replace_once(
              text,
              '  "devin",\n]);',
              '  "devin",\n  "acp",\n]);',
              "ACP discovery kind",
          )
          text = replace_once(
              text,
              '  binaryPath: Schema.optional(TrimmedNonEmptyString),\n  apiEndpoint: Schema.optional(TrimmedNonEmptyString),',
              '  binaryPath: Schema.optional(TrimmedNonEmptyString),\n  args: Schema.optional(Schema.Array(TrimmedNonEmptyString)),\n  apiEndpoint: Schema.optional(TrimmedNonEmptyString),',
              "ACP discovery args",
          )
          path.write_text(text)

          # Web app settings projection.
          path = Path("apps/web/src/appSettings.ts")
          text = path.read_text()
          text = replace_once(
              text,
              '  | "customOpenCodeModels"\n  | "customPiModels";',
              '  | "customOpenCodeModels"\n  | "customPiModels"\n  | "customAcpModels";',
              "ACP custom model key",
          )
          text = replace_once(
              text,
              '  pi: new Set(getModelOptions("pi").map((option) => option.slug)),\n};',
              '  pi: new Set(getModelOptions("pi").map((option) => option.slug)),\n  acp: new Set(getModelOptions("acp").map((option) => option.slug)),\n};',
              "ACP built-in model set",
          )
          text = replace_once(
              text,
              '  "opencode",\n  "pi",\n]).pipe(',
              '  "opencode",\n  "pi",\n  "acp",\n]).pipe(',
              "ACP persisted provider kind",
          )
          text = replace_once(
              text,
              '  piAgentDir: Schema.String.check(Schema.isMaxLength(4096)).pipe(withDefaults(() => "")),\n  openCodeServerUrl:',
              '''  piAgentDir: Schema.String.check(Schema.isMaxLength(4096)).pipe(withDefaults(() => "")),\n  acpBinaryPath: Schema.String.check(Schema.isMaxLength(4096)).pipe(withDefaults(() => "")),\n  acpArgs: Schema.String.check(Schema.isMaxLength(4096)).pipe(withDefaults(() => "--acp")),\n  openCodeServerUrl:''',
              "ACP app launcher settings",
          )
          text = replace_once(
              text,
              '  customOpenCodeModels: Schema.Array(Schema.String).pipe(withDefaults(() => [])),\n  customPiModels: Schema.Array(Schema.String).pipe(withDefaults(() => [])),',
              '  customOpenCodeModels: Schema.Array(Schema.String).pipe(withDefaults(() => [])),\n  customPiModels: Schema.Array(Schema.String).pipe(withDefaults(() => [])),\n  customAcpModels: Schema.Array(Schema.String).pipe(withDefaults(() => [])),',
              "ACP custom models schema",
          )
          text = replace_once(
              text,
              '''  pi: {\n    provider: "pi",\n    settingsKey: "customPiModels",\n    defaultSettingsKey: "customPiModels",\n    title: "Pi",\n    description: "Save additional Pi model slugs for the picker and provider runtime.",\n    placeholder: "provider/model",\n    example: "anthropic/claude-sonnet-4-5",\n  },\n};''',
              '''  pi: {\n    provider: "pi",\n    settingsKey: "customPiModels",\n    defaultSettingsKey: "customPiModels",\n    title: "Pi",\n    description: "Save additional Pi model slugs for the picker and provider runtime.",\n    placeholder: "provider/model",\n    example: "anthropic/claude-sonnet-4-5",\n  },\n  acp: {\n    provider: "acp",\n    settingsKey: "customAcpModels",\n    defaultSettingsKey: "customAcpModels",\n    title: "ACP Agent",\n    description: "Save additional ACP model ids advertised by the configured agent.",\n    placeholder: "agent-model-id",\n    example: "default",\n  },\n};''',
              "ACP model editor config",
          )
          text = replace_once(
              text,
              '// Build the CSS font-family stack written to `--terminal-font-family`, or null',
              '''/** Parse the newline-delimited ACP launcher arguments used by the settings UI. */\nexport function parseAcpArgs(value: string | null | undefined): string[] {\n  return (value ?? "")\n    .split(/\\r?\\n/u)\n    .map((entry) => entry.trim())\n    .filter((entry) => entry.length > 0);\n}\n\n/** Serialize ACP arguments for the settings UI without losing argv boundaries. */\nexport function formatAcpArgs(args: ReadonlyArray<string> | null | undefined): string {\n  return (args ?? [])\n    .map((entry) => entry.trim())\n    .filter(Boolean)\n    .join("\\n");\n}\n\n// Build the CSS font-family stack written to `--terminal-font-family`, or null''',
              "ACP argv helpers",
          )
          text = replace_once(
              text,
              '    piBinaryPath: normalizeProviderBinaryPathOverride("pi", settings.piBinaryPath),\n    uiDensity:',
              '    piBinaryPath: normalizeProviderBinaryPathOverride("pi", settings.piBinaryPath),\n    acpBinaryPath: normalizeProviderBinaryPathOverride("acp", settings.acpBinaryPath),\n    acpArgs: formatAcpArgs(parseAcpArgs(settings.acpArgs)),\n    uiDensity:',
              "ACP normalization",
          )
          text = replace_once(
              text,
              '    customOpenCodeModels: normalizeCustomModelSlugs(settings.customOpenCodeModels, "opencode"),\n    customPiModels: normalizeCustomModelSlugs(settings.customPiModels, "pi"),',
              '    customOpenCodeModels: normalizeCustomModelSlugs(settings.customOpenCodeModels, "opencode"),\n    customPiModels: normalizeCustomModelSlugs(settings.customPiModels, "pi"),\n    customAcpModels: normalizeCustomModelSlugs(settings.customAcpModels, "acp"),',
              "ACP custom model normalization",
          )
          text = replace_once(
              text,
              '    piAgentDir: settings.providers.pi.agentDir,\n    piBinaryPath: settings.providers.pi.binaryPath,',
              '    piAgentDir: settings.providers.pi.agentDir,\n    piBinaryPath: settings.providers.pi.binaryPath,\n    acpBinaryPath: settings.providers.acp.binaryPath,\n    acpArgs: formatAcpArgs(settings.providers.acp.args),',
              "ACP server-to-app settings",
          )
          text = replace_once(
              text,
              '    customOpenCodeModels: settings.providers.opencode.customModels,\n    customPiModels: settings.providers.pi.customModels,',
              '    customOpenCodeModels: settings.providers.opencode.customModels,\n    customPiModels: settings.providers.pi.customModels,\n    customAcpModels: settings.providers.acp.customModels,',
              "ACP server custom models",
          )
          text = replace_once(
              text,
              '    hasOwn(patch, "piAgentDir") ||\n    hasOwn(patch, "disabledProviders")',
              '    hasOwn(patch, "piAgentDir") ||\n    hasOwn(patch, "acpBinaryPath") ||\n    hasOwn(patch, "acpArgs") ||\n    hasOwn(patch, "disabledProviders")',
              "ACP discovery invalidation",
          )
          text = replace_once(
              text,
              '''  if (hasOwn(patch, "disabledProviders")) {''',
              '''  if (\n    hasOwn(patch, "acpBinaryPath") ||\n    hasOwn(patch, "acpArgs") ||\n    hasOwn(patch, "customAcpModels")\n  ) {\n    providers.acp = {\n      ...(hasOwn(patch, "acpBinaryPath") ? { binaryPath: patch.acpBinaryPath ?? "" } : {}),\n      ...(hasOwn(patch, "acpArgs") ? { args: parseAcpArgs(patch.acpArgs) } : {}),\n      ...(hasOwn(patch, "customAcpModels") ? { customModels: patch.customAcpModels ?? [] } : {}),\n    };\n  }\n  if (hasOwn(patch, "disabledProviders")) {''',
              "ACP server patch projection",
          )
          text = replace_once(
              text,
              '    "piBinaryPath",\n    "textGenerationModel",',
              '    "piBinaryPath",\n    "acpBinaryPath",\n    "acpArgs",\n    "textGenerationModel",',
              "ACP migration scalar keys",
          )
          text = replace_once(
              text,
              '    "customOpenCodeModels",\n    "customPiModels",\n  ] as const)',
              '    "customOpenCodeModels",\n    "customPiModels",\n    "customAcpModels",\n  ] as const)',
              "ACP migration model keys",
          )
          text = replace_once(
              text,
              '    pi: getCustomModelsForProvider(settings, "pi"),\n  };',
              '    pi: getCustomModelsForProvider(settings, "pi"),\n    acp: getCustomModelsForProvider(settings, "acp"),\n  };',
              "ACP custom model map",
          )
          text = replace_once(
              text,
              '    pi: getAppModelOptions("pi", customModelsByProvider.pi),\n  };',
              '    pi: getAppModelOptions("pi", customModelsByProvider.pi),\n    acp: getAppModelOptions("acp", customModelsByProvider.acp),\n  };',
              "ACP option map",
          )
          text = replace_once(
              text,
              '    | "piAgentDir"\n    | "piBinaryPath"\n  >,',
              '    | "piAgentDir"\n    | "piBinaryPath"\n    | "acpBinaryPath"\n    | "acpArgs"\n  >,',
              "ACP start option settings type",
          )
          text = replace_once(
              text,
              '  const piBinaryPath = normalizeProviderBinaryPathOverride("pi", settings.piBinaryPath);\n  const hasOpenCodeStartOptions',
              '''  const piBinaryPath = normalizeProviderBinaryPathOverride("pi", settings.piBinaryPath);\n  const acpBinaryPath = normalizeProviderBinaryPathOverride("acp", settings.acpBinaryPath);\n  const defaultAcpArgs = DEFAULT_SERVER_SETTINGS.providers.acp.args;\n  const acpArgs = parseAcpArgs(settings.acpArgs);\n  const hasAcpStartOptions =\n    Boolean(acpBinaryPath) ||\n    acpArgs.length !== defaultAcpArgs.length ||\n    acpArgs.some((arg, index) => arg !== defaultAcpArgs[index]);\n  const hasOpenCodeStartOptions''',
              "ACP start option normalization",
          )
          text = replace_once(
              text,
              '''    ...(piBinaryPath || settings.piAgentDir\n      ? {\n          pi: {\n            ...(piBinaryPath ? { binaryPath: piBinaryPath } : {}),\n            ...(settings.piAgentDir ? { agentDir: settings.piAgentDir } : {}),\n          },\n        }\n      : {}),\n  };''',
              '''    ...(piBinaryPath || settings.piAgentDir\n      ? {\n          pi: {\n            ...(piBinaryPath ? { binaryPath: piBinaryPath } : {}),\n            ...(settings.piAgentDir ? { agentDir: settings.piAgentDir } : {}),\n          },\n        }\n      : {}),\n    ...(hasAcpStartOptions\n      ? {\n          acp: {\n            ...(acpBinaryPath ? { binaryPath: acpBinaryPath } : {}),\n            args: acpArgs,\n          },\n        }\n      : {}),\n  };''',
              "ACP start options",
          )
          text = replace_once(
              text,
              '    | "openCodeBinaryPath"\n    | "piBinaryPath"\n  >,',
              '    | "openCodeBinaryPath"\n    | "piBinaryPath"\n    | "acpBinaryPath"\n  >,',
              "ACP binary path settings type",
          )
          text = replace_once(
              text,
              '    case "pi":\n      return normalizeProviderBinaryPathOverride(provider, settings.piBinaryPath);\n  }',
              '    case "pi":\n      return normalizeProviderBinaryPathOverride(provider, settings.piBinaryPath);\n    case "acp":\n      return normalizeProviderBinaryPathOverride(provider, settings.acpBinaryPath);\n  }',
              "ACP binary path switch",
          )
          path.write_text(text)
          PY

          git rm .github/workflows/chara-fix-generic-acp-settings-web.yml
          git diff --check
          git config user.name "cmdr-chara"
          git config user.email "249489759+cmdr-chara@users.noreply.github.com"
          git add packages/contracts/src/settings.ts packages/contracts/src/providerDiscovery.ts apps/web/src/appSettings.ts
          git commit -m "fix: port generic ACP settings integration"
          git push origin HEAD:codex/generic-acp-provider
