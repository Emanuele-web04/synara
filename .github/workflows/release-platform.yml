name: Release desktop platform

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      target:
        required: true
        type: string
      version:
        required: true
        type: string
      desktop_flavor:
        required: true
        type: string
      publish_release:
        required: true
        type: boolean
      source_commit:
        required: true
        type: string
      source_tag:
        required: true
        type: string
      lockfile_sha256:
        required: true
        type: string
      allow_unsigned_windows_publication:
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  # Keep the portable build fingerprint identical to its producer.
  AZURE_TRUSTED_SIGNING_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}

jobs:
  build:
    name: Package and qualify
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # A successful first attempt never transfers an intermediate checkpoint.
      - name: Find failed attempt checkpoint in this run
        id: checkpoint_lookup
        if: github.run_attempt > 1
        uses: actions/github-script@v8
        env:
          CHECKPOINT_NAME: candidate-desktop-${{ inputs.platform }}-${{ inputs.arch }}
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.runId,
              name: process.env.CHECKPOINT_NAME,
              per_page: 100,
            });
            const checkpoints = artifacts.filter((artifact) =>
              artifact.name === process.env.CHECKPOINT_NAME && !artifact.expired
            );
            if (checkpoints.length > 1) {
              throw new Error('More than one checkpoint matches this platform in this run.');
            }
            core.setOutput('artifact_id', checkpoints[0]?.id ?? '');

      - name: Restore failed attempt checkpoint from this run
        if: steps.checkpoint_lookup.outputs.artifact_id != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.checkpoint_lookup.outputs.artifact_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          path: release-publish

      - name: Verify restored checkpoint identity and bytes
        id: restore_checkpoint
        if: steps.checkpoint_lookup.outputs.artifact_id != ''
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCKFILE_SHA256: ${{ inputs.lockfile_sha256 }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ALLOW_UNSIGNED_WINDOWS_PUBLICATION: ${{ inputs.allow_unsigned_windows_publication }}
          EXPECTED_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_WINDOWS_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          EXPECTED_WINDOWS_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}
        run: |
          node scripts/verify-release-artifact-checkpoint.ts \
            --assets-dir release-publish \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --target "${{ inputs.target }}" \
            --version "${{ inputs.version }}" \
            --flavor "${{ inputs.desktop_flavor }}" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --publication "$PUBLISH_RELEASE" \
            --allow-unsigned-windows-publication "$ALLOW_UNSIGNED_WINDOWS_PUBLICATION" \
            --expected-mac-team-id "$EXPECTED_MAC_TEAM_ID" \
            --expected-windows-publisher "$EXPECTED_WINDOWS_PUBLISHER" \
            --expected-windows-subject-dn "$EXPECTED_WINDOWS_SUBJECT_DN"

      - name: Setup Bun
        if: steps.restore_checkpoint.outcome != 'success'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        if: steps.restore_checkpoint.outcome != 'success'
        # Preflight validates the entire workspace. Native artifacts retain all
        # runtime/build dependencies but do not install the unrelated marketing site.
        run: bun install --frozen-lockfile --ignore-scripts --filter '!@synara/marketing'

      - name: Download macOS icon catalog
        if: inputs.platform == 'mac' && steps.restore_checkpoint.outcome != 'success'
        uses: actions/download-artifact@v8
        with:
          name: mac-icon-catalog
          path: ${{ runner.temp }}/mac-icon

      - name: Select macOS native toolchain
        if: inputs.platform == 'mac' && steps.restore_checkpoint.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          # The pinned apple-metal bridge requires the macOS 15 SDK.
          # Icon Composer runs separately on macOS 26 to avoid AssetRuntime
          # framework crashes on the older native-build host.
          native_developer_dir=/Applications/Xcode_16.4.app/Contents/Developer
          test -d "$native_developer_dir"
          test -s "$RUNNER_TEMP/mac-icon/Assets.car"
          echo "DEVELOPER_DIR=$native_developer_dir" >> "$GITHUB_ENV"
          echo "SYNARA_MAC_ICON_CATALOG=$RUNNER_TEMP/mac-icon/Assets.car" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$native_developer_dir" xcodebuild -version

      - name: Report runner capacity
        if: steps.restore_checkpoint.outcome != 'success'
        run: node scripts/report-build-runner.ts

      - name: Import this candidate's verified Cua
        if: (inputs.platform == 'mac' || inputs.platform == 'linux') && steps.restore_checkpoint.outcome != 'success'
        uses: ./.github/actions/provision-cua
        with:
          arch: ${{ inputs.arch }}
          prepared-artifact: prepared-cua-${{ inputs.platform }}-${{ inputs.arch }}

      - name: Restore portable outputs
        if: steps.restore_checkpoint.outcome != 'success'
        uses: ./.github/actions/restore-portable-build
        with:
          source-commit: ${{ inputs.source_commit }}

      - id: build_artifact
        name: Build desktop artifact
        if: steps.restore_checkpoint.outcome != 'success'
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          AZURE_TRUSTED_SIGNING_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}
          SYNARA_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ALLOW_UNSIGNED_WINDOWS_PUBLICATION: ${{ inputs.allow_unsigned_windows_publication }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCKFILE_SHA256: ${{ inputs.lockfile_sha256 }}
        run: |
          set -euo pipefail
          key_path=""
          trap 'if [[ -n "$key_path" ]]; then rm -f -- "$key_path"; fi' EXIT
          signed=false
          args=(
            --platform "${{ inputs.platform }}"
            --target "${{ inputs.target }}"
            --arch "${{ inputs.arch }}"
            --flavor "${{ inputs.desktop_flavor }}"
            --build-version "${{ inputs.version }}"
            --source-commit "$SOURCE_COMMIT"
            --lockfile-sha256 "$LOCKFILE_SHA256"
            # Non-production flavors default to release-<flavor>/, but the
            # collect step below only globs release/. Each matrix leg has its
            # own runner, so a fixed dir is safe.
            --output-dir release
            --skip-build
            --keep-stage
            --verbose
          )

          if [[ -n "$SOURCE_TAG" ]]; then
            args+=(--source-tag "$SOURCE_TAG")
          fi

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ inputs.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              (umask 077; printf '%s' "$APPLE_API_KEY" > "$key_path")
              export APPLE_API_KEY="$key_path"
              echo "macOS signing enabled."
              signed=true
              args+=(--signed)
            elif [[ "$SYNARA_PUBLISH_RELEASE" == "true" ]]; then
              echo "Publishing macOS artifacts requires every signing and notarization secret."
              exit 1
            else
              echo "Build-only macOS artifact will be unsigned because publication is disabled."
            fi
          elif [[ "${{ inputs.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME" \
              "$AZURE_TRUSTED_SIGNING_SUBJECT_DN"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              signed=true
              args+=(--signed)
            elif [[ "$SYNARA_PUBLISH_RELEASE" == "true" && "$ALLOW_UNSIGNED_WINDOWS_PUBLICATION" != "true" ]]; then
              echo "Publishing Windows artifacts requires every Azure Trusted Signing secret."
              exit 1
            else
              echo "Windows artifact will be unsigned under the explicit version-scoped release exception."
            fi
          else
            echo "Signing disabled for ${{ inputs.platform }}."
          fi

          # Never retry source, signing or notarization failures as downloads.
          bun run dist:desktop:artifact -- "${args[@]}"

          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        if: steps.restore_checkpoint.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/latest*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done

          if [[ "${{ inputs.platform }}" == "mac" && "${{ inputs.arch }}" != "arm64" ]]; then
            if [[ -f release-publish/latest-mac.yml ]]; then
              mv release-publish/latest-mac.yml "release-publish/latest-mac-${{ inputs.arch }}.yml"
            fi
          fi

      - name: Verify and record artifact provenance
        id: provenance
        if: steps.restore_checkpoint.outcome != 'success'
        shell: bash
        env:
          EXPECTED_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_WINDOWS_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          EXPECTED_WINDOWS_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCKFILE_SHA256: ${{ inputs.lockfile_sha256 }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          SIGNED_ARTIFACT: ${{ steps.build_artifact.outputs.signed }}
          ALLOW_UNSIGNED_WINDOWS_PUBLICATION: ${{ inputs.allow_unsigned_windows_publication }}
        run: |
          node scripts/write-release-artifact-provenance.ts \
            --assets-dir release-publish \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --target "${{ inputs.target }}" \
            --version "${{ inputs.version }}" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --publication "$PUBLISH_RELEASE" \
            --signed "$SIGNED_ARTIFACT" \
            --allow-unsigned-windows-publication "$ALLOW_UNSIGNED_WINDOWS_PUBLICATION" \
            --expected-mac-team-id "$EXPECTED_MAC_TEAM_ID" \
            --expected-windows-publisher "$EXPECTED_WINDOWS_PUBLISHER" \
            --expected-windows-subject-dn "$EXPECTED_WINDOWS_SUBJECT_DN"

      - name: Verify Windows installer with Microsoft Defender
        id: windows_defender
        if: inputs.platform == 'win'
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/verify-windows-defender.ps1 -AssetsDirectory release-publish -EvidenceDirectory "${{ runner.temp }}/windows-defender-evidence"

      - name: Preserve Windows Defender evidence
        if: ${{ always() && inputs.platform == 'win' && steps.windows_defender.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-defender-${{ inputs.arch }}
          path: ${{ runner.temp }}/windows-defender-evidence/
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # The Intel app is cross-built here and launched by qualify_intel below.
      - name: Smoke packaged desktop startup
        if: inputs.platform != 'mac' || inputs.arch != 'x64'
        shell: bash
        run: |
          node scripts/verify-packaged-desktop-startup.ts \
            --assets-dir release-publish \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --version "${{ inputs.version }}" \
            --executable-name "${{ inputs.desktop_flavor == 'beta' && 'synara-beta' || 'synara' }}"

      - name: Upload qualified artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          # Installers and updater ZIPs are already compressed.
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      # Failed scans may quarantine or alter installers. Save only complete,
      # unchanged bytes whose native signing provenance already succeeded.
      - name: Verify failed attempt checkpoint before preserving it
        id: checkpoint_backup_verify
        if: ${{ failure() && !cancelled() && steps.provenance.outcome == 'success' && steps.restore_checkpoint.outcome != 'success' }}
        shell: bash
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          SOURCE_TAG: ${{ inputs.source_tag }}
          LOCKFILE_SHA256: ${{ inputs.lockfile_sha256 }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          ALLOW_UNSIGNED_WINDOWS_PUBLICATION: ${{ inputs.allow_unsigned_windows_publication }}
          EXPECTED_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPECTED_WINDOWS_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          EXPECTED_WINDOWS_SUBJECT_DN: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBJECT_DN }}
        run: |
          node scripts/verify-release-artifact-checkpoint.ts \
            --assets-dir release-publish \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --target "${{ inputs.target }}" \
            --version "${{ inputs.version }}" \
            --flavor "${{ inputs.desktop_flavor }}" \
            --source-commit "$SOURCE_COMMIT" \
            --source-tag "$SOURCE_TAG" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --publication "$PUBLISH_RELEASE" \
            --allow-unsigned-windows-publication "$ALLOW_UNSIGNED_WINDOWS_PUBLICATION" \
            --expected-mac-team-id "$EXPECTED_MAC_TEAM_ID" \
            --expected-windows-publisher "$EXPECTED_WINDOWS_PUBLISHER" \
            --expected-windows-subject-dn "$EXPECTED_WINDOWS_SUBJECT_DN"

      - name: Preserve failed attempt checkpoint
        if: ${{ failure() && !cancelled() && steps.checkpoint_backup_verify.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: candidate-desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish/*
          compression-level: 0
          retention-days: 30
          overwrite: true
          if-no-files-found: error

  # Rosetta 2 ran the cross-built Intel app too slowly to qualify it (startup
  # took 135s, then over 180s). Launch it on real Intel hardware instead. The
  # caller's publishers await this job through the reusable workflow's result.
  qualify_intel:
    name: Qualify on Intel
    needs: build
    if: inputs.platform == 'mac' && inputs.arch == 'x64'
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_commit }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      - name: Download the packaged Intel app
        uses: actions/download-artifact@v8
        with:
          name: desktop-${{ inputs.platform }}-${{ inputs.arch }}
          path: release-publish

      - name: Smoke packaged desktop startup on Intel
        shell: bash
        run: |
          node scripts/verify-packaged-desktop-startup.ts \
            --assets-dir release-publish \
            --platform "${{ inputs.platform }}" \
            --arch "${{ inputs.arch }}" \
            --version "${{ inputs.version }}" \
            --executable-name "${{ inputs.desktop_flavor == 'beta' && 'synara-beta' || 'synara' }}"
