name: Verify CI candidate
on:
  push:
    branches: [codex/ci-cross-platform-measurements]
    paths: [.github/workflows/ci-verify-candidate.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Format and export exact formatter output for committing
        run: |
          bun run fmt
          python3 - <<'PY'
          import json, pathlib, subprocess, os
          files=subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0')
          result={f:pathlib.Path(f).read_text() for f in files if f}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'verification';out.mkdir()
          (out/'formatted-files.json').write_text(json.dumps(result))
          (out/'formatter.patch').write_bytes(subprocess.check_output(['git','diff']))
          PY
      - run: bun run fmt:check
      - run: bun run lint
      - run: bun run typecheck
      - run: node --test .github/scripts/ci-contracts.test.mjs .github/scripts/ci-shards.test.mjs
      - run: bun run windows-runtime:check
      - run: bun run migrations:check
      - run: bun run test
      - name: Capture baseline job durations
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/verification"
          gh api repos/Emanuele-web04/synara/actions/runs/34792874548/jobs?per_page=100 > "$RUNNER_TEMP/verification/baseline-jobs.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-verification
          path: ${{ runner.temp }}/verification
          retention-days: 14
          if-no-files-found: error
