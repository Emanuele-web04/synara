name: Chara fix generic ACP model tables

on:
  push:
    branches:
      - codex/generic-acp-provider

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Port ACP model tables
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packages/contracts/src/model.ts")
          text = path.read_text()

          marker = '  // Pi discovery owns the live catalog, including auth-gated Anthropic models.\n  pi: [],\n'
          replacement = '''  // Pi discovery owns the live catalog, including auth-gated Anthropic models.\n  pi: [],\n  // Generic ACP agents advertise their live catalog during session setup.\n  acp: [\n    {\n      slug: "default",\n      name: "Agent default",\n      capabilities: {\n        reasoningEffortLevels: [],\n        supportsFastMode: false,\n        supportsThinkingToggle: false,\n        promptInjectedEffortLevels: [],\n        contextWindowOptions: [],\n      },\n    },\n  ],\n'''
          if marker not in text:
              raise SystemExit("model catalog insertion point changed")
          text = text.replace(marker, replacement, 1)

          marker = '  opencode: "openai/gpt-5",\n};'
          if marker not in text:
              raise SystemExit("default model insertion point changed")
          text = text.replace(marker, '  opencode: "openai/gpt-5",\n  acp: "default",\n};', 1)

          marker = '  opencode: {},\n  pi: {},\n  devin: {'
          if marker not in text:
              raise SystemExit("alias insertion point changed")
          text = text.replace(marker, '  opencode: {},\n  pi: {},\n  acp: {},\n  devin: {', 1)

          marker = '  opencode: "OpenCode",\n  pi: "Pi",\n};'
          if marker not in text:
              raise SystemExit("display-name insertion point changed")
          text = text.replace(marker, '  opencode: "OpenCode",\n  pi: "Pi",\n  acp: "ACP Agent",\n};', 1)

          path.write_text(text)
          PY

          git rm .github/workflows/chara-fix-generic-acp-models.yml
          git diff --check
          git config user.name "cmdr-chara"
          git config user.email "249489759+cmdr-chara@users.noreply.github.com"
          git add packages/contracts/src/model.ts
          git commit -m "fix: port generic ACP model tables"
          git push origin HEAD:codex/generic-acp-provider
