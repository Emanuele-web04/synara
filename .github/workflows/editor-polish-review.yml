# Temporary evidence runner; application and extension checks continue in run 38893543561.
name: Editor polish review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-polish-review.yml]
permissions:
  contents: read
concurrency:
  group: editor-polish-presentation-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE: cb959106ead496dc85b5d24fe363416798c63612
  BASELINE: bdd2f92f4b1dbcd70aec1d5b0771b7a570cea545
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        state: [before, after]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.state == 'before' && env.BASELINE || env.CANDIDATE }}
          persist-credentials: false
      - uses: actions/checkout@v6
        if: matrix.state == 'before'
        with:
          ref: ${{ env.CANDIDATE }}
          path: capture-harness
          persist-credentials: false
      - name: Use the identical scenario and repaired startup fixture on the baseline
        if: matrix.state == 'before'
        run: |
          cp capture-harness/apps/web/e2e/editorAcceptanceFixture.ts capture-harness/apps/web/e2e/editorPresentation.e2e.ts apps/web/e2e/
          cp capture-harness/apps/web/playwright.presentation.config.ts apps/web/
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Actual preview, editor, scrollbars, themes and undo
        env:
          SYNARA_EDITOR_POLISH_BASELINE: ${{ matrix.state == 'before' && '1' || '0' }}
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.presentation.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-presentation-${{ matrix.state }}
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
