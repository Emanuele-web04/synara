# Temporary review runner; normalized application candidates omit assembly tooling.
name: Editor polish review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-polish-review.yml]
permissions:
  contents: read
concurrency:
  group: editor-polish-review-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: b86501eff3b38d40775b6e908ba34b46f8ffbda4
  BASELINE: bdd2f92f4b1dbcd70aec1d5b0771b7a570cea545
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply bounded integration changes
        run: node scripts/assemble-editor-polish.mjs
      - name: Format the explicit change set
        run: |
          ./node_modules/.bin/oxfmt apps/web/src/components/codeEditor/editorViewHandoff* \
            apps/web/src/components/codeEditor/CodeEditorPane.tsx \
            apps/web/src/components/codeEditor/MonacoEditorSurface.tsx \
            apps/web/src/components/codeEditor/editorRuntime.ts apps/web/src/components/codeEditor/editorSurface.css \
            apps/web/src/components/WorkspaceFilePreview.tsx apps/web/src/components/chat/WorkspaceFilePreviewHeader.tsx \
            apps/web/e2e/editorAcceptanceFixture.ts apps/web/e2e/editorExtensionVsix.e2e.ts \
            apps/web/e2e/editorPresentation.e2e.ts apps/web/playwright.presentation.config.ts docs/editor/presentation.md
      - name: Store normalized candidate without updating any ref
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body){
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const allowed=new Set(['apps/web/src/components/codeEditor/editorViewHandoff.ts','apps/web/src/components/codeEditor/editorViewHandoff.test.ts','apps/web/src/components/codeEditor/editorViewHandoff.browser.tsx','apps/web/src/components/codeEditor/CodeEditorPane.tsx','apps/web/src/components/codeEditor/MonacoEditorSurface.tsx','apps/web/src/components/codeEditor/editorRuntime.ts','apps/web/src/components/codeEditor/editorSurface.css','apps/web/src/components/WorkspaceFilePreview.tsx','apps/web/src/components/chat/WorkspaceFilePreviewHeader.tsx','apps/web/e2e/editorAcceptanceFixture.ts','apps/web/e2e/editorExtensionVsix.e2e.ts','apps/web/e2e/editorPresentation.e2e.ts','apps/web/playwright.presentation.config.ts','docs/editor/presentation.md']);
          const paths=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree=[];
          for(const file of paths){
            if(!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'scripts/assemble-editor-polish.mjs',mode:'100644',type:'blob',sha:null});
          const parent=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:parent.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'feat(editor): preserve native preview continuity and adopt Synara scrollbars',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);console.log('NORMALIZED_FILES',JSON.stringify(tree));
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Format and lint
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -80 "$RUNNER_TEMP/lint.log"; exit 1; }
      - name: Integrated typecheck
        if: ${{ !cancelled() }}
        run: bun run typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { grep -E 'error TS|error:' "$RUNNER_TEMP/types.log"; exit 1; }
      - name: View-state isolation and native session regression
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test src/components/codeEditor/editorViewHandoff.test.ts src/lib/workspaceEditorSession.test.ts src/lib/workspaceFileEditor.test.ts src/uiFontSize.test.ts src/hasSelectorVariants.test.ts
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Cancellation, current editor, and preview regressions
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/codeEditor/editorViewHandoff.browser.tsx src/components/codeEditor/CodeEditorPane.browser.tsx src/components/WorkspaceFilePreview.editing.browser.tsx src/components/chat/RightDockGlassSurface.browser.tsx
  presentation:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        state: [before, after]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: actions/checkout@v6
        if: matrix.state == 'before'
        with:
          ref: ${{ env.BASELINE }}
          path: baseline
          persist-credentials: false
      - name: Reuse repaired fixture for an identical baseline journey
        if: matrix.state == 'before'
        run: |
          cp apps/web/e2e/editorAcceptanceFixture.ts apps/web/e2e/editorPresentation.e2e.ts baseline/apps/web/e2e/
          cp apps/web/playwright.presentation.config.ts baseline/apps/web/
      - uses: ./baseline/.github/actions/setup-workspace
        if: matrix.state == 'before'
      - uses: ./.github/actions/setup-workspace
        if: matrix.state == 'after'
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Actual preview, editor, scrollbars, themes and undo
        env:
          SYNARA_EDITOR_POLISH_BASELINE: ${{ matrix.state == 'before' && '1' || '0' }}
        run: |
          if [ '${{ matrix.state }}' = before ]; then cd baseline; fi
          cd apps/web && ../../../node_modules/.bin/playwright test --config playwright.presentation.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-presentation-${{ matrix.state }}
          path: |
            apps/web/test-results
            baseline/apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
  extensions:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build server
        run: bun run --cwd apps/server build
      - uses: ./.github/actions/build-code-oss
      - name: Install isolated runtime prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap gdb
      - name: Real formatter, linter, LSP, debugger and sandbox
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ github.workspace }}/apps/server/dist/code-oss/extension-host.mjs
          SYNARA_TEST_EXTENSION_SANDBOX: "1"
        run: bun run --cwd apps/server test src/extensions/realLanguageFeatures.test.ts src/extensions/realRuntime.test.ts src/extensions/realLanguageServer.test.ts src/extensions/realDebuggerExtension.test.ts src/extensions/realLinterExtension.test.ts src/platform/extensionHostSandbox.integration.test.ts
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Real marketplace to formatter, VSIX and debugger UI
        if: ${{ !cancelled() }}
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ github.workspace }}/apps/server/dist/code-oss/extension-host.mjs
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.extensions.config.ts
      - name: Existing native rail journey
        if: ${{ !cancelled() }}
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.editor-tools.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: repaired-extension-ui-evidence
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
