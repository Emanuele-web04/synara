# Temporary review runner. No application refs are moved by this workflow.
name: Editor polish review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-polish-review.yml]
permissions:
  contents: read
concurrency:
  group: editor-polish-repair-${{ github.ref }}
  cancel-in-progress: true
env:
  CANDIDATE_BASE: 9422b0ec6c0a87d3c9c52c6269ec3bb36673b734
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply the observed lifecycle and viewport fixes
        run: |
          node scripts/repair-editor-handoff.mjs
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const file='apps/web/e2e/editorToolsRail.e2e.ts';
          let text=await readFile(file,'utf8');
          const before='await expect(page.getByRole("dialog")).toContainText("Debug a Node.js program");\n  await page.getByRole("dialog").getByRole("button", { name: "Cancel", exact: true }).click();';
          if(text.split(before).length!==2)throw new Error('Rail dialog selector changed');
          text=text.replace(before,'const debugDialog = page.getByRole("dialog", { name: "Debug a Node.js program", exact: true });\n  await expect(debugDialog).toBeVisible();\n  await debugDialog.getByRole("button", { name: "Cancel", exact: true }).click();');
          await writeFile(file,text);
          NODE
          ./node_modules/.bin/oxfmt apps/web/src/components/codeEditor/CodeEditorPane.tsx apps/web/src/components/codeEditor/MonacoEditorSurface.tsx apps/web/e2e/editorToolsRail.e2e.ts
      - name: Preserve the normalized candidate for connector publication
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body){
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const allowed=new Set(['apps/web/src/components/codeEditor/CodeEditorPane.tsx','apps/web/src/components/codeEditor/MonacoEditorSurface.tsx','apps/web/e2e/editorToolsRail.e2e.ts']);
          const paths=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree=[];
          for(const file of paths){
            if(!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'scripts/repair-editor-handoff.mjs',mode:'100644',type:'blob',sha:null});
          const parent=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:parent.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'fix(editor): retain cold-load identity and restore measured view bounds',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);console.log('NORMALIZED_FILES',JSON.stringify(tree));
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Format, lint and affected web typecheck
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -70 "$RUNNER_TEMP/lint.log"; exit 1; }
          bun run --cwd apps/web typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { tail -70 "$RUNNER_TEMP/types.log"; exit 1; }
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install
      - name: Existing regression assertions and cancelled handoffs
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/codeEditor/editorViewHandoff.browser.tsx src/components/codeEditor/CodeEditorPane.browser.tsx src/components/WorkspaceFilePreview.editing.browser.tsx src/components/chat/RightDockGlassSurface.browser.tsx
  presentation:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Real light and dark source/editor continuity
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.presentation.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-presentation-after
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
  extensions:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build server
        run: bun run --cwd apps/server build
      - uses: ./.github/actions/build-code-oss
      - name: Install sandbox and debugger
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap gdb
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install
      - name: Actual Prettier, VSIX and contributed debugger journeys
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ github.workspace }}/apps/server/dist/code-oss/extension-host.mjs
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.extensions.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: repaired-extension-ui-evidence
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
      - name: Existing rail and debugger-dialog navigation
        if: ${{ !cancelled() }}
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.editor-tools.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: repaired-native-rail-evidence
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
