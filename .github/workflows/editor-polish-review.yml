# Temporary diagnostic only. No application code or refs are changed by this job.
name: Editor polish review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-polish-review.yml]
permissions:
  contents: read
jobs:
  focus-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 533c967d3c5a32cf5e125f0d1ebdfe0b4084b2a0
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Record focus changes in the isolated test page
        run: |
          node --input-type=module <<'NODE'
          import {readFile,writeFile} from 'node:fs/promises';
          const file='apps/web/e2e/editorPresentation.e2e.ts';
          let source=await readFile(file,'utf8');
          const anchor='const thread = await seedEditorProject(page, cwd);';
          if(source.split(anchor).length!==2)throw new Error('Diagnostic fixture changed');
          source=source.replace(anchor,`await page.addInitScript(() => {
            const history: unknown[] = [];
            Reflect.set(window, '__synaraFocusHistory', history);
            document.addEventListener('focusin', (event) => {
              const element = event.target as HTMLElement;
              history.push({time: performance.now(), tag: element.tagName, name: element.getAttribute('aria-label'), className: element.className});
              if(history.length > 30) history.shift();
            }, true);
          });
          ${anchor}`);
          source=source.replace('expect((await editorState())?.focused).toBe(true);',`console.log('FOCUS_EVIDENCE', JSON.stringify(await page.evaluate(() => ({
            focused: document.hasFocus(), active: document.activeElement?.outerHTML.slice(0, 1200),
            history: Reflect.get(window, '__synaraFocusHistory'),
          }))));
          expect.soft((await editorState())?.focused).toBe(true);`);
          await writeFile(file,source);
          NODE
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -30 "$RUNNER_TEMP/browser.log"; exit 1; }
      - name: Diagnose focus and retain remaining strict assertions
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.presentation.config.ts --grep light
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-focus-diagnostic
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: warn
