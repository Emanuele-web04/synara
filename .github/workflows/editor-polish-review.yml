# Temporary review runner. Publication remains an explicit connector operation.
name: Editor polish review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-polish-review.yml]
permissions:
  contents: read
env:
  CANDIDATE: 84c7dfa5da5aa3de4887d7dfcc09af29adffcd26
jobs:
  presentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Check the only new test edit
        run: ./node_modules/.bin/oxfmt --check apps/web/e2e/editorPresentation.e2e.ts
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -30 "$RUNNER_TEMP/browser.log"; exit 1; }
      - name: Exact viewport, selection, focus, input, save and undo
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.presentation.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-presentation-after
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
  extensions:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Build server
        run: bun run --cwd apps/server build
      - uses: ./.github/actions/build-code-oss
      - name: Install isolated prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap gdb
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -30 "$RUNNER_TEMP/browser.log"; exit 1; }
      - name: Actual formatter, local VSIX and contributed debugger journeys
        env:
          SYNARA_TEST_CODE_OSS_HOST: ${{ github.workspace }}/apps/server/dist/code-oss/extension-host.mjs
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.extensions.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: repaired-extension-ui-evidence
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
  evidence:
    needs: presentation
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: editor-presentation-before
          run-id: 38893890004
          github-token: ${{ github.token }}
          path: evidence/before
      - uses: actions/download-artifact@v4
        with:
          name: editor-presentation-after
          path: evidence/after
      - name: Preserve original screenshots as reviewable blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readdir, readFile } from 'node:fs/promises';
          import path from 'node:path';
          async function api(endpoint, body) {
            const response = await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`, {
              method: body ? 'POST' : 'GET',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              ...(body ? { body: JSON.stringify(body) } : {}), signal: AbortSignal.timeout(30000),
            });
            if (!response.ok) throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const tree = [];
          for (const state of ['before', 'after']) {
            const root = `evidence/${state}`;
            const files = await readdir(root, { recursive: true });
            for (const theme of ['light', 'dark']) {
              const filename = `${state}-${theme}-editor-scrollbar.png`;
              const matches = files.filter(file => path.basename(file) === filename && !file.split(path.sep).includes('attachments'));
              if (matches.length !== 1) throw new Error(`Expected one original screenshot ${filename}`);
              const bytes = await readFile(path.join(root, matches[0]));
              if (bytes.length > 2_000_000 || !bytes.subarray(0, 8).equals(Buffer.from([137,80,78,71,13,10,26,10]))) throw new Error(`Invalid screenshot ${filename}`);
              const dimensions = { width: bytes.readUInt32BE(16), height: bytes.readUInt32BE(20) };
              if (dimensions.width !== 1440 || dimensions.height < 900) throw new Error(`Unexpected screenshot dimensions ${filename}`);
              const blob = await api('git/blobs', { content: bytes.toString('base64'), encoding: 'base64' });
              const entry = { path: `docs/editor/evidence/presentation-${filename}`, mode: '100644', type: 'blob', sha: blob.sha };
              tree.push(entry);
              console.log('AUTHENTIC_SCREENSHOT', JSON.stringify({ ...entry, ...dimensions, bytes: bytes.length }));
            }
          }
          const base = await api(`git/commits/${process.env.CANDIDATE}`);
          const result = await api('git/trees', { base_tree: base.tree.sha, tree });
          console.log('EVIDENCE_TREE', result.sha);
          console.log('EVIDENCE_ENTRIES', JSON.stringify(tree));
          NODE
