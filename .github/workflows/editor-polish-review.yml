# Temporary review runner. Application refs are published only through the connector.
name: Editor polish review
on:
  push:
    branches: [feat/synara-code-oss-extensions]
    paths: [.github/workflows/editor-polish-review.yml]
permissions:
  contents: read
env:
  CANDIDATE_BASE: ea6dfcfb33f377a3938e65bff8f525b4ddec8176
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.objects.outputs.candidate }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CANDIDATE_BASE }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Apply Strict Mode ownership repair
        run: |
          node scripts/retain-editor-handoff.mjs
          ./node_modules/.bin/oxfmt apps/web/src/components/codeEditor/MonacoEditorSurface.tsx .github/workflows/editor-presentation-acceptance.yml
      - name: Preserve normalized objects and review the complete change set
        id: objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {readFile,appendFile} from 'node:fs/promises';
          async function api(endpoint,body){
            const response=await fetch(`https://api.github.com/repos/Emanuele-web04/synara/${endpoint}`,{
              method:body?'POST':'GET',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              ...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(30000)});
            if(!response.ok)throw new Error(`${endpoint}: ${response.status} ${await response.text()}`);
            return response.json();
          }
          const allowed=new Set(['apps/web/src/components/codeEditor/MonacoEditorSurface.tsx','.github/workflows/editor-presentation-acceptance.yml']);
          const paths=execFileSync('git',['diff','--name-only','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          const tree=[];
          for(const file of paths){
            if(!allowed.has(file))throw new Error(`Unexpected edit ${file}`);
            const blob=await api('git/blobs',{content:await readFile(file,'utf8'),encoding:'utf-8'});
            tree.push({path:file,mode:'100644',type:'blob',sha:blob.sha});
          }
          tree.push({path:'scripts/retain-editor-handoff.mjs',mode:'100644',type:'blob',sha:null});
          const parent=await api(`git/commits/${process.env.CANDIDATE_BASE}`);
          const result=await api('git/trees',{base_tree:parent.tree.sha,tree});
          const identity={name:'Commander Chara',email:'249489759+cmdr-chara@users.noreply.github.com'};
          const commit=await api('git/commits',{message:'fix(editor): retain explicit view handoff until the surviving editor is ready',tree:result.sha,parents:[process.env.CANDIDATE_BASE],author:identity,committer:identity});
          console.log('CANDIDATE_COMMIT',commit.sha);console.log('CANDIDATE_TREE',result.sha);console.log('NORMALIZED_FILES',JSON.stringify(tree));
          const diff=await api(`compare/bdd2f92f4b1dbcd70aec1d5b0771b7a570cea545...${commit.sha}?per_page=1`);
          console.log('FINAL_CHANGE_SET',JSON.stringify(diff.files.map(({filename,status,additions,deletions})=>({filename,status,additions,deletions}))));
          for(const file of diff.files){
            if(file.status==='removed'|| /(^scripts\/|lock|package\.json|\.env)/.test(file.filename))throw new Error(`Unexpected final path ${file.filename}`);
            console.log('REVIEW_FILE',file.filename,'\n',file.patch ?? 'No text patch supplied');
          }
          await appendFile(process.env.GITHUB_OUTPUT,`candidate=${commit.sha}\n`);
          NODE
  checks:
    name: Checks ${{ needs.prepare.outputs.candidate }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Format, lint and affected web typecheck
        run: |
          bun run fmt:check
          bun run lint > "$RUNNER_TEMP/lint.log" 2>&1 || { tail -60 "$RUNNER_TEMP/lint.log"; exit 1; }
          bun run --cwd apps/web typecheck > "$RUNNER_TEMP/types.log" 2>&1 || { tail -60 "$RUNNER_TEMP/types.log"; exit 1; }
      - name: Install browser
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:install > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -30 "$RUNNER_TEMP/browser.log"; exit 1; }
      - name: Editor lifetime and cancellation regressions
        if: ${{ !cancelled() }}
        run: bun run --cwd apps/web test:browser:ci -- --project=components src/components/codeEditor/editorViewHandoff.browser.tsx src/components/codeEditor/CodeEditorPane.browser.tsx src/components/WorkspaceFilePreview.editing.browser.tsx src/components/chat/RightDockGlassSurface.browser.tsx
  presentation:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          persist-credentials: false
      - uses: ./.github/actions/setup-workspace
      - name: Install browser
        run: bun run --cwd apps/web test:browser:install > "$RUNNER_TEMP/browser.log" 2>&1 || { tail -30 "$RUNNER_TEMP/browser.log"; exit 1; }
      - name: Strict focus, exact source/editor continuity and real input
        run: cd apps/web && ./node_modules/.bin/playwright test --config playwright.presentation.config.ts
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: editor-presentation-after
          path: apps/web/test-results
          retention-days: 14
          if-no-files-found: warn
