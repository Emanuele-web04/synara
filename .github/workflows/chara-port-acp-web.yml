name: Chara port ACP web integration

on:
  push:
    branches: [codex/generic-acp-provider]
    paths: [.github/workflows/chara-port-acp-web.yml]

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/generic-acp-provider
      - uses: ./.github/actions/setup-workspace
        with:
          electron: "false"
      - name: Port current web provider seams
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrences, found {found}: {old!r}")
              p.write_text(text.replace(old, new, count))

          patch(
              "apps/web/src/components/PluginLibrary.tsx",
              '  const devinCapabilitiesQuery = useQuery(providerComposerCapabilitiesQueryOptions("devin"));\n',
              '  const devinCapabilitiesQuery = useQuery(providerComposerCapabilitiesQueryOptions("devin"));\n  const acpCapabilitiesQuery = useQuery(providerComposerCapabilitiesQueryOptions("acp"));\n',
          )
          patch(
              "apps/web/src/components/PluginLibrary.tsx",
              '    devin: {\n      plugins: supportsPluginDiscovery(devinCapabilitiesQuery.data),\n      skills: supportsSkillDiscovery(devinCapabilitiesQuery.data),\n    },\n    antigravity:',
              '    devin: {\n      plugins: supportsPluginDiscovery(devinCapabilitiesQuery.data),\n      skills: supportsSkillDiscovery(devinCapabilitiesQuery.data),\n    },\n    acp: {\n      plugins: supportsPluginDiscovery(acpCapabilitiesQuery.data),\n      skills: supportsSkillDiscovery(acpCapabilitiesQuery.data),\n    },\n    antigravity:',
          )

          p = Path("apps/web/src/components/chat/ComposerModelEffortPicker.browser.tsx")
          text = p.read_text()
          needle = '  pi: [],\n};'
          if text.count(needle) < 2:
              raise SystemExit("ComposerModelEffortPicker: expected two provider maps")
          p.write_text(text.replace(needle, '  pi: [],\n  acp: [],\n};', 2))

          patch(
              "apps/web/src/components/chat/useChatProviderModels.ts",
              '      devin: resolveHint("devin"),\n    };',
              '      devin: resolveHint("devin"),\n      acp: resolveHint("acp"),\n    };',
          )
          patch(
              "apps/web/src/components/chat/useChatProviderStatus.ts",
              '    case "pi":\n      return normalizeCustomBinaryPath(providerOptions?.pi?.binaryPath);\n  }',
              '    case "pi":\n      return normalizeCustomBinaryPath(providerOptions?.pi?.binaryPath);\n    case "acp":\n      return normalizeCustomBinaryPath(providerOptions?.acp?.binaryPath);\n  }',
          )

          patch(
              "apps/web/src/composerDraftModels.ts",
              '    case "pi":\n      return {\n        provider,\n        model,\n        ...(options\n          ? { options: options as Extract<ModelSelection, { provider: "pi" }>["options"] }\n          : {}),\n      };\n  }',
              '    case "pi":\n      return {\n        provider,\n        model,\n        ...(options\n          ? { options: options as Extract<ModelSelection, { provider: "pi" }>["options"] }\n          : {}),\n      };\n    case "acp":\n      return {\n        provider,\n        model,\n        ...(options\n          ? { options: options as Extract<ModelSelection, { provider: "acp" }>["options"] }\n          : {}),\n      };\n  }',
          )

          patch(
              "apps/web/src/providerModelOptions.ts",
              '  type AntigravityModelSelection,\n  type ClaudeModelOptions,',
              '  type AntigravityModelSelection,\n  type AcpModelOptions,\n  type AcpModelSelection,\n  type ClaudeModelOptions,',
          )
          patch(
              "apps/web/src/providerModelOptions.ts",
              'export function buildModelSelection(\n  provider: "devin",\n  model: string,\n  options?: DevinModelOptions | null | undefined,\n): DevinModelSelection;\nexport function buildModelSelection(\n  provider: ProviderKind,',
              'export function buildModelSelection(\n  provider: "devin",\n  model: string,\n  options?: DevinModelOptions | null | undefined,\n): DevinModelSelection;\nexport function buildModelSelection(\n  provider: "acp",\n  model: string,\n  options?: AcpModelOptions | null | undefined,\n): AcpModelSelection;\nexport function buildModelSelection(\n  provider: ProviderKind,',
          )
          patch(
              "apps/web/src/providerModelOptions.ts",
              '    case "pi":\n      return options\n        ? {\n            provider,\n            model,\n            options: options as PiModelOptions,\n          }\n        : { provider, model };\n  }',
              '    case "pi":\n      return options\n        ? {\n            provider,\n            model,\n            options: options as PiModelOptions,\n          }\n        : { provider, model };\n    case "acp":\n      return options\n        ? {\n            provider,\n            model,\n            options: options as AcpModelOptions,\n          }\n        : { provider, model };\n  }',
          )

          path = "apps/web/src/hooks/useProviderModelCatalog.ts"
          patch(path,
              'import { getAppModelOptions, getCustomModelsByProvider, useAppSettings } from "../appSettings";',
              'import {\n  getAppModelOptions,\n  getCustomModelsByProvider,\n  parseAcpArgs,\n  useAppSettings,\n} from "../appSettings";')
          patch(path,
              '  const devinModelDiscoveryEnabled = shouldDiscoverProvider("devin");\n\n  const modelQueryOptionsByProvider = {',
              '  const devinModelDiscoveryEnabled = shouldDiscoverProvider("devin");\n  const acpModelDiscoveryEnabled = shouldDiscoverProvider("acp");\n\n  const modelQueryOptionsByProvider = {')
          patch(path,
              '    devin: providerModelsQueryOptions({\n      provider: "devin",\n      binaryPath: settings.devinBinaryPath || null,\n      cwd: discoveryCwd,\n      enabled: devinModelDiscoveryEnabled,\n    }),\n  } as const;',
              '    devin: providerModelsQueryOptions({\n      provider: "devin",\n      binaryPath: settings.devinBinaryPath || null,\n      cwd: discoveryCwd,\n      enabled: devinModelDiscoveryEnabled,\n    }),\n    acp: providerModelsQueryOptions({\n      provider: "acp",\n      binaryPath: settings.acpBinaryPath || null,\n      args: parseAcpArgs(settings.acpArgs),\n      cwd: discoveryCwd,\n      enabled: acpModelDiscoveryEnabled,\n    }),\n  } as const;')
          patch(path,
              '  const devinDynamicModelsQuery = useQuery(modelQueryOptionsByProvider.devin);\n',
              '  const devinDynamicModelsQuery = useQuery(modelQueryOptionsByProvider.devin);\n  const acpDynamicModelsQuery = useQuery(modelQueryOptionsByProvider.acp);\n')
          patch(path,
              '  const devinModelDiscoveryPending =\n    devinModelDiscoveryEnabled &&\n    !hasResolvedDevinModelDiscovery &&\n    isInitialModelDiscoveryPending(devinDynamicModelsQuery);\n  const antigravityModelDiscoveryPending =',
              '  const devinModelDiscoveryPending =\n    devinModelDiscoveryEnabled &&\n    !hasResolvedDevinModelDiscovery &&\n    isInitialModelDiscoveryPending(devinDynamicModelsQuery);\n  const hasResolvedAcpModelDiscovery =\n    acpDynamicModelsQuery.data?.source === "acp" &&\n    (acpDynamicModelsQuery.data.models.length ?? 0) > 0;\n  const acpModelDiscoveryPending =\n    acpModelDiscoveryEnabled &&\n    !hasResolvedAcpModelDiscovery &&\n    isInitialModelDiscoveryPending(acpDynamicModelsQuery);\n  const antigravityModelDiscoveryPending =')
          patch(path,
              '      devin: getAppModelOptions("devin", customModelsByProvider.devin, modelHintByProvider?.devin),\n    };',
              '      devin: getAppModelOptions("devin", customModelsByProvider.devin, modelHintByProvider?.devin),\n      acp: getAppModelOptions("acp", customModelsByProvider.acp, modelHintByProvider?.acp),\n    };')
          patch(path,
              '      devin: devinDynamicModelsQuery.data,\n    };',
              '      devin: devinDynamicModelsQuery.data,\n      acp: acpDynamicModelsQuery.data,\n    };')
          patch(path,
              '      "devin",\n    ] as const)',
              '      "devin",\n      "acp",\n    ] as const)')
          patch(path,
              '    devinDynamicModelsQuery.data,\n  ]);',
              '    devinDynamicModelsQuery.data,\n    acpDynamicModelsQuery.data,\n  ]);')
          patch(path,
              '      devin: devinModelDiscoveryPending,\n    }),',
              '      devin: devinModelDiscoveryPending,\n      acp: acpModelDiscoveryPending,\n    }),')
          patch(path,
              '      devinModelDiscoveryPending,\n    ],',
              '      devinModelDiscoveryPending,\n      acpModelDiscoveryPending,\n    ],')
          patch(path,
              '      devin: devinDynamicModelsQuery.data?.models ?? [],\n    }),',
              '      devin: devinDynamicModelsQuery.data?.models ?? [],\n      acp: acpDynamicModelsQuery.data?.models ?? [],\n    }),')
          patch(path,
              '      devinDynamicModelsQuery.data?.models,\n    ],',
              '      devinDynamicModelsQuery.data?.models,\n      acpDynamicModelsQuery.data?.models,\n    ],')

          path = "apps/web/src/lib/providerModelPrefetch.ts"
          patch(path,
              'import type { AppSettings } from "../appSettings";',
              'import { parseAcpArgs, type AppSettings } from "../appSettings";')
          patch(path,
              '        ...(settings.acpArgs !== undefined ? { args: parseAcpArgs(settings.acpArgs) } : {}),\n        cwd,\n      });',
              '        ...(settings.acpArgs !== undefined ? { args: parseAcpArgs(settings.acpArgs) } : {}),\n        cwd,\n        priority,\n      });')

          # App-settings launch fixtures: ACP defaults must not create an override.
          path = "apps/web/src/appSettings.test.ts"
          p = Path(path)
          text = p.read_text()
          old = '        piBinaryPath: "",\n        devinBinaryPath:'
          if text.count(old) < 2:
              raise SystemExit("appSettings.test: expected two blank ACP launch fixtures")
          p.write_text(text.replace(old, '        piBinaryPath: "",\n        acpBinaryPath: "",\n        acpArgs: "--acp",\n        devinBinaryPath:', 2))
          patch(path,
              '        piBinaryPath: "pi",\n      }),\n    ).toBeUndefined();',
              '        piBinaryPath: "pi",\n        acpBinaryPath: "cline",\n        acpArgs: "--acp",\n      }),\n    ).toBeUndefined();')

          # Composer-draft exhaustive model maps.
          p = Path("apps/web/src/composerDraftStore.models.test.ts")
          text = p.read_text()
          old = '        devin: [],\n      },'
          if text.count(old) < 4:
              raise SystemExit("composerDraftStore.models.test: expected four provider records")
          p.write_text(text.replace(old, '        devin: [],\n        acp: [],\n      },', 4))
          PY
      - name: Format touched files
        run: >-
          bunx oxfmt
          apps/web/src/appSettings.test.ts
          apps/web/src/components/PluginLibrary.tsx
          apps/web/src/components/chat/ComposerModelEffortPicker.browser.tsx
          apps/web/src/components/chat/useChatProviderModels.ts
          apps/web/src/components/chat/useChatProviderStatus.ts
          apps/web/src/composerDraftModels.ts
          apps/web/src/composerDraftStore.models.test.ts
          apps/web/src/hooks/useProviderModelCatalog.ts
          apps/web/src/lib/providerModelPrefetch.ts
          apps/web/src/providerModelOptions.ts
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bun run typecheck
      - name: Remove one-shot workflow
        if: always()
        run: rm -f .github/workflows/chara-port-acp-web.yml
      - name: Commit port
        if: always()
        shell: bash
        run: |
          git config user.name Chara
          git config user.email legend.alkalex07@gmail.com
          git add -A
          git diff --cached --check
          git commit -m "fix: integrate generic ACP into current web provider maps"
          git push origin HEAD:codex/generic-acp-provider
      - name: Fail if typecheck still fails
        if: steps.typecheck.outcome == 'failure'
        run: exit 1
