name: CI experiments

on:
  push:
    branches: [codex/ci-cross-platform-measurements]
    paths: [.github/workflows/ci-benchmark.yml, .github/scripts/ci-benchmark.mjs]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-experiments-${{ github.ref }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  install:
    name: Install comparison (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Cold A/B/A installs and focused correctness checks
        env:
          BENCH_PROFILE: install
        run: node .github/scripts/ci-benchmark.mjs
      - name: Upload raw measurements, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.os }}
          path: benchmark-results
          retention-days: 14
          if-no-files-found: error

  test-profile:
    name: Test profile (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        profile: [server, browser]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Install exact workspace
        run: bun install --frozen-lockfile
      - name: Verify native PTY
        if: matrix.profile == 'server'
        run: node scripts/node-pty-smoke.mjs
      - name: Install Chromium
        if: matrix.profile == 'browser'
        working-directory: apps/web
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run repeated unchanged test workload
        env:
          BENCH_PROFILE: ${{ matrix.profile }}
        run: node .github/scripts/ci-benchmark.mjs
      - name: Upload raw measurements, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-${{ matrix.profile }}
          path: benchmark-results
          retention-days: 14
          if-no-files-found: error
