name: CI cross-platform experiment

on:
  push:
    branches: [codex/ci-cross-platform-evidence]
    paths:
      - .github/workflows/ci-experiment.yml
      - .github/scripts/benchmark-installs.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-experiment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: git archive --format=tar -o "$RUNNER_TEMP/source.tar" HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: public-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 3

  install:
    name: Cold installs (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-14, macos-15-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - name: Compare identical-source cold installs
        run: node .github/scripts/benchmark-installs.mjs
      - name: Record formatter output
        if: always()
        shell: bash
        run: |
          if [ -x node_modules/.bin/oxfmt ]; then
            node_modules/.bin/oxfmt .github/scripts/benchmark-installs.mjs .github/workflows/ci-experiment.yml
            git diff > "$RUNNER_TEMP/install-benchmark/format.patch"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: installs-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/install-benchmark/results.json
            ${{ runner.temp }}/install-benchmark/format.patch
          retention-days: 7
          if-no-files-found: error
