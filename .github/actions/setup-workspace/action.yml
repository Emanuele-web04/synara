name: Setup workspace
description: Reproducible workspace setup with caches only where they are consumed

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"
  turbo:
    description: Restore build outputs for a lane that actually invokes Turbo builds.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json

    # Do not archive Bun's unpacked package store. The measured Windows hit
    # spent 326 seconds extracting it, before a 33-second frozen install.
    # Linux already restores the installed tree; keeping both duplicates IO.
    - name: Cache node_modules
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        # Retain Electron isolation: its binary is installed inside this tree.
        # Exact keys only; a stale dependency tree is not an install substitute.
        key: ${{ runner.os }}-${{ runner.arch }}-modules-v2-electron-${{ inputs.electron }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'scripts/package.json', 'patches/**', '.github/actions/setup-workspace/action.yml') }}

    # Only unit/build lanes consume this cache. Tests and typechecks remain
    # cache:false in turbo.json; Turbo validates each build task's fingerprint.
    - name: Cache Turbo outputs
      if: ${{ inputs.turbo == 'true' }}
      uses: actions/cache@v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-

    - name: Cache Electron runtime
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      run: bun install --frozen-lockfile

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
