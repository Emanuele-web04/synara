name: Setup workspace
description: Shared tool setup, frozen dependency installation, and opt-in build caches

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"
  turbo:
    description: Restore build outputs only for jobs that actually consume Turbo builds.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json

    # Retain the Linux tree cache until a lifecycle-equivalent cold-install
    # benchmark proves otherwise. Electron's extracted binary lives inside it.
    # Windows isolated links cannot be restored reliably; always recreate them.
    - name: Cache node_modules
      id: modules
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ runner.os }}-bun-node-modules-electron-${{ inputs.electron }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-node-modules-electron-${{ inputs.electron }}-

    # An exact modules hit already contains the installed packages. Do not
    # restore a second archive on that path. No Windows package cache: measured
    # restore was 331s (326s extraction), versus 34s for the subsequent install.
    - name: Cache Bun install
      if: ${{ runner.os != 'Windows' && steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

    # Tests/typechecking remain cache:false. Only unit/build lanes have cached
    # build prerequisites; restoring/saving this store elsewhere does no work.
    - name: Cache Turbo outputs
      if: ${{ inputs.turbo == 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-turbo-

    - name: Cache Electron runtime
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

    # Never bypass frozen installation or the dependency patches on a cache hit.
    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      run: bun install --frozen-lockfile

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
