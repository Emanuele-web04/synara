name: Setup workspace
description: Shared tool setup, dependency install, and caches for Synara CI jobs

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"

  profile:
    description: Dependency closure to install (full or product).
    default: "full"
  turbo:
    description: Persist cacheable build artifacts for this lane.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      id: node
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        package-manager-cache: false

    # Scope native dependencies by architecture, toolchain, patches and profile.
    # Windows archive extraction cost more than a cold frozen installation.
    - name: Cache node_modules
      id: modules
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: modules-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ inputs.profile }}-${{ inputs.electron }}-${{ hashFiles('bun.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json', 'scripts/package.json', 'patches/**') }}

    # Do not restore a second dependency archive after an exact modules hit.
    - name: Cache Bun install
      if: ${{ runner.os != 'Windows' && steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: bun-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'package.json') }}

    # Persist only for consumers of build artifacts. Tests/typechecks are uncached.
    # No cross-OS/architecture/toolchain/patch fallback for native build outputs.
    - name: Cache Turbo outputs
      if: ${{ inputs.turbo == 'true' }}
      uses: actions/cache@v5
      with:
        path: .turbo
        key: turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'patches/**') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          turbo-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('bun.lock', 'package.json', 'turbo.json', 'patches/**') }}-

    - name: Cache Electron runtime
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        WORKSPACE_PROFILE: ${{ inputs.profile }}
      run: |
        case "$WORKSPACE_PROFILE" in
          full) bun install --frozen-lockfile ;;
          product) node .github/scripts/install-workspace.mjs product ;;
          *) echo "Unsupported CI install profile: $WORKSPACE_PROFILE" >&2; exit 1 ;;
        esac

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
