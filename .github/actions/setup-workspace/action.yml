name: Setup workspace
description: Shared tool setup, dependency install, and caches for Synara CI jobs

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"
  turbo:
    description: Restore and save build outputs only for lanes that run Turbo build prerequisites.
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json
        package-manager-cache: false

    # Measured Windows setup: 393s with this archive, 173s without it.
    # Keep Linux caches: a comparable cold lifecycle install has not proved a win.
    - name: Cache Bun install
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

    # Always reconcile with the frozen lockfile. Electron's extracted binary
    # lives inside node_modules, so its lane must retain a separate cache key.
    # Windows restores can lose isolated dependency links; use a fresh install.
    - name: Cache node_modules
      if: ${{ runner.os != 'Windows' }}
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ runner.os }}-bun-node-modules-electron-${{ inputs.electron }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-node-modules-electron-${{ inputs.electron }}-

    # Static, browser and Windows lanes have no cacheable Turbo tasks. Avoid
    # restoring and re-saving identical snapshots there. Tests/typechecks remain
    # cache:false; Turbo fingerprints build prerequisites before any reuse.
    - name: Cache Turbo outputs
      if: ${{ inputs.turbo == 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-${{ hashFiles('.github/workflows/ci.yml') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-turbo-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-turbo-

    - name: Cache Electron runtime
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-electron-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      run: bun install --frozen-lockfile

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
