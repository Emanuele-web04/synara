name: Setup workspace
description: Reproducible dependency setup sized to each CI lane

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"
  scope:
    description: "Install scope: full, static (root and scripts), runtime (all except marketing), web (root and web), or server (root, CLI, Desktop and analytics)."
    default: "full"
  turbo:
    description: Restore Turbo build artifacts for jobs that use Turbo; pushes to main also save them.
    default: "false"
  save-modules:
    description: Save the node_modules archive after a miss. Only one job per cache key sets this.
    default: "false"
  web-transform-cache:
    description: CI lane name that owns a React Compiler transform cache; empty disables it.
    default: ""
  web-transform-fallback:
    description: Browser lane to borrow compiler transforms from when the primary lane archive is missing.
    default: ""

runs:
  using: composite
  steps:
    - name: Validate install scope
      shell: bash
      env:
        WORKSPACE_SCOPE: ${{ inputs.scope }}
        ELECTRON: ${{ inputs.electron }}
      run: |
        case "$WORKSPACE_SCOPE" in
          full|static|runtime|web|server) ;;
          *) echo "::error::Unknown workspace scope: $WORKSPACE_SCOPE"; exit 1 ;;
        esac
        if [ "$ELECTRON" = "true" ] && [ "$WORKSPACE_SCOPE" != "full" ] && [ "$WORKSPACE_SCOPE" != "runtime" ] && [ "$WORKSPACE_SCOPE" != "server" ]; then
          echo "::error::Electron requires a full, runtime, or server install."
          exit 1
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ env.SYNARA_CI_NODE_VERSION }}
        node-version-file: ${{ env.SYNARA_CI_NODE_VERSION == '' && 'package.json' || '' }}

    - name: Fingerprint dependency inputs
      id: modules-key
      if: ${{ runner.os != 'Windows' && (inputs.scope == 'full' || inputs.scope == 'web' || inputs.scope == 'server') }}
      shell: bash
      run: |
        fingerprint="$(node scripts/ci-install-key.ts)"
        test -n "$fingerprint" || { echo "::error::The dependency fingerprint is empty."; exit 1; }
        printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Fingerprint web compiler inputs
      id: web-transform-key
      if: inputs.web-transform-cache != ''
      shell: bash
      run: |
        fingerprint="$(node apps/web/scripts/compiler-cache-key.ts)"
        test -n "$fingerprint" || { echo "::error::The web compiler fingerprint is empty."; exit 1; }
        printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

    # Reuse the existing dependency-only keys, including in jobs that install
    # the Electron runtime later. Static, runtime, and Windows install directly.
    # One job per exact key sets save-modules to seed the archive after a miss.
    - name: Restore node_modules
      id: modules
      if: ${{ runner.os != 'Windows' && (inputs.scope == 'full' || inputs.scope == 'web' || inputs.scope == 'server') }}
      uses: actions/cache/restore@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-modules-v3-electron-false-${{ inputs.scope != 'full' && format('{0}-', inputs.scope) || '' }}${{ steps.modules-key.outputs.fingerprint }}

    # A lane that rebuilds its dependency archive measures the install, so its
    # job budget is reported without being enforced (.github/scripts/job-budget.mjs).
    - name: Mark cold dependency cache
      if: ${{ steps.modules.outcome == 'success' && steps.modules.outputs.cache-hit != 'true' }}
      shell: bash
      run: echo "CI_COLD_CACHE=node_modules" >> "$GITHUB_ENV"

    # Tests and typechecks remain cache:false. OS/architecture boundaries prevent
    # native build products from crossing platforms. Browser/Windows/static jobs
    # do not consume Turbo outputs and must not restore or save this archive.
    # Pull requests restore the newest main entry but never save: their entries
    # are scoped to the PR ref and a per-SHA save on every run crowded the quota.
    - name: Restore Turbo outputs
      if: ${{ inputs.turbo == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      uses: actions/cache/restore@v5
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-

    - name: Cache Turbo outputs (main)
      if: ${{ inputs.turbo == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      uses: actions/cache@v5
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-

    # Browser tests, Desktop CI and the Core unit lane use separate cache
    # namespaces. apps/web/scripts/transform-cache.ts (and, for the Core
    # lane's compiler guard, apps/web/src/test/compilerEventCache.ts) keys each
    # result by the exact module source, so an archive only ever supplies output
    # for unchanged modules; a changed module is always recompiled. The key prefix
    # hashes the dependency graph, toolchain, config and patches. Workspace
    # release-version metadata does not change the graph. Pull requests
    # restore the newest accessible archive for their lane and seed that lane
    # on a miss. Pushes to main save one entry per commit.
    - name: Restore web transform cache
      id: web-transform
      if: ${{ inputs.web-transform-cache != '' && !(github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      uses: actions/cache/restore@v5
      with:
        path: ${{ runner.temp }}/web-transform-cache
        key: ${{ runner.os }}-${{ runner.arch }}-web-transform-v2-${{ inputs.web-transform-cache }}-${{ steps.web-transform-key.outputs.fingerprint }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-web-transform-v2-${{ inputs.web-transform-cache }}-${{ steps.web-transform-key.outputs.fingerprint }}-

    # A fallback archive can warm a cold lane before it saves to its own key.
    - name: Cache web transform results (main or first branch run)
      if: ${{ inputs.web-transform-cache != '' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || steps.web-transform.outputs.cache-matched-key == '') }}
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/web-transform-cache
        key: ${{ runner.os }}-${{ runner.arch }}-web-transform-v2-${{ inputs.web-transform-cache }}-${{ steps.web-transform-key.outputs.fingerprint }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-web-transform-v2-${{ inputs.web-transform-cache }}-${{ steps.web-transform-key.outputs.fingerprint }}-
          ${{ inputs.web-transform-fallback != '' && format('{0}-{1}-web-transform-v2-{2}-{3}-', runner.os, runner.arch, inputs.web-transform-fallback, steps.web-transform-key.outputs.fingerprint) || '' }}

    # A browser process that exits mid-compile leaves its claim directory or
    # staging file behind, and a later save would archive it. Drop both so no
    # run waits on a claim whose owner is gone.
    - name: Enable web transform cache
      if: ${{ inputs.web-transform-cache != '' }}
      shell: bash
      run: |
        cache="$RUNNER_TEMP/web-transform-cache"
        if [ -d "$cache" ]; then
          find "$cache" -type d -name '*.lock' -prune -exec rm -rf {} +
          find "$cache" -type f -name '*.tmp' -delete
        fi
        echo "SYNARA_WEB_TRANSFORM_CACHE_DIR=$cache" >> "$GITHUB_ENV"

    # Keyed by the Electron resolution alone, so release version bumps that
    # rewrite bun.lock keep the downloaded runtime.
    - name: Fingerprint Electron runtime
      id: electron-key
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        fingerprint="$(node .github/scripts/lockfile-package-key.mjs electron)"
        test -n "$fingerprint" || { echo "::error::The Electron runtime fingerprint is empty."; exit 1; }
        printf 'fingerprint=%s\n' "$fingerprint" >> "$GITHUB_OUTPUT"

    - name: Cache Electron runtime
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-${{ runner.arch }}-electron-v2-${{ steps.electron-key.outputs.fingerprint }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        WORKSPACE_SCOPE: ${{ inputs.scope }}
      run: |
        # Hosted Windows checks out on D:, while Bun's default home cache is on C:.
        # Match the measured setup so package hardlinks can stay on one volume.
        if [ "$RUNNER_OS" = "Windows" ]; then
          export BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-install-cache"
          echo "Bun install cache: $BUN_INSTALL_CACHE_DIR"
        fi
        # Bound dependency lifecycles. Root postinstall patches each installed
        # TypeScript compiler once, after workspace hooks have completed.
        case "$WORKSPACE_SCOPE" in
          full) bun install --frozen-lockfile --concurrent-scripts=1 ;;
          static) bun install --frozen-lockfile --filter './' --filter '@synara/scripts' --concurrent-scripts=1 ;;
          runtime) bun install --frozen-lockfile --filter '!@synara/marketing' --concurrent-scripts=1 ;;
          web) bun install --frozen-lockfile --filter './' --filter '@synara/web' --concurrent-scripts=1 ;;
          # The server host-usage tests import the Desktop relay and analytics Worker.
          server) bun install --frozen-lockfile --filter './' --filter '@synara/cli' --filter '@synara/desktop' --filter '@synara/analytics' --concurrent-scripts=1 ;;
        esac

    # The packed Electron runtime has a separate cache. Save dependencies
    # before extracting it so Server and Desktop can share the same archive.
    - name: Save node_modules
      if: ${{ runner.os != 'Windows' && (inputs.scope == 'full' || inputs.scope == 'web' || inputs.scope == 'server') && inputs.save-modules == 'true' && steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ steps.modules.outputs.cache-primary-key }}

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
