name: Setup workspace
description: Reproducible dependency setup sized to each CI lane

inputs:
  electron:
    description: Install the Electron runtime binary.
    default: "false"
  scope:
    description: "Install scope: full, static (root and scripts), or runtime (all except marketing)."
    default: "full"
  turbo:
    description: Persist Turbo build artifacts for jobs that use Turbo.
    default: "false"

runs:
  using: composite
  steps:
    - name: Validate install scope
      shell: bash
      env:
        WORKSPACE_SCOPE: ${{ inputs.scope }}
        ELECTRON: ${{ inputs.electron }}
      run: |
        case "$WORKSPACE_SCOPE" in
          full|static|runtime) ;;
          *) echo "::error::Unknown workspace scope: $WORKSPACE_SCOPE"; exit 1 ;;
        esac
        if [ "$ELECTRON" = "true" ] && [ "$WORKSPACE_SCOPE" = "static" ]; then
          echo "::error::Electron requires a full or runtime install."
          exit 1
        fi

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: package.json

    # Small filtered installs cost less than archive transfer/extraction. Never
    # restore a full tree into a filtered lane or save it under the full key.
    # Windows isolated links are rebuilt by Bun, not restored from an archive.
    - name: Cache node_modules
      id: modules
      if: ${{ runner.os != 'Windows' && inputs.scope == 'full' }}
      uses: actions/cache@v5
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          scripts/node_modules
        key: ${{ runner.os }}-${{ runner.arch }}-bun-modules-v2-electron-${{ inputs.electron }}-${{ hashFiles('bun.lock', 'package.json') }}

    # A modules hit already contains the dependency payload. Restoring a second
    # archive is redundant. The Windows package archive was slower than cold install.
    - name: Cache Bun install
      if: ${{ runner.os != 'Windows' && inputs.scope == 'full' && steps.modules.outputs.cache-hit != 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-v2-${{ hashFiles('bun.lock', 'package.json') }}

    # Tests and typechecks remain cache:false. OS/architecture boundaries prevent
    # native build products from crossing platforms. Browser/Windows/static jobs
    # do not consume Turbo outputs and must not restore or save this archive.
    - name: Cache Turbo outputs
      if: ${{ inputs.turbo == 'true' }}
      uses: actions/cache@v5
      with:
        path: |
          .turbo
          node_modules/.cache/turbo
        key: ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-${{ github.job }}-${{ strategy.job-index || 0 }}-
          ${{ runner.os }}-${{ runner.arch }}-turbo-v2-${{ hashFiles('bun.lock') }}-

    - name: Cache Electron runtime
      if: ${{ inputs.electron == 'true' }}
      uses: actions/cache@v5
      with:
        path: ~/.cache/electron
        key: ${{ runner.os }}-${{ runner.arch }}-electron-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        WORKSPACE_SCOPE: ${{ inputs.scope }}
      run: |
        # Hosted Windows checks out on D:, while Bun's default home cache is on C:.
        # Match the measured setup so package hardlinks can stay on one volume.
        concurrent_scripts=()
        if [ "$RUNNER_OS" = "Windows" ]; then
          export BUN_INSTALL_CACHE_DIR="$RUNNER_TEMP/bun-install-cache"
          echo "Bun install cache: $BUN_INSTALL_CACHE_DIR"
          # Several workspace prepare scripts run `effect-language-service patch`
          # concurrently against the same isolated-store typescript.js. A patcher
          # that require()s the file mid-write falls back to the @typescript/native
          # (7.x) store entry, which has no ScriptTarget, and crashes the install.
          # Serializing lifecycle scripts removes the race; the extra seconds are
          # lost in the noise of Windows install timing (101-223s measured).
          concurrent_scripts=(--concurrent-scripts=1)
        fi
        case "$WORKSPACE_SCOPE" in
          full) bun install --frozen-lockfile "${concurrent_scripts[@]}" ;;
          static) bun install --frozen-lockfile "${concurrent_scripts[@]}" --filter './' --filter '@synara/scripts' ;;
          runtime) bun install --frozen-lockfile "${concurrent_scripts[@]}" --filter '!@synara/marketing' ;;
        esac

    - name: Install Electron test runtime
      if: ${{ inputs.electron == 'true' }}
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if node apps/desktop/node_modules/electron/install.js; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep $((attempt * 5))
        done
