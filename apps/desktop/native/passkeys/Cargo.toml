[package]
name = "synara-passkey-helper"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
webauthn-authenticator-rs = { version = "=0.5.5", default-features = false, features = ["cable"] }
webauthn-rs-proto = "=0.5.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor_2 = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
url = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
psl = "2"
openssl = { version = "0.10", features = ["vendored"] }

[patch.crates-io]
webauthn-authenticator-rs = { path = "../../.electron-runtime/passkeys/webauthn-authenticator-rs" }

[profile.release]
strip = true
lto = "thin"
